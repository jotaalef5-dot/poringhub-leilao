  function colunasMembros() {
    const e = App.estado, cols = [];
    for (const it of PH.itensAtivos(e)) {
      cols.push({ id: it.id, nome: it.curto, cor: it.cor, icone: it.icone });
      if (it.bonus) cols.push({ id: it.bonus.id, nome: it.bonus.curto, cor: it.bonus.cor || 'rosa', icone: it.bonus.icone || 'pacote' });
    }
    if (e.itens.some(i => i.designado)) cols.push({ id: '__desig', nome: 'Designados', cor: 'sol', icone: null });
    return cols;
  }
  function valorColuna(t, col) {
    if (!t) return 0;
    if (col.id === '__desig') return App.estado.itens.reduce((s, it) => s + (it.designado ? (t.porItem[it.designado.id] || 0) : 0), 0);
    return t.porItem[col.id] || 0;
  }

  function membrosFiltrados() {
    const e = App.estado, f = App.membros, t = PH.totais(e);
    let lista = Object.values(e.membros).filter(m => f.saiu || m.ativo !== false);
    if (f.busca.trim()) {
      const q = semAcento(f.busca.trim());
      lista = lista.filter(m => semAcento(m.nick).includes(q) || semAcento(m.classe).includes(q));
    }
    const tot = id => (t[id] ? t[id].total : 0);
    const ult = id => (t[id] && t[id].ultima) || '0000';
    const porNick = (a, b) => PH.compararNick(a.nick, b.nick);
    if (f.ordem === 'mais') lista.sort((a, b) => tot(b.id) - tot(a.id) || porNick(a, b));
    else if (f.ordem === 'menos') lista.sort((a, b) => tot(a.id) - tot(b.id) || (ult(a.id) < ult(b.id) ? -1 : ult(a.id) > ult(b.id) ? 1 : 0) || porNick(a, b));
    else if (f.ordem === 'antiga') lista.sort((a, b) => (ult(a.id) < ult(b.id) ? -1 : ult(a.id) > ult(b.id) ? 1 : 0) || porNick(a, b));
    else lista.sort(porNick);
    return { lista, t };
  }

  function viewMembros() {
    const e = App.estado, staff = ehStaff(), f = App.membros;
    const t = PH.totais(e);
    const ativos = Object.values(e.membros).filter(m => m.ativo !== false);
    const nunca = ativos.filter(m => !t[m.id] || !t[m.id].total).length;
    return '<div class="painel-cabeca"><div><h1>Membros</h1><p class="sub">' + plural(ativos.length, 'membro', 'membros') + ' na guilda' +
      (nunca ? ', ' + plural(nunca, 'ainda não levou nada', 'ainda não levaram nada').replace(/^\d+ /, nunca + ' ') : '') + '.</p></div>' +
      (staff ? '<div class="linha-acoes"><button type="button" class="btn btn-p" data-acao="importar-membros">' + ic('upload') + 'Importar lista</button>' +
        '<button type="button" class="btn btn-p btn-primario" data-acao="novo-membro">' + ic('usuarioMais') + 'Novo membro</button></div>' : '') +
      '</div>' +
      '<div class="linha-acoes">' +
      '<label class="busca"><span class="sr">Buscar membro</span>' + ic('busca') + '<input class="entrada" type="search" id="busca-membros" data-acao="busca-membros" placeholder="Buscar por nick ou classe" value="' + esc(f.busca) + '" autocomplete="off"></label>' +
      '<label class="sr" for="ordem-membros">Ordenar por</label><select class="entrada" id="ordem-membros" data-acao="ordem-membros" style="width:auto;flex:none">' +
      [['alfa', 'Ordem alfabética'], ['mais', 'Quem mais levou'], ['menos', 'Quem menos levou'], ['antiga', 'Há mais tempo sem levar']].map(o => '<option value="' + o[0] + '"' + (f.ordem === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') +
      '</select>' +
      '<label class="check"><input type="checkbox" id="mostrar-saiu" data-acao="mostrar-saiu"' + (f.saiu ? ' checked' : '') + '> Mostrar quem saiu</label>' +
      '<button type="button" class="btn btn-p" data-acao="imagem-membros">' + ic('imagem') + 'Imagem</button>' +
      '</div>' +
      '<p class="dica">Os números são as unidades que cada membro recebeu desde o começo: pelo leilão, por cessão ou como designado. Clique em um nick para ver a ficha.</p>' +
      '<div id="tabela-membros">' + tabelaMembros() + '</div>';
  }

  function tabelaMembros() {
    const { lista, t } = membrosFiltrados();
    if (!Object.keys(App.estado.membros).length) {
      return vazio('Nenhum membro cadastrado ainda.', ehStaff() ? 'Use Novo membro, ou Importar lista para colar todos de uma vez.' : 'A staff ainda vai cadastrar a guilda.');
    }
    if (!lista.length) return vazio('Ninguém encontrado com essa busca.', '');
    const cols = colunasMembros();
    return '<div class="rolagem"><table><thead><tr><th>Membro</th>' +
      cols.map(c => '<th class="n"><span class="th-item ' + tom(c.cor) + '">' + (c.icone ? icItem(c.icone) : ic('designado')) + esc(c.nome) + '</span></th>').join('') +
      '<th class="n">Total</th><th>Última vez</th></tr></thead><tbody>' +
      lista.map(m => {
        const tm = t[m.id];
        return '<tr class="clicavel' + (m.ativo === false ? ' saiu' : '') + (meuId() === m.id ? ' eu' : '') + '" data-acao="abrir-membro" data-membro="' + m.id + '" tabindex="0">' +
          '<td><span class="cel-membro"><strong>' + esc(m.nick) + '</strong><span>' + esc(m.classe || 'Sem classe') + (m.ativo === false ? ', saiu em ' + PH.fmtData(m.saiu) : '') + '</span></span></td>' +
          cols.map(c => { const v = valorColuna(tm, c); return '<td class="n' + (v ? '' : ' zero') + '">' + (v || '·') + '</td>'; }).join('') +
          '<td class="n total">' + (tm ? tm.total : 0) + '</td>' +
          '<td>' + (tm && tm.ultima ? PH.fmtData(tm.ultima) : '<span class="dica">nunca</span>') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  function renderTabelaMembros() { const el = $('#tabela-membros'); if (el) el.innerHTML = tabelaMembros(); }

  function linhaRegistro(r, cat) {
    const c = cat[r.i] || { nome: r.i, cor: 'uva', icone: 'bau' };
    const tags = {
      levou: '<span class="tag tag-ok">' + (r.o === 'prioridade' ? 'levou, vez devolvida' : 'levou') + '</span>',
      recebeu: '<span class="tag tag-cede">recebeu</span>',
      designado: '<span class="tag tag-prio">designado</span>',
      faltou: '<span class="tag tag-falta">faltou</span>',
      naoquis: '<span class="tag">não quis</span>',
      cedeu: '<span class="tag tag-cede">cedeu</span>'
    };
    let detalhe = '';
    if (r.t === 'recebeu') detalhe = 'de ' + esc(nick(r.x));
    else if (r.t === 'cedeu') detalhe = 'para ' + esc(nick(r.x));
    else if (r.t === 'faltou') detalhe = 'ganhou a vez devolvida';
    return '<div class="linha"><span class="quem num">' + PH.fmtData(r.d) + '</span>' +
      '<span class="oque ' + tom(c.cor) + '">' + icItem(c.icone) + '<span>' + esc(c.nome) + (r.q > 1 ? ' ×' + r.q : '') + '</span></span>' +
      (tags[r.t] || '') + '<span class="dica">' + detalhe + '</span>' +
      (r.n ? '<span class="obs">' + esc(r.n) + '</span>' : '') + '</div>';
  }

  function janelaFicha(id) {
    const e = App.estado, m = e.membros[id];
    if (!m) return;
    const t = PH.totais(e)[id] || { total: 0, porItem: {}, ultima: null };
    const cat = PH.catalogo(e);
    const regs = PH.registrosDoMembro(e, id);
    const prios = PH.prioridadesDoMembro(e, id);
    const posicoes = PH.itensAtivos(e).map(it => {
      const p = PH.posicaoNaFila(e, it.id, id);
      return '<span class="mini ' + tom(it.cor) + '">' + icItem(it.icone) + esc(it.curto) + ': ' + (p ? 'nº ' + p : 'fora da fila') + '</span>';
    }).join('');
    const numeros = Object.values(cat).filter(c => t.porItem[c.id]).map(c => '<div class="numero ' + tom(c.cor) + '"><strong>' + t.porItem[c.id] + '</strong><span>' + esc(c.nome) + '</span></div>').join('');
    let corpo = (m.ativo !== false ? '<div class="linha-acoes">' + posicoes + '</div>' : '') +
      '<div class="ficha-numeros"><div class="numero"><strong>' + t.total + '</strong><span>unidades no total</span></div>' + numeros + '</div>';
    if (prios.length) {
      corpo += '<div class="devolvidas"><p>Vez devolvida para o próximo leilão</p><ul>' +
        prios.map(p => '<li class="tag tag-prio">' + esc((PH.item(e, p.itemId) || {}).curto || p.itemId) + ' <small>· ' + esc(TXT_MOTIVO[p.motivo] || 'ajuste') + ' ' + PH.fmtDataCurta(p.d) + '</small></li>').join('') + '</ul></div>';
    }
    corpo += '<h3 class="secao-titulo">O que aconteceu</h3>' +
      (regs.length ? '<div class="linhas">' + regs.slice(0, 80).map(r => linhaRegistro(r, cat)).join('') + '</div>' + (regs.length > 80 ? '<p class="dica">Mostrando os 80 registros mais recentes.</p>' : '') : vazio('Nada registrado ainda.', ''));
    const acoes = [];
    if (ehStaff()) {
      if (m.ativo !== false) {
        acoes.push({ texto: 'Remover da guilda', classe: 'btn-leve', icone: 'lixo', acao: async () => { await removerMembro(id); } });
        acoes.push({ texto: 'Editar', classe: 'btn-primario', icone: 'lapis', acao: () => { setTimeout(() => janelaMembroForm(id), 0); } });
      } else {
        acoes.push({ texto: 'Trazer de volta', classe: 'btn-primario', icone: 'desfazer', acao: async () => { await reativarMembro(id); } });
      }
    } else acoes.push({ texto: 'Fechar', classe: 'btn-leve' });
    abrirJanela({
      titulo: m.nick,
      sub: esc(m.classe || 'Sem classe') + (m.desde ? ', na guilda desde ' + PH.fmtData(m.desde) : '') + (m.ativo === false ? '. Saiu em ' + PH.fmtData(m.saiu) : '') +
        (t.ultima ? '. Última vez que levou: ' + PH.fmtData(t.ultima) : ''),
      corpo, larga: true, acoes
    });
  }

  function janelaMembroForm(id) {
    const e = App.estado, m = id ? e.membros[id] : null;
    const classes = Array.from(new Set(CLASSES.concat(Object.values(e.membros).map(x => x.classe).filter(Boolean)))).sort((a, b) => a.localeCompare(b, 'pt-BR'));
    const itens = PH.itensAtivos(e);
    const corpo =
      '<label class="campo"><span>Nick</span><input id="f-nick" maxlength="32" autocomplete="off" value="' + (m ? esc(m.nick) : '') + '"><small>Do jeito que aparece no jogo. A ordem da fila usa o nick.</small></label>' +
      '<label class="campo"><span>Classe</span><input id="f-classe" list="lista-classes" autocomplete="off" value="' + (m ? esc(m.classe || '') : '') + '"><datalist id="lista-classes">' + classes.map(c => '<option value="' + esc(c) + '">').join('') + '</datalist></label>' +
      '<div class="campo"><span>Participa das filas</span><div class="checks">' +
      itens.map(it => '<label class="check"><input type="checkbox" data-fila="' + it.id + '"' + (m && (m.fora || []).includes(it.id) ? '' : ' checked') + '> ' + esc(it.curto) + '</label>').join('') +
      '</div><small>Desmarque um item se o membro não pega ele. O membro sai só daquela fila.</small></div>';
    abrirJanela({
      titulo: m ? 'Editar ' + m.nick : 'Novo membro',
      corpo,
      acoes: [
        { texto: 'Cancelar', classe: 'btn-leve' },
        {
          texto: m ? 'Salvar' : 'Adicionar', classe: 'btn-primario', icone: 'check',
          acao: async (j) => {
            const nickNovo = j.$('#f-nick').value, classe = j.$('#f-classe').value;
            const fora = j.$$('[data-fila]').filter(c => !c.checked).map(c => c.dataset.fila);
            j.ocupado(true);
            let novo, nomeFinal;
            if (m) {
              novo = PH.editarMembro(App.estado, id, { nick: nickNovo, classe, fora });
              nomeFinal = novo.membros[id].nick;
              if (!(await salvarEstado(novo, 'Editou o membro ' + nomeFinal))) return false;
              toast(nomeFinal + ' atualizado.');
            } else {
              const r = PH.adicionarMembro(App.estado, { nick: nickNovo, classe }, PH.hoje());
              novo = r.estado;
              if (fora.length) novo = PH.editarMembro(novo, r.membro.id, { fora });
              if (!(await salvarEstado(novo, (r.voltou ? 'Trouxe de volta ' : 'Adicionou ') + r.membro.nick))) return false;
              toast(r.voltou ? r.membro.nick + ' voltou para a guilda, com o histórico de antes.' : r.membro.nick + ' entrou na guilda.');
            }
          }
        }
      ]
    });
  }

  async function removerMembro(id) {
    const m = App.estado.membros[id];
    const ok = await confirmar({
      titulo: 'Remover ' + m.nick + ' da guilda?',
      texto: '<p>' + esc(m.nick) + ' sai de todas as filas. O que ele já levou continua no histórico e nos totais, e se ele voltar é só cadastrar o mesmo nick.</p>',
      confirmar: 'Remover', perigo: true
    });
    if (!ok) return;
    const r = PH.removerMembro(App.estado, id, PH.hoje());
    if (await salvarEstado(r.estado, 'Removeu ' + m.nick + ' da guilda')) toast(m.nick + ' saiu da guilda.');

  async function reativarMembro(id) {
    let novo;
    try { novo = PH.reativarMembro(App.estado, id); } catch (err) { toast(err.message, 'erro'); return; }
    if (await salvarEstado(novo, 'Trouxe de volta ' + nick(id))) toast(nick(id) + ' voltou para a guilda.');
  }

  function imagemMembros() {
    const { lista, t } = membrosFiltrados();
    const cols = colunasMembros();
    const e = App.estado;
    const colunas = [{ t: 'Membro' }].concat(cols.map(c => ({ t: c.nome, w: 104, dir: true, cor: c.cor })), [{ t: 'Total', w: 78, dir: true, forte: true }, { t: 'Última vez', w: 116 }]);
    const linhas = lista.map(m => [m.nick].concat(cols.map(c => valorColuna(t[m.id], c)), [t[m.id] ? t[m.id].total : 0, t[m.id] && t[m.id].ultima ? PH.fmtData(t[m.id].ultima) : 'nunca']));
    janelaImagem(() => X.imagemTabela({ titulo: e.guilda.nome, subtitulo: 'Membros e o que cada um já recebeu', direita: plural(lista.length, 'membro', 'membros'), colunas, linhas }), 'Imagem dos membros', 'membros-' + PH.hoje() + '.png');
  }

  function viewHistorico() {
    const e = App.estado, staff = ehStaff();
    const sessoes = e.sessoes.slice().reverse();
    let html = '<div class="painel-cabeca"><div><h1>Histórico</h1><p class="sub">' + plural(sessoes.length, 'leilão fechado', 'leilões fechados') + '. Para ver o que um membro levou dia a dia, abra a ficha dele em Membros.</p></div></div>';
    if (!sessoes.length) return html + vazio('Nenhum leilão fechado ainda.', 'Quando a staff fechar o primeiro, ele aparece aqui com quem levou cada item.');
    const meses = [];
    for (const s of sessoes) {
      const chave = s.d.slice(0, 7);
      let m = meses[meses.length - 1];
      if (!m || m.chave !== chave) { m = { chave, sessoes: [] }; meses.push(m); }
      m.sessoes.push(s);
    }
    const ultima = PH.ultimaSessao(e);
    html += meses.map((m, i) => {
      const unid = m.sessoes.reduce((s, x) => s + (x.unidades || 0), 0);
      return '<details class="mes"' + (i === 0 ? ' open' : '') + '><summary>' + ic('direita', 'seta') + '<h3>' + PH.nomeDoMes(m.chave + '-01') + '</h3>' +
        '<span class="meta">' + plural(m.sessoes.length, 'leilão', 'leilões') + ', ' + plural(unid, 'unidade', 'unidades') + '</span></summary>' +
        '<div class="sessoes">' + m.sessoes.map(s => sessaoHTML(s, staff && ultima && s.id === ultima.id)).join('') + '</div></details>';
    }).join('');
    return html;
  }

  function sessaoHTML(s, podeDesfazer) {
    const e = App.estado;
    const mini = Object.keys(s.resumo || {}).map(id => {
      const x = s.resumo[id], it = PH.item(e, id);
      if (!x || !it) return '';
      const texto = x.inicio ? 'nº ' + x.inicio + ' → ' + (x.proximo || '?') : 'vez devolvida';
      return '<span class="mini ' + tom(it.cor) + '" title="' + esc(it.nome) + ': ' + plural(x.unidades, 'unidade', 'unidades') + '">' + icItem(it.icone) + texto + '</span>';
    }).join('');
    return '<details class="sessao"><summary><span class="quando"><strong>' + PH.nomeDoDia(s.d) + '</strong><span class="num">' + PH.fmtData(s.d) + '</span></span>' +
      '<span class="resumo-itens">' + mini + '</span><span class="unidades num">' + (s.unidades || 0) + ' un.</span></summary>' +
      '<div class="sessao-detalhe">' + detalheSessao(s) +
      '<div class="linha-acoes"><span class="dica">Fechado' + (s.por ? ' por ' + esc(s.por) : '') + (s.em ? ' ' + U.fmtQuando(s.em) : '') + '.</span><span class="espaco"></span>' +
      (podeDesfazer ? '<button type="button" class="btn btn-p" data-acao="desfazer-leilao">' + ic('desfazer') + 'Desfazer este leilão</button>' : '') +
      '</div></div></details>';
  }

  function detalheSessao(s) {
    const e = App.estado, cat = PH.catalogo(e);
    const regs = e.registros.filter(r => r.s === s.id);
    const porItem = new Map();
    for (const r of regs) {
      const c = cat[r.i];
      const chave = r.i;
      if (!porItem.has(chave)) porItem.set(chave, { c, regs: [] });
      porItem.get(chave).regs.push(r);
    }
    if (!porItem.size) return '<p class="dica">Nada registrado neste leilão.</p>';
    return Array.from(porItem.values()).map(({ c, regs: lista }) => {
      const pills = lista.map(r => {
        if (r.t === 'levou') return '<span class="nome-pill">' + (r.o === 'prioridade' ? '★ ' : '') + esc(nick(r.m)) + (r.q > 1 ? ' <small>×' + r.q + '</small>' : '') + '</span>';
        if (r.t === 'recebeu') return '<span class="nome-pill cedeu">' + esc(nick(r.m)) + ' <small>de ' + esc(nick(r.x)) + '</small></span>';
        if (r.t === 'faltou' || r.t === 'naoquis') return '<span class="nome-pill passou">' + esc(nick(r.m)) + ' <small>' + TXT_ACAO[r.t] + '</small></span>';
        return '';
      }).join('');
      return '<div class="det-item ' + tom(c ? c.cor : 'uva') + '"><h4>' + (c ? icItem(c.icone) + esc(c.nome) : '') + '</h4><div class="nomes">' + pills + '</div></div>';
    }).join('');
  }

  async function desfazerLeilao() {
    const s = PH.ultimaSessao(App.estado);
    if (!s) return;
    const ok = await confirmar({
      titulo: 'Desfazer o leilão de ' + diaMin(s.d) + ', ' + PH.fmtData(s.d) + '?',
      texto: '<p>Tudo que ele registrou sai do histórico e dos totais, e as filas e a vez devolvida voltam a ser como eram antes dele. Depois você pode lançar de novo.</p>',
      confirmar: 'Desfazer leilão', perigo: true, icone: 'desfazer'
    });
    if (!ok) return;
    let r;
    try { r = PH.desfazerUltimo(App.estado); } catch (err) { toast(err.message, 'erro'); return; }
    if (await salvarEstado(r.estado, 'Desfez o leilão de ' + diaMin(s.d) + ', ' + PH.fmtData(s.d))) toast('Leilão de ' + PH.fmtData(s.d) + ' desfeito.');
  }

  /* ================================================================ */
  /* designados                                                       */
  /* ================================================================ */

  function viewDesignados() {
    const e = App.estado, staff = ehStaff(), cat = PH.catalogo(e);
    const itens = PH.itensAtivos(e).filter(i => i.designado);
    const regs = e.registros.filter(r => r.t === 'designado').sort((a, b) => (a.d < b.d ? 1 : a.d > b.d ? -1 : 0));
    let html = '<div class="painel-cabeca"><div><h1>Designados</h1><p class="sub">' + plural(regs.length, 'registro', 'registros') + ', ' + plural(regs.reduce((s, r) => s + r.q, 0), 'unidade', 'unidades') + '.</p></div>' +
      (staff ? '<button type="button" class="btn btn-p btn-primario" data-acao="novo-designado">' + ic('mais') + 'Registrar</button>' : '') + '</div>' +
      '<p class="sobre">Itens designados não passam pelo leilão: quem leva é escolhido dentro do jogo. Registrar aqui faz eles contarem nos totais de cada membro, e a rotação segue justa na hora de escolher o próximo.</p>';
    if (itens.length) {
      html += '<div class="sugestoes">' + itens.map(it => {

          '<p class="proximo">Próximo da vez<strong>' + (s ? 'nº ' + s.numero + ', ' + esc(s.membro.nick) : 'Ninguém na fila') + '</strong></p>' +
          (staff && s ? '<div class="linha-acoes"><button type="button" class="btn btn-p btn-primario" data-acao="designar-sugestao" data-item="' + it.id + '">Registrar para ' + esc(s.membro.nick) + '</button>' +
            '<button type="button" class="btn btn-p btn-leve" data-acao="pular-designado" data-item="' + it.id + '">Pular a vez</button></div>' : '') +
          '</article>';
      }).join('') + '</div>';
    }
    html += '<section class="secao"><h2 class="secao-titulo">Registros</h2>';
    if (!regs.length) return html + vazio('Nenhum designado registrado.', staff ? 'Quando a liderança escolher alguém no jogo, registre aqui.' : '') + '</section>';
    const grupos = [];
    for (const r of regs) {
      let g = grupos[grupos.length - 1];
      if (!g || g.d !== r.d) { g = { d: r.d, regs: [] }; grupos.push(g); }
      g.regs.push(r);
    }
    html += grupos.map(g => '<div class="grupo"><div class="grupo-cabeca"><h3>' + PH.nomeDoDia(g.d) + ', ' + PH.fmtData(g.d) + '</h3></div><div class="linhas">' +
      g.regs.map(r => {
        const c = cat[r.i] || { nome: r.i, cor: 'sol', icone: 'bau' };
        return '<div class="linha"><span class="quem">' + esc(nick(r.m)) + '</span><span class="oque ' + tom(c.cor) + '">' + icItem(c.icone) + '<span>' + esc(c.nome) + (r.q > 1 ? ' ×' + r.q : '') + '</span></span>' +
          '<span></span>' + (staff ? '<button type="button" class="btn btn-p btn-leve btn-icone" data-acao="remover-designado" data-reg="' + r.r + '" aria-label="Apagar este registro de ' + esc(nick(r.m)) + '">' + ic('lixo') + '</button>' : '<span></span>') +
          (r.n ? '<span class="obs">' + esc(r.n) + '</span>' : '') + '</div>';

  function janelaDesignado(itemIdInicial) {
    const e = App.estado;
    const itens = PH.itensAtivos(e).filter(i => i.designado);
    if (!itens.length) { toast('Nenhum item tem designado. Ajuste os itens em Ajustes.', 'aviso'); return; }
    let itemId = itens.some(i => i.id === itemIdInicial) ? itemIdInicial : itens[0].id;
    const membros = Object.values(e.membros).filter(m => m.ativo !== false).sort((a, b) => PH.compararNick(a.nick, b.nick));
    if (!membros.length) { toast('Cadastre membros antes de registrar designados.', 'aviso'); return; }
    const sug = id => PH.sugestaoDesignado(e, id);
    const opcoesMembro = id => {
      const s = sug(id);
      return membros.map(m => '<option value="' + m.id + '"' + (s && s.membro.id === m.id ? ' selected' : '') + '>' + esc(m.nick) + (s && s.membro.id === m.id ? ' (próximo da vez)' : '') + '</option>').join('');
    };
    const corpo = '<div class="grade-campos">' +
      '<label class="campo"><span>Data</span><input type="date" id="d-data" value="' + PH.hoje() + '"></label>' +
      '<label class="campo"><span>Item</span><select id="d-item">' + itens.map(i => '<option value="' + i.id + '"' + (i.id === itemId ? ' selected' : '') + '>' + esc(i.designado.nome) + '</option>').join('') + '</select></label>' +
      '</div><div class="grade-campos">' +
      '<label class="campo"><span>Quem recebeu</span><select id="d-membro">' + opcoesMembro(itemId) + '</select></label>' +
      '<label class="campo"><span>Quantidade</span><input type="number" id="d-qtd" min="1" max="999" value="1" inputmode="numeric"></label>' +
      '</div><label class="campo"><span>Observação</span><input id="d-obs" maxlength="140" placeholder="Opcional, por exemplo: escolhido na GvG"></label>' +
      '<p class="dica">Se for para o próximo da vez, a sugestão anda para o seguinte. Se for para outra pessoa, a sugestão fica onde está.</p>';
    let mexeuMembro = false;
    abrirJanela({
      titulo: 'Registrar designado',
      corpo,
      acoes: [
        { texto: 'Cancelar', classe: 'btn-leve' },
        {
          texto: 'Registrar', classe: 'btn-primario', icone: 'check',
          acao: async (j) => {
            const dados = { itemId: j.$('#d-item').value, membro: j.$('#d-membro').value, qtd: j.$('#d-qtd').value, data: j.$('#d-data').value || PH.hoje(), obs: j.$('#d-obs').value.trim() };
            const r = PH.registrarDesignado(App.estado, dados);
            const it = PH.item(App.estado, dados.itemId);
            j.ocupado(true);
            if (!(await salvarEstado(r.estado, 'Registrou ' + it.designado.nome + ' para ' + nick(dados.membro)))) return false;
            toast(it.designado.nome + ' registrado para ' + nick(dados.membro) + '.');
          }
        }
      ],
      aoAbrir: (j) => {
        j.$('#d-membro').addEventListener('change', () => { mexeuMembro = true; });
        j.$('#d-item').addEventListener('change', ev => {
          itemId = ev.target.value;
          if (!mexeuMembro) j.$('#d-membro').innerHTML = opcoesMembro(itemId);
        });
      }
    });
  }

  async function pularDesignado(itemId) {
    const e = App.estado, it = PH.item(e, itemId), s = PH.sugestaoDesignado(e, itemId);
    if (!s) return;
    const novo = PH.pularDesignado(e, itemId);
    if (await salvarEstado(novo, 'Pulou ' + s.membro.nick + ' na vez do ' + it.designado.nome)) toast('Vez de ' + s.membro.nick + ' pulada no ' + it.designado.nome + '.');
  }

  async function removerDesignado(regId) {
    const r = App.estado.registros.find(x => x.r === regId);
    if (!r) return;
    const c = PH.catalogo(App.estado)[r.i];
    const ok = await confirmar({ titulo: 'Apagar este designado?', texto: '<p>' + esc(c ? c.nome : r.i) + ' para ' + esc(nick(r.m)) + ' em ' + PH.fmtData(r.d) + ' sai dos registros e dos totais.</p>', confirmar: 'Apagar', perigo: true });
    if (!ok) return;
    if (await salvarEstado(PH.removerDesignado(App.estado, regId), 'Apagou um designado de ' + nick(r.m))) toast('Registro apagado.');
  }

  /* ================================================================ */

  function ausenciasFiltradas() {
    const e = App.estado, f = App.ausencias;
    let regs = PH.ausencias(e);
    if (f.tipo !== 'todos') regs = regs.filter(r => r.t === f.tipo);
    if (f.mes !== 'todos') regs = regs.filter(r => r.d.slice(0, 7) === f.mes);
    if (f.busca.trim()) { const q = semAcento(f.busca.trim()); regs = regs.filter(r => semAcento(nick(r.m)).includes(q)); }
    return regs.sort((a, b) => (a.d < b.d ? 1 : a.d > b.d ? -1 : 0));
  }

  function viewAusencias() {
    const e = App.estado, f = App.ausencias;
    const todos = PH.ausencias(e);
    const meses = Array.from(new Set(todos.map(r => r.d.slice(0, 7)))).sort().reverse();
    const conta = t => todos.filter(r => r.t === t).length;
    return '<div class="painel-cabeca"><div><h1>Ausências</h1><p class="sub">' + plural(conta('faltou'), 'falta', 'faltas') + ', ' + plural(conta('naoquis'), 'vez que não quis', 'vezes que não quiseram') + ' e ' + plural(conta('cedeu'), 'vaga cedida', 'vagas cedidas') + ' desde o começo.</p></div>' +
      '<button type="button" class="btn btn-p" data-acao="imagem-ausencias">' + ic('imagem') + 'Imagem</button></div>' +
      '<p class="sobre">Quem tinha vaga num leilão e não levou: faltou, não quis ou cedeu para outro membro. Quem não foi chamado porque a vez não chegou não aparece aqui.</p>' +
      '<div class="linha-acoes">' +
      '<label class="busca"><span class="sr">Buscar membro</span>' + ic('busca') + '<input class="entrada" type="search" id="busca-ausencias" data-acao="busca-ausencias" placeholder="Buscar membro" value="' + esc(f.busca) + '" autocomplete="off"></label>' +
      '<label class="sr" for="tipo-ausencias">Tipo</label><select class="entrada" id="tipo-ausencias" data-acao="tipo-ausencias" style="width:auto;flex:none">' +
      [['todos', 'Faltou, não quis e cedeu'], ['faltou', 'Só quem faltou'], ['naoquis', 'Só quem não quis'], ['cedeu', 'Só quem cedeu']].map(o => '<option value="' + o[0] + '"' + (f.tipo === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>' +
      '<label class="sr" for="mes-ausencias">Período</label><select class="entrada" id="mes-ausencias" data-acao="mes-ausencias" style="width:auto;flex:none">' +
      '<option value="todos">Todas as datas</option>' + meses.map(m => '<option value="' + m + '"' + (f.mes === m ? ' selected' : '') + '>' + PH.nomeDoMes(m + '-01') + '</option>').join('') + '</select>' +
      '</div><div id="lista-ausencias">' + listaAusencias() + '</div>';
  }

  function listaAusencias() {
    const regs = ausenciasFiltradas(), cat = PH.catalogo(App.estado);
    if (!regs.length) return vazio(PH.ausencias(App.estado).length ? 'Nada com esse filtro.' : 'Ninguém faltou, recusou ou cedeu ainda.', '');
    const grupos = [];
    for (const r of regs) {
      let g = grupos[grupos.length - 1];
      if (!g || g.d !== r.d) { g = { d: r.d, regs: [] }; grupos.push(g); }
      g.regs.push(r);
    }
    const tag = { faltou: '<span class="tag tag-falta">faltou</span>', naoquis: '<span class="tag">não quis</span>', cedeu: '<span class="tag tag-cede">cedeu</span>' };
    return grupos.map(g => {
      const n = t => g.regs.filter(r => r.t === t).length;
      const partes = [['faltou', 'faltou', 'faltaram'], ['naoquis', 'não quis', 'não quiseram'], ['cedeu', 'cedeu', 'cederam']].filter(p => n(p[0])).map(p => n(p[0]) + ' ' + (n(p[0]) === 1 ? p[1] : p[2]));
      return '<div class="grupo"><div class="grupo-cabeca"><h3>' + PH.nomeDoDia(g.d) + ', ' + PH.fmtData(g.d) + '</h3><span>' + partes.join(', ') + '</span></div><div class="linhas">' +
        g.regs.map(r => {
          const c = cat[r.i] || { nome: r.i, cor: 'uva', icone: 'bau' };
          const det = r.t === 'cedeu' ? 'para ' + esc(nick(r.x)) : r.t === 'faltou' ? 'ganhou a vez devolvida' : '';
          return '<div class="linha"><span class="quem">' + esc(nick(r.m)) + '</span><span class="oque ' + tom(c.cor) + '">' + icItem(c.icone) + '<span>' + esc(c.nome) + (r.q > 1 ? ' ×' + r.q : '') + '</span></span>' + tag[r.t] + '<span class="dica">' + det + '</span></div>';
        }).join('') + '</div></div>';
    }).join('');
  }
  function renderListaAusencias() { const el = $('#lista-ausencias'); if (el) el.innerHTML = listaAusencias(); }

  function imagemAusencias() {
    const regs = ausenciasFiltradas(), cat = PH.catalogo(App.estado);
    const linhas = regs.slice(0, 120).map(r => [nick(r.m), PH.fmtData(r.d), (cat[r.i] ? cat[r.i].nome : r.i) + (r.q > 1 ? ' ×' + r.q : ''), TXT_ACAO[r.t] + (r.t === 'cedeu' ? ' para ' + nick(r.x) : '')]);
    const colunas = [{ t: 'Membro', w: 230 }, { t: 'Data', w: 130 }, { t: 'Item' }, { t: 'O que houve', w: 260 }];
    janelaImagem(() => X.imagemTabela({ titulo: App.estado.guilda.nome, subtitulo: 'Ausências no leilão', direita: plural(regs.length, 'registro', 'registros'), colunas, linhas }), 'Imagem das ausências', 'ausencias-' + PH.hoje() + '.png');
  }

  /* ================================================================ */
  /* ajustes                                                          */
  /* ================================================================ */

  async function carregarAjustes(forcar) {
    if (!ehStaff() || !App.adapter) return;
    const a = App.ajustes;
    if (a.carregando || (!forcar && a.staff)) return;
    a.carregando = true;
    try {
      const [staff, convites] = await Promise.all([
        App.adapter.listarStaff(),
        ehAdmin() ? App.adapter.listarConvites() : Promise.resolve([])
      ]);
      a.staff = staff; a.convites = convites; a.erro = null;
      await carregarDiscord(true);
    } catch (err) { a.erro = err.message; }
    a.carregando = false;
    if (App.aba === 'ajustes') renderPainel();
  }

  function viewAjustes() {
    const e = App.estado, staff = ehStaff(), admin = ehAdmin();
    let html = '<div class="painel-cabeca"><div><h1>Ajustes</h1><p class="sub">Como o rodízio funciona e o estado de cada fila' + (staff ? ', mais as configurações da guilda e da staff.' : '.') + '</p></div></div>';
    html += '<section class="secao"><h2 class="secao-titulo">Como o rodízio funciona</h2><div class="regras">' + textoRegras(e) + '</div></section>';

    html += '<section class="secao"><h2 class="secao-titulo">Estado das filas</h2><div class="cartoes">' + PH.itensAtivos(e).map(it => {
      const p = PH.proximoDaFila(e, it.id), s = it.designado ? PH.sugestaoDesignado(e, it.id) : null;
      const n = (e.prioridade[it.id] || []).length;
      return '<article class="cartao tom ' + tom(it.cor) + '"><h3>' + icItem(it.icone) + esc(it.nome) + '</h3>' +
        '<p>' + (p ? 'Próximo leilão começa no <strong>nº ' + p.numero + ', ' + esc(p.membro.nick) + '</strong>, numa fila de ' + p.total + '.' : 'Fila vazia.') + '</p>' +
        (s ? '<p>' + esc(it.designado.nome) + ': próximo da vez é o nº ' + s.numero + ', ' + esc(s.membro.nick) + '.</p>' : '') +
        '<p>' + (n ? plural(n, 'pessoa com vez devolvida', 'pessoas com vez devolvida') : 'Ninguém com vez devolvida.') + '</p></article>';
    }).join('') + '</div></section>';

    const prios = PH.itensAtivos(e).filter(it => (e.prioridade[it.id] || []).length);
    html += '<section class="secao"><h2 class="secao-titulo">Vez devolvida</h2><p class="dica">Quem está aqui entra nas primeiras vagas do próximo leilão daquele item, antes da fila.</p>';
    if (!prios.length) html += vazio('Ninguém com vez devolvida agora.', '');
    else {
      html += prios.map(it => '<div class="grupo ' + tom(it.cor) + '"><div class="grupo-cabeca"><h3>' + esc(it.nome) + '</h3></div><div class="pessoas">' +
        e.prioridade[it.id].map(p => '<div class="pessoa"><span class="quem"><strong>' + esc(nick(p.m)) + '</strong><span>' + esc(TXT_MOTIVO[p.motivo] || 'ajuste da staff') + ' em ' + PH.fmtData(p.d) + '</span></span>' +
          (staff ? '<button type="button" class="btn btn-p btn-leve" data-acao="tirar-prioridade" data-item="' + it.id + '" data-prio="' + p.id + '">' + ic('x') + 'Tirar</button>' : '') + '</div>').join('') +
        '</div></div>').join('');
    }
    html += '</section>';

    if (!staff) {
      html += '<section class="secao"><p class="dica">A staff vê aqui também as configurações da guilda, dos itens, da equipe e o registro de alterações.</p>' +
        '<div class="linha-acoes"><button type="button" class="btn btn-p" data-acao="entrar">' + ic('cadeado') + 'Entrar como staff</button></div></section>';
      return html + secaoDemo();
    }

    html += secaoGuilda(e) + secaoItens(e) + secaoStaff(admin) + secaoDiscord(admin) + secaoConta() + secaoRegistro() + secaoBackup(admin) + secaoDemo();
    return html;

  function linkDoSite() {
    if (!App.adapter || App.adapter.tipo === 'demo' || U.noIframe()) return '';
    return raiz.location.origin + raiz.location.pathname;
  }

  async function enviarDiscord(url, texto, png, nomeArquivo) {
    if (App.adapter.tipo === 'demo') return { simulado: true };
    const corpo = new FormData();
    const payload = { content: texto, username: (App.estado.guilda.nome + ' · Leilão').slice(0, 80), allowed_mentions: { parse: [] } };
    if (png) payload.attachments = [{ id: 0, filename: nomeArquivo }];
    corpo.append('payload_json', JSON.stringify(payload));
    if (png) corpo.append('files[0]', png, nomeArquivo);
    let resp;
    try { resp = await fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 'wait=true', { method: 'POST', body: corpo }); }
    catch (err) { throw new Error('sem conexão com o Discord. Confira a internet e tente de novo.'); }
    if (!resp.ok) {
      let msg = '';
      try { const j = await resp.json(); msg = j && j.message ? ': ' + j.message : ''; } catch (e) { /* sem corpo */ }
      if (resp.status === 404 || resp.status === 401) throw new Error('o Discord não encontrou esse webhook. Ele pode ter sido apagado; cole uma URL nova em Ajustes.');
      throw new Error('o Discord respondeu ' + resp.status + msg);
    }
    return { simulado: false };
  }

  async function postarResultado(estadoAntes, montagem, data) {
    try {
      const cv = await X.imagemLeilao(estadoAntes, montagem, data);
      const png = await new Promise(ok => cv.toBlob(ok, 'image/png'));
      const texto = X.resumoDiscord(estadoAntes, montagem, data, linkDoSite());
      const r = await enviarDiscord(App.discord.url, texto, png, 'leilao-' + data + '.png');
      if (r.simulado) toast('No protótipo o envio para o Discord é simulado. No site, o resumo e a imagem vão para o canal.', 'aviso', 7000);
      else toast('Resultado postado no Discord.');
    } catch (err) {
      toast('O leilão foi fechado, mas não consegui postar no Discord: ' + err.message, 'erro', 9000);
    }
  }

      if (ICONES.some(c => c[0] === v('icone'))) it.icone = v('icone');
      if (it.bonus && v('bonus')) it.bonus.nome = v('bonus');
      if (it.designado && v('desig')) it.designado.nome = v('desig');
      const at = document.getElementById(p + 'ativo');

    try { await App.adapter.meuNome(nome); App.sessao.usuario.nome = nome; App.ajustes.staff = null; carregarAjustes(true); renderTopo(); toast('Nome salvo.'); }
    catch (err) { toast(err.message, 'erro'); }
  }
  async function carregarLog() {
    try { App.ajustes.log = await App.adapter.registroAlteracoes(); renderPainel(); }
    catch (err) { toast(err.message, 'erro'); }
  }
  async function carregarVersoes() {
    try { App.ajustes.versoes = await App.adapter.versoes(); renderPainel(); }
    catch (err) { toast(err.message, 'erro'); }
  }
  async function restaurarVersao(versao) {
    const ok = await confirmar({ titulo: 'Restaurar a versão ' + versao + '?', texto: '<p>Membros, filas, vez devolvida, histórico e designados voltam a ser como eram nessa versão. A versão de agora fica guardada e pode ser restaurada depois.</p>', confirmar: 'Restaurar', perigo: true, icone: 'desfazer' });
    if (!ok) return;
    try {
      await App.adapter.restaurar(versao);
      await carregarTudo();
      App.ajustes.versoes = null; App.ajustes.log = null;
      render();
      toast('Versão ' + versao + ' restaurada.');
    } catch (err) { toast(err.message, 'erro'); }
  }

  function textoBackup() {
    return JSON.stringify({ app: 'poringhub-leilao', exportadoEm: new Date().toISOString(), versao: App.versao, dados: App.estado }, null, 1);
  }
  function baixarBackup() {
    const blob = new Blob([textoBackup()], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'backup-' + idSeguro(App.estado.guilda.nome.toLowerCase()) + '-' + PH.hoje() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Backup baixado.');
  }
  function copiarBackup() {
    const texto = textoBackup();
    abrirJanela({
      titulo: 'Copiar backup', sub: 'Cole num arquivo de texto e salve com a extensão .json.',
      corpo: '<label class="campo"><span class="sr">Backup</span><textarea id="texto-backup" class="relatorio" readonly>' + esc(texto) + '</textarea></label>',
      acoes: [{ texto: 'Fechar', classe: 'btn-leve' }, {
        texto: 'Copiar', classe: 'btn-primario', icone: 'copiar', fecha: false,
        acao: async (j) => { const ok = await U.copiarTexto(texto, j.$('#texto-backup')); if (ok) j.ok('Backup copiado.'); else j.erro('O navegador não deixou copiar sozinho. O texto está selecionado: use Ctrl+C.'); return false; }
      }]
    });
  }
  function importarBackup(arquivo) {
    if (!arquivo) return;
    const leitor = new FileReader();
    leitor.onload = async () => {
      let obj;
      try { obj = JSON.parse(leitor.result); } catch (e) { toast('Esse arquivo não é um backup válido.', 'erro'); return; }
      const dados = obj && obj.dados ? obj.dados : obj;
      if (!dados || typeof dados !== 'object' || !dados.membros) { toast('Esse arquivo não parece um backup do leilão.', 'erro'); return; }
      const e = PH.normalizar(dados);
      const ok = await confirmar({
        titulo: 'Importar este backup?',
        texto: '<p>Ele tem ' + plural(Object.keys(e.membros).length, 'membro', 'membros') + ', ' + plural(e.sessoes.length, 'leilão fechado', 'leilões fechados') + ' e ' + plural(e.registros.length, 'registro', 'registros') + '. Tudo que está no site agora é trocado por ele; a versão atual fica guardada em Versões salvas.</p>',
        confirmar: 'Importar', perigo: true, icone: 'upload'
      });
      if (!ok) return;
      if (await salvarEstado(e, 'Importou um backup')) { aplicarRascunhoRemoto(null); toast('Backup importado.'); render(); }
    };
    leitor.readAsText(arquivo);
  }

  /* ================================================================ */
  /* entrada, login e conta                                           */
  /* ================================================================ */

  function talvezPerguntarEntrada() {
    if (App.sessao.modo !== 'visitante') return;
    if (U.lsGet('ph-entrada')) return;
    janelaEntrada();
  }

  function janelaEntrada() {
    const h = abrirJanela({
      titulo: App.estado.guilda.nome + ', leilão da guilda',
      sub: 'Como você quer entrar?',
      corpo: '<div class="entrada-grande">' +
        '<button type="button" class="opcao" data-entrada="staff">' + ic('cadeado') + '<strong>Sou da staff</strong><span>Lança o leilão, cadastra e remove membros e mexe nas filas.</span></button>' +
        '<button type="button" class="opcao" data-entrada="ver">' + ic('olho') + '<strong>Só quero ver</strong><span>Navega por todas as abas, sem alterar nada.</span></button>' +
        '</div>',
      aoAbrir: (j) => {
        j.$$('[data-entrada]').forEach(b => b.addEventListener('click', () => {
          U.lsSet('ph-entrada', b.dataset.entrada);
          j.fechar();
          if (b.dataset.entrada === 'staff') janelaLogin();
        }));
      }
    });
    return h;
  }

  function janelaLogin(abaInicial) {
    const demo = App.adapter && App.adapter.tipo === 'demo';
    let aba = abaInicial || 'entrar';
    const formEntrar = '<div data-form="entrar" class="grade-login" style="display:grid;gap:12px">' +
      '<label class="campo"><span>E-mail</span><input type="email" id="l-email" autocomplete="username" inputmode="email"></label>' +
      '<label class="campo"><span>Senha</span><input type="password" id="l-senha" autocomplete="current-password"></label>' +
      (demo ? '<p class="dica">No protótipo, qualquer e-mail e senha entram como administrador.</p>' : '') + '</div>';
    const formCriar = '<div data-form="criar" style="display:grid;gap:12px" hidden>' +
      '<p class="dica">Use o e-mail em que você recebeu o convite da staff. Depois de criar, confirme pelo link que chega no seu e-mail.</p>' +
      '<label class="campo"><span>E-mail</span><input type="email" id="n-email" autocomplete="username" inputmode="email"></label>' +
      '<label class="campo"><span>Senha</span><input type="password" id="n-senha" autocomplete="new-password"><small>Pelo menos 8 caracteres.</small></label>' +
      '<label class="campo"><span>Repita a senha</span><input type="password" id="n-senha2" autocomplete="new-password"></label></div>';
    const formEsqueci = '<div data-form="esqueci" style="display:grid;gap:12px" hidden>' +
      '<p class="dica">Mandamos um link para você criar uma senha nova.</p>' +
      '<label class="campo"><span>E-mail</span><input type="email" id="r-email" autocomplete="username" inputmode="email"></label></div>';
    const segmentos = demo ? '' : '<div class="segmentos" role="group" aria-label="O que fazer">' +
      '<button type="button" data-seg="entrar" aria-pressed="true">Entrar</button>' +
      '<button type="button" data-seg="criar" aria-pressed="false">Criar minha senha</button>' +
      '<button type="button" data-seg="esqueci" aria-pressed="false">Esqueci a senha</button></div>';
    const textos = { entrar: 'Entrar', criar: 'Criar minha senha', esqueci: 'Mandar o link' };
    abrirJanela({
      titulo: 'Entrar como staff',
      sub: demo ? 'Protótipo com dados de exemplo.' : 'Só quem foi convidado pela staff consegue alterar.',
      corpo: segmentos + formEntrar + (demo ? '' : formCriar + formEsqueci),
      acoes: [
        { texto: 'Cancelar', classe: 'btn-leve' },
        {
          texto: 'Entrar', id: 'botao-login', classe: 'btn-primario', icone: 'entrar', fecha: false,
          acao: async (j) => {
            j.ocupado(true);
            if (aba === 'entrar') {
              const s = await App.adapter.entrar(j.$('#l-email').value, j.$('#l-senha').value);
              App.sessao = s;
              U.lsSet('ph-entrada', 'staff');
              App.ajustes = { staff: null, convites: null, log: null, versoes: null, carregando: false, erro: null }; App.discord = { carregado: false, url: null };
              render();
              if (s.modo === 'staff') { j.fechar(); toast('Olá, ' + s.usuario.nome + '. Você está como staff.'); if (App.aba === 'ajustes') carregarAjustes(true); }
              else { j.ocupado(false); j.erro('Você entrou, mas o e-mail ' + s.usuario.email + ' ainda não está na staff. Peça um convite para um administrador.'); }
              return false;
            }
            if (aba === 'criar') {
              const s1 = j.$('#n-senha').value, s2 = j.$('#n-senha2').value;
              if (s1.length < 8) { j.ocupado(false); j.erro('A senha precisa ter pelo menos 8 caracteres.'); return false; }
              if (s1 !== s2) { j.ocupado(false); j.erro('As duas senhas não são iguais.'); return false; }
              const r = await App.adapter.criarConta(j.$('#n-email').value, s1);
              j.ocupado(false);
              if (r.precisaConfirmar) j.ok('Pronto. Mandamos um link de confirmação para ' + j.$('#n-email').value.trim() + '. Abra o e-mail, confirme e volte aqui para entrar.');
              else { App.sessao = await App.adapter.sessao(); render(); j.fechar(); toast('Conta criada.'); }
              return false;
            }
            await App.adapter.esqueciSenha(j.$('#r-email').value);
            j.ocupado(false);
            j.ok('Se esse e-mail tiver conta, o link para criar uma senha nova chega em alguns minutos.');
            return false;
          }
        }
      ],
      aoAbrir: (j) => {
        j.$$('[data-seg]').forEach(b => b.addEventListener('click', () => {
          aba = b.dataset.seg;
          j.$$('[data-seg]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
          j.$$('[data-form]').forEach(f => { f.hidden = f.dataset.form !== aba; });
          j.erro(null);
          const botao = j.$('#botao-login');
          botao.innerHTML = ic(aba === 'entrar' ? 'entrar' : aba === 'criar' ? 'usuarioMais' : 'chave') + esc(textos[aba]);
          const primeiro = j.$('[data-form="' + aba + '"] input');
          if (primeiro) primeiro.focus();
        }));
        j.el.addEventListener('keydown', ev => {
          if (ev.key === 'Enter' && ev.target.tagName === 'INPUT') { ev.preventDefault(); j.$('#botao-login').click(); }
        });
        if (aba !== 'entrar') { const b = j.$('[data-seg="' + aba + '"]'); if (b) b.click(); }
      }
    });
  }

  function janelaNovaSenha() {
    abrirJanela({
      titulo: 'Crie sua senha nova',
      corpo: '<label class="campo"><span>Senha nova</span><input type="password" id="ns-1" autocomplete="new-password"><small>Pelo menos 8 caracteres.</small></label>' +
        '<label class="campo"><span>Repita a senha</span><input type="password" id="ns-2" autocomplete="new-password"></label>',
      acoes: [
        { texto: 'Agora não', classe: 'btn-leve' },
        {
          texto: 'Salvar senha', classe: 'btn-primario', icone: 'check',
          acao: async (j) => {
            const a = j.$('#ns-1').value, b = j.$('#ns-2').value;
            if (a.length < 8) throw new Error('A senha precisa ter pelo menos 8 caracteres.');
            if (a !== b) throw new Error('As duas senhas não são iguais.');
            j.ocupado(true);
            await App.adapter.novaSenha(a);
            App.sessao = await App.adapter.sessao();
            render();
            toast('Senha nova salva.');
          }
        }
      ]
    });
  }

  async function sair() {
    try { await App.adapter.sair(); } catch (e) { /* segue */ }
    App.sessao = { modo: 'visitante', usuario: null };
    U.lsSet('ph-entrada', 'ver');
    App.ajustes = { staff: null, convites: null, log: null, versoes: null, carregando: false, erro: null }; App.discord = { carregado: false, url: null };
    render();
    toast('Você saiu. Agora está só vendo.');
  }

  async function recomecarDemo() {
    if (!App.adapter || App.adapter.tipo !== 'demo') return;
    const ok = await confirmar({ titulo: 'Recomeçar os dados de exemplo?', texto: '<p>Tudo que você testou neste navegador some e a guilda de exemplo volta do começo.</p>', confirmar: 'Recomeçar', perigo: true });
    if (!ok) return;
    const sessao = App.adapter.db.sessao;
    App.adapter.resetar();
    App.adapter.db.sessao = sessao;
    App.adapter._gravar();
    await carregarTudo();
    App.primeiraMontagem = true;
    render();
    toast('Exemplo recomeçado.');
  }

  /* ================================================================ */
  /* gravar e acompanhar                                              */
  /* ================================================================ */

  async function salvarEstado(novo, motivo) {
    if (!ehStaff()) { toast('Entre como staff para alterar.', 'erro'); return false; }
    App.salvando = true;
    document.body.classList.add('salvando');
    try {
      const v = await App.adapter.salvar(novo, App.versao, motivo);
      App.estado = PH.normalizar(novo);
      App.versao = v;
      App.ajustes.log = null;
      App.ajustes.versoes = null;
      return true;
    } catch (err) {
      if (err.codigo === 'conflito') {
        try { await carregarTudo(); } catch (e) { /* segue */ }
        toast('Outra pessoa da staff salvou antes de você. Os dados foram atualizados: confira e faça de novo.', 'aviso', 8000);
      } else if (err.codigo === 'sem_permissao' || err.codigo === 'sessao') {
        try { App.sessao = await App.adapter.sessao(); } catch (e) { App.sessao = { modo: 'visitante', usuario: null }; }
        toast(err.message, 'erro');
      } else toast(err.message, 'erro');
      return false;
    } finally {
      App.salvando = false;
      document.body.classList.remove('salvando');
      render();
    }
  }

  function iniciarAtualizacoes() {
    if (!App.adapter || App.adapter.tipo !== 'supabase' || App.erroFatal) return;
    const checarRascunho = async () => {
      if (document.visibilityState !== 'visible' || App.aba !== 'hoje') return;
      if (App.salvandoRascunho || Date.now() - App.editouRascunhoEm < 20000) return;
      try {
        const r = await App.adapter.lerRascunho();
        if (r.em && r.em !== App.rascunhoEm) {
          const antes = lembrarVagas();
          aplicarRascunhoRemoto(r.dados, r.em, r.por);
          marcarMudancas(antes);
          renderComMudancas();
        }
      } catch (e) { /* tenta de novo depois */ }
    };
    const checarVersao = async () => {
      if (document.visibilityState !== 'visible' || App.salvando) return;
      try {
        const v = await App.adapter.versaoAtual();
        if (v !== App.versao) {
          await carregarTudo();
          render();
          toast('A staff atualizou os dados do leilão.');
        }
      } catch (e) { /* tenta de novo depois */ }
    };
    setInterval(checarRascunho, 12000);
    setInterval(checarVersao, 45000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { checarVersao(); checarRascunho(); } });
  }

  /* ================================================================ */
  /* eventos                                                          */
  /* ================================================================ */

  const CLIQUES = {
    aba: el => irPara(el.dataset.aba),
    tema: alternarTema,
    entrar: () => janelaLogin(),
    sair,
    'recomecar-demo': recomecarDemo,
    'tentar-de-novo': () => raiz.location.reload(),
    passo: el => passo(el.dataset.item, el.dataset.campo, Number(el.dataset.delta)),
    ultima: el => ajustarUltima(el.dataset.item, el.dataset.campo, Number(el.dataset.delta)),
    'inicio-padrao': el => mudarRascunho(r => { r.itens[el.dataset.item].inicio = null; }),
    vaga: el => janelaVaga(el.dataset.item, el.dataset.k),
    'filtro-hoje': el => { App.hojeFiltro = el.dataset.item; lembrarVagas(); renderPainel(); },
    relatorio: janelaRelatorio,
    'imagem-leilao': imagemLeilao,
    'limpar-rascunho': limparRascunho,
    'fechar-leilao': fecharLeilao,
    'fila-item': el => { App.filaItem = el.dataset.item; renderPainel(); },
    ponteiro: el => mudarPonteiro(el.dataset.item, el.dataset.membro),
    'novo-membro': () => janelaMembroForm(),
    'importar-membros': janelaImportar,
    'abrir-membro': el => janelaFicha(el.dataset.membro),
    'imagem-membros': imagemMembros,
    'desfazer-leilao': desfazerLeilao,
    'novo-designado': () => janelaDesignado(),
    'designar-sugestao': el => janelaDesignado(el.dataset.item),
    'pular-designado': el => pularDesignado(el.dataset.item),
    'remover-designado': el => removerDesignado(el.dataset.reg),
    'imagem-ausencias': imagemAusencias,
    'tirar-prioridade': el => tirarPrioridade(el.dataset.item, el.dataset.prio),
    'salvar-guilda': salvarGuilda,
    'mv-escolher': escolherMeuNick,
    'mv-trocar': trocarMeuNick,
    'dc-salvar': salvarDiscord,
    'dc-testar': testarDiscord,
    'dc-desligar': desligarDiscord,
    'salvar-itens': salvarItens,
    convidar,
    'cancelar-convite': el => cancelarConvite(el.dataset.email),
    'remover-staff': el => removerStaff(el.dataset.id, el.dataset.nome),
    'salvar-meu-nome': salvarMeuNome,
    'trocar-senha': () => (App.adapter.tipo === 'demo' ? toast('No protótipo não há senha de verdade para trocar.', 'aviso') : janelaNovaSenha()),
    'carregar-log': carregarLog,
    'carregar-versoes': carregarVersoes,
    'restaurar-versao': el => restaurarVersao(Number(el.dataset.versao)),
    'baixar-backup': baixarBackup,
    'copiar-backup': copiarBackup,
    'importar-backup': () => { const f = $('#arquivo-backup'); if (f) f.click(); }
  };
  const MUDANCAS = {
    'data-leilao': el => { if (el.value) mudarRascunho(r => { r.data = el.value; }); },
    inicio: el => mudarInicio(el.dataset.item, el.value),
    'ordem-membros': el => { App.membros.ordem = el.value; renderTabelaMembros(); },
    'mostrar-saiu': el => { App.membros.saiu = el.checked; renderTabelaMembros(); },
    'tipo-ausencias': el => { App.ausencias.tipo = el.value; renderListaAusencias(); },
    'mes-ausencias': el => { App.ausencias.mes = el.value; renderListaAusencias(); },
    'papel-staff': el => mudarPapel(el.dataset.id, el.value),
    'arquivo-backup': el => { importarBackup(el.files && el.files[0]); el.value = ''; }
  };
  const DIGITACAO = {
    'busca-membros': el => { App.membros.busca = el.value; renderTabelaMembros(); },
    'busca-ausencias': el => { App.ausencias.busca = el.value; renderListaAusencias(); }
  };

  function aoClicar(ev) {
    const el = ev.target.closest('[data-acao]');
    if (!el || el.disabled) return;
    const fn = CLIQUES[el.dataset.acao];
    if (!fn) return;
    if (el.tagName === 'A' && el.hasAttribute('download')) return;
    ev.preventDefault();
    Promise.resolve(fn(el, ev)).catch(err => toast(err.message || String(err), 'erro'));
  }
  function aoMudar(ev) {
    const el = ev.target.closest('[data-acao]');
    if (!el) return;
    const fn = MUDANCAS[el.dataset.acao];
    if (fn) Promise.resolve(fn(el, ev)).catch(err => toast(err.message || String(err), 'erro'));
  }
  function aoDigitar(ev) {
    const el = ev.target.closest('[data-acao]');
    if (!el) return;
    const fn = DIGITACAO[el.dataset.acao];
    if (fn) fn(el, ev);
  }
  document.addEventListener('keydown', ev => {
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('tr[data-acao]')) {
      ev.preventDefault();
      ev.target.click();
    }
  });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})(window);

</script>
</body>
</html>
