<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
/* Layout: app de duas colunas — trilho de abas à esquerda (vira faixa rolável no celular) e um painel
   onde cada leilão aparece em "páginas" de 4 vagas, como na tela do jogo. Visual leve, colorido e arredondado. */
:root {
  /* base */
  --bg: #F6F4FE;
  --bg-2: #EFEBFD;
  --surface: #FFFFFF;
  --surface-2: #FAF9FF;
  --line: #E8E4F6;
  --line-2: #D6CFEC;
  --ink: #27214A;
  --ink-2: #5C5680;
  --muted: #847FA3;
  --foco: #7B5CFF;
  --sombra: 0 1px 0 rgba(39, 33, 74, .04), 0 10px 30px -12px rgba(39, 33, 74, .16);
  --sombra-forte: 0 24px 60px -20px rgba(39, 33, 74, .45);
  --veu: rgba(23, 19, 43, .44);
  --brilho: rgba(255, 194, 60, .4);
  --brilho-fim: rgba(255, 194, 60, 0);

  /* marca */
  --ouro: #FFC23C;
  --ouro-fundo: #E3A100;
  --ouro-suave: #FFF3D1;
  --ouro-tinta: #7A5200;
  --sobre-ouro: #27214A;

  /* tons dos itens */
  --uva: #7B5CFF; --uva-suave: #EEE9FF; --uva-tinta: #4F2FE0; --uva-linha: #D9CFFF;
  --rosa: #F0519A; --rosa-suave: #FFE7F2; --rosa-tinta: #B21E68; --rosa-linha: #FBC6DF;
  --coral: #FF7448; --coral-suave: #FFECE4; --coral-tinta: #B13F17; --coral-linha: #FFCDBB;
  --mar: #13A6C2; --mar-suave: #DCF5FA; --mar-tinta: #0A6B7E; --mar-linha: #ABE3EE;
  --folha: #23B26D; --folha-suave: #E0F7EA; --folha-tinta: #137444; --folha-linha: #AEE6C8;
  --sol: #F2A900; --sol-suave: #FFF3CF; --sol-tinta: #855A00; --sol-linha: #FBDC8E;

  /* estados */
  --ok: #19B37A; --ok-suave: #DFF7EC; --ok-tinta: #0C7650;
  --falta: #EE4458; --falta-suave: #FFE5E8; --falta-tinta: #AE1B2E; --falta-fundo: #C42A3D;
  --cede: #3F7BFF; --cede-suave: #E4EDFF; --cede-tinta: #2149C2;
  --neutro-suave: #EFEDF6; --neutro-tinta: #5C5680;

  /* tipo */
  --f-display: 'Fredoka', 'Baloo 2', 'Nunito', ui-rounded, system-ui, sans-serif;
  --f-corpo: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  --raio-g: 26px;
  --raio-m: 18px;
  --raio-p: 12px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15122A; --bg-2: #1B1735; --surface: #211C3D; --surface-2: #29234A; --line: #352D5C; --line-2: #463B74;
    --ink: #F4F1FF; --ink-2: #CBC4EB; --muted: #9A92C2; --foco: #A592FF;
    --sombra: 0 1px 0 rgba(0, 0, 0, .2), 0 12px 32px -14px rgba(0, 0, 0, .6);
    --sombra-forte: 0 24px 60px -18px rgba(0, 0, 0, .8); --veu: rgba(5, 3, 14, .62);
    --ouro: #FFC23C; --ouro-fundo: #C98E00; --ouro-suave: rgba(255, 194, 60, .16); --ouro-tinta: #FFD677; --sobre-ouro: #241D05;
    --uva: #9C85FF; --uva-suave: rgba(156, 133, 255, .17); --uva-tinta: #C4B6FF; --uva-linha: rgba(156, 133, 255, .38);
    --rosa: #FF6FAE; --rosa-suave: rgba(255, 111, 174, .16); --rosa-tinta: #FFA9CF; --rosa-linha: rgba(255, 111, 174, .36);
    --coral: #FF8B64; --coral-suave: rgba(255, 139, 100, .16); --coral-tinta: #FFB59B; --coral-linha: rgba(255, 139, 100, .36);
    --mar: #33C4DE; --mar-suave: rgba(51, 196, 222, .15); --mar-tinta: #8DE3F2; --mar-linha: rgba(51, 196, 222, .36);
    --folha: #3CCB86; --folha-suave: rgba(60, 203, 134, .15); --folha-tinta: #8CE6B8; --folha-linha: rgba(60, 203, 134, .34);
    --sol: #FFC23C; --sol-suave: rgba(255, 194, 60, .15); --sol-tinta: #FFD677; --sol-linha: rgba(255, 194, 60, .36);
    --ok: #3CCB8E; --ok-suave: rgba(60, 203, 142, .15); --ok-tinta: #8DE7BE;
    --falta: #FF6476; --falta-suave: rgba(255, 100, 118, .15); --falta-tinta: #FFA5B0; --falta-fundo: #D93A4D;
    --cede: #6C9BFF; --cede-suave: rgba(108, 155, 255, .16); --cede-tinta: #AFC8FF;
    --neutro-suave: rgba(203, 196, 235, .1); --neutro-tinta: #CBC4EB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15122A; --bg-2: #1B1735; --surface: #211C3D; --surface-2: #29234A; --line: #352D5C; --line-2: #463B74;
  --ink: #F4F1FF; --ink-2: #CBC4EB; --muted: #9A92C2; --foco: #A592FF;
  --sombra: 0 1px 0 rgba(0, 0, 0, .2), 0 12px 32px -14px rgba(0, 0, 0, .6);
  --sombra-forte: 0 24px 60px -18px rgba(0, 0, 0, .8); --veu: rgba(5, 3, 14, .62);
  --ouro: #FFC23C; --ouro-fundo: #C98E00; --ouro-suave: rgba(255, 194, 60, .16); --ouro-tinta: #FFD677; --sobre-ouro: #241D05;
  --uva: #9C85FF; --uva-suave: rgba(156, 133, 255, .17); --uva-tinta: #C4B6FF; --uva-linha: rgba(156, 133, 255, .38);
  --rosa: #FF6FAE; --rosa-suave: rgba(255, 111, 174, .16); --rosa-tinta: #FFA9CF; --rosa-linha: rgba(255, 111, 174, .36);
  --coral: #FF8B64; --coral-suave: rgba(255, 139, 100, .16); --coral-tinta: #FFB59B; --coral-linha: rgba(255, 139, 100, .36);
  --mar: #33C4DE; --mar-suave: rgba(51, 196, 222, .15); --mar-tinta: #8DE3F2; --mar-linha: rgba(51, 196, 222, .36);
  --folha: #3CCB86; --folha-suave: rgba(60, 203, 134, .15); --folha-tinta: #8CE6B8; --folha-linha: rgba(60, 203, 134, .34);
  --sol: #FFC23C; --sol-suave: rgba(255, 194, 60, .15); --sol-tinta: #FFD677; --sol-linha: rgba(255, 194, 60, .36);
  --ok: #3CCB8E; --ok-suave: rgba(60, 203, 142, .15); --ok-tinta: #8DE7BE;
  --falta: #FF6476; --falta-suave: rgba(255, 100, 118, .15); --falta-tinta: #FFA5B0; --falta-fundo: #D93A4D;
  --cede: #6C9BFF; --cede-suave: rgba(108, 155, 255, .16); --cede-tinta: #AFC8FF;
  --neutro-suave: rgba(203, 196, 235, .1); --neutro-tinta: #CBC4EB;
  color-scheme: dark;
}

/* ---------- base ---------- */
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--f-corpo);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: .005em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; border-radius: 10px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
body.salvando { cursor: progress; }
.ic { width: 18px; height: 18px; flex: none; }
.ic-item { width: 30px; height: 30px; flex: none; display: block; }
.emblema { width: 46px; height: 46px; flex: none; display: block; }

.tom-uva { --t: var(--uva); --t-suave: var(--uva-suave); --t-ink: var(--uva-tinta); --t-linha: var(--uva-linha); }
.tom-rosa { --t: var(--rosa); --t-suave: var(--rosa-suave); --t-ink: var(--rosa-tinta); --t-linha: var(--rosa-linha); }
.tom-coral { --t: var(--coral); --t-suave: var(--coral-suave); --t-ink: var(--coral-tinta); --t-linha: var(--coral-linha); }
.tom-mar { --t: var(--mar); --t-suave: var(--mar-suave); --t-ink: var(--mar-tinta); --t-linha: var(--mar-linha); }
.tom-folha { --t: var(--folha); --t-suave: var(--folha-suave); --t-ink: var(--folha-tinta); --t-linha: var(--folha-linha); }
.tom-sol { --t: var(--sol); --t-suave: var(--sol-suave); --t-ink: var(--sol-tinta); --t-linha: var(--sol-linha); }

/* ---------- estrutura ---------- */
.app {
  max-width: 1260px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 48px;
  display: grid;
  gap: 18px;
}
.topo { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; }
.marca { display: flex; align-items: center; gap: 12px; min-width: 0; }
.marca-nome { font: 600 25px/1.05 var(--f-display); letter-spacing: .01em; }
.marca-sub { color: var(--muted); font-size: 13.5px; }
.topo-acoes { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.pill-modo {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 12px 7px 10px; border-radius: 999px;
  background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line);
  font-size: 13.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap;
}
.pill-modo .ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill-modo.staff .ponto { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-suave); }

.faixa {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 12px 14px 12px 16px; border-radius: var(--raio-m);
  background: var(--ouro-suave); color: var(--ouro-tinta);
  font-size: 14px;
}
.faixa strong { font-weight: 700; }
.faixa .faixa-texto { flex: 1 1 280px; min-width: 0; }
.faixa.erro { background: var(--falta-suave); color: var(--falta-tinta); }

.corpo { display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 20px; align-items: start; }
.abas { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px); display: grid; gap: 6px; }
.aba {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 11px 12px 11px 14px; border: 0; border-radius: 16px;
  background: transparent; color: var(--ink-2); text-align: left;
  font: 600 15px/1.2 var(--f-corpo);
  transition: background .15s ease, color .15s ease;
}
.aba:hover { background: var(--bg-2); color: var(--ink); }
.aba[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--sombra), inset 0 0 0 1.5px var(--line); }
.aba[aria-current="page"] .ic { color: var(--uva); }
.aba .rotulo { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aba .conta { font: 600 12.5px/1 var(--f-display); padding: 4px 8px; border-radius: 999px; background: var(--bg-2); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.aba[aria-current="page"] .conta { background: var(--uva-suave); color: var(--uva-tinta); }

.painel {
  background: var(--surface); border-radius: var(--raio-g); box-shadow: var(--sombra), inset 0 0 0 1px var(--line);
  padding: 24px; min-width: 0; display: grid; gap: 20px; align-content: start;
}
.painel > *, .secao > *, .bloco-corpo > *, .janela-corpo > * { min-width: 0; }
.painel-cabeca { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 20px; flex-wrap: wrap; }
.painel-cabeca h1 { font-size: 30px; }
.painel-cabeca .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
.sobre { color: var(--ink-2); font-size: 14.5px; max-width: 68ch; }
.secao-titulo { font: 600 17px/1.2 var(--f-display); color: var(--ink); }
.secao { display: grid; gap: 12px; }
.secao + .secao { padding-top: 18px; border-top: 1.5px dashed var(--line); }
.linha-acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.espaco { flex: 1; }
.vazio {
  display: grid; justify-items: center; text-align: center; gap: 8px;
  padding: 28px 18px; border-radius: var(--raio-m); border: 1.5px dashed var(--line-2);
  color: var(--muted); font-size: 14.5px;
}
.vazio strong { color: var(--ink-2); font-weight: 600; }

/* ---------- botões e campos ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 9px 16px; border: 0; border-radius: 14px;
  background: var(--surface); color: var(--ink);
  font: 600 14.5px/1.1 var(--f-corpo); white-space: nowrap;
  box-shadow: inset 0 0 0 1.5px var(--line-2), 0 3px 0 var(--line-2);
  transition: transform .08s ease, box-shadow .08s ease, background .15s ease;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(2px); box-shadow: inset 0 0 0 1.5px var(--line-2), 0 1px 0 var(--line-2); }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
.btn-primario { background: var(--ouro); color: var(--sobre-ouro); box-shadow: 0 3px 0 var(--ouro-fundo); }
.btn-primario:hover { background: #FFCB55; }
.btn-primario:active { box-shadow: 0 1px 0 var(--ouro-fundo); }
.btn-perigo { background: var(--falta); color: #fff; box-shadow: 0 3px 0 var(--falta-fundo); }
.btn-perigo:hover { background: var(--falta); filter: brightness(1.05); }
.btn-perigo:active { box-shadow: 0 1px 0 var(--falta-fundo); }
.btn-leve { box-shadow: none; background: transparent; color: var(--ink-2); padding-inline: 10px; }
.btn-leve:hover { background: var(--bg-2); color: var(--ink); }
.btn-leve:active { box-shadow: none; }
.btn-p { min-height: 34px; padding: 6px 11px; font-size: 13.5px; border-radius: 11px; }
.btn-icone { width: 42px; padding: 0; }
.btn-icone.btn-p { width: 34px; }

.campo { display: grid; gap: 6px; min-width: 0; }
.campo > span { font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.campo small { color: var(--muted); font-size: 12.5px; }
.entrada, .campo input:not([type=checkbox]):not([type=radio]), .campo select, .campo textarea, select.entrada {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 13px;
  border: 1.5px solid var(--line-2); background: var(--surface-2); color: var(--ink);
  font-size: 15px;
}
.campo textarea { min-height: 140px; resize: vertical; line-height: 1.45; }
.entrada:focus, .campo input:focus, .campo select:focus, .campo textarea:focus { outline: none; border-color: var(--foco); box-shadow: 0 0 0 3px var(--uva-suave); }
.busca { position: relative; flex: 1 1 220px; min-width: 0; }
.busca .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.busca input { padding-left: 38px !important; }
.grade-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.check {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px;
  background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--line); font-size: 14px; cursor: pointer;
}
.check input { width: 17px; height: 17px; accent-color: var(--uva); margin: 0; }
.msg-erro { color: var(--falta-tinta); background: var(--falta-suave); padding: 9px 12px; border-radius: 12px; font-size: 14px; }
.msg-ok { color: var(--ok-tinta); background: var(--ok-suave); padding: 9px 12px; border-radius: 12px; font-size: 14px; }

/* ---------- etiquetas ---------- */
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; line-height: 1.35; white-space: nowrap;
  background: var(--neutro-suave); color: var(--neutro-tinta);
}
.tag .ic { width: 13px; height: 13px; }
.tag-ok { background: var(--ok-suave); color: var(--ok-tinta); }
.tag-falta { background: var(--falta-suave); color: var(--falta-tinta); }
.tag-cede { background: var(--cede-suave); color: var(--cede-tinta); }
.tag-prio { background: var(--ouro-suave); color: var(--ouro-tinta); }
.tag-bonus { background: var(--rosa-suave); color: var(--rosa-tinta); }
.tag-tom { background: var(--t-suave); color: var(--t-ink); }
.tag-vivo { background: var(--ok-suave); color: var(--ok-tinta); }
.tag-vivo .ic { animation: pulsar 1.6s ease-in-out infinite; }
@keyframes pulsar { 50% { opacity: .35; } }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; padding: 7px 13px 7px 9px; border-radius: 999px; border: 0;
  background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink-2);
  font: 600 14px/1.1 var(--f-corpo);
}
.chip .ic-item { width: 22px; height: 22px; }
.chip[aria-pressed="true"] { background: var(--t-suave, var(--uva-suave)); color: var(--t-ink, var(--uva-tinta)); box-shadow: inset 0 0 0 2px var(--t, var(--uva)); }
.chip.sem-icone { padding-left: 13px; }

/* ---------- leilão de hoje ---------- */
.data-grande { font: 600 38px/1 var(--f-display); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; letter-spacing: .01em; }
.data-dia { color: var(--ink-2); font: 600 16px/1.2 var(--f-display); margin-bottom: 6px; }
.hoje-meta { display: grid; gap: 8px; justify-items: end; }
.hoje-meta .campo { width: 190px; }
.status-vivo { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; align-items: start; }
.tile {
  border-radius: 22px; background: var(--t-suave); padding: 16px; display: grid; gap: 14px; align-content: start;
  box-shadow: inset 0 0 0 1.5px var(--t-linha);
}
.tile-cabeca { display: flex; gap: 12px; align-items: center; }
.selo-item {
  width: 50px; height: 50px; border-radius: 16px; background: var(--surface); display: grid; place-items: center; flex: none;
  box-shadow: 0 3px 0 var(--t-linha);
}
.selo-item .ic-item { width: 34px; height: 34px; }
.tile-cabeca h3 { font-size: 18px; color: var(--t-ink); }
.tile-cabeca p { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.contadores { display: grid; gap: 8px; }
.contador {
  display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 16px; background: var(--surface);
}
.contador .rot { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; color: var(--ink); }
.contador .rot small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
.contador output { min-width: 2.2ch; text-align: center; font: 600 24px/1 var(--f-display); color: var(--t-ink); font-variant-numeric: tabular-nums; }
.passo {
  width: 38px; height: 38px; border: 0; border-radius: 12px; display: grid; place-items: center;
  background: var(--t-suave); color: var(--t-ink); box-shadow: 0 2px 0 var(--t-linha);
}
.passo:active { transform: translateY(1px); box-shadow: none; }
.passo[disabled] { opacity: .35; cursor: not-allowed; }
.passo .ic { width: 18px; height: 18px; }
.inicio { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }
.inicio strong { color: var(--ink); font-weight: 700; }
.inicio input { width: 72px; min-height: 36px; padding: 6px 8px; border-radius: 11px; border: 1.5px solid var(--t-linha); background: var(--surface); text-align: center; font: 600 15px var(--f-display); color: var(--ink); }
.devolvidas { display: grid; gap: 6px; padding: 10px 12px; border-radius: 16px; background: var(--surface); }
.devolvidas > p { font-size: 12.5px; font-weight: 700; color: var(--ouro-tinta); }
.devolvidas ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }

.dica { color: var(--muted); font-size: 13.5px; max-width: 75ch; }

.resultado { display: grid; gap: 16px; }
.bloco { border-radius: 22px; box-shadow: inset 0 0 0 1.5px var(--t-linha); overflow: hidden; background: var(--surface); }
.bloco-cabeca { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--t-suave); flex-wrap: wrap; }
.bloco-cabeca h3 { font-size: 17px; color: var(--t-ink); flex: 1 1 auto; min-width: 0; }
.bloco-cabeca .meta { font-size: 13.5px; color: var(--ink-2); font-weight: 600; }
.bloco-corpo { padding: 14px 16px 16px; display: grid; gap: 12px; }
.pagina { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 12px; align-items: start; }
.pagina-rotulo { padding-top: 10px; display: grid; gap: 2px; }
.pagina-rotulo strong { font: 600 15px/1.1 var(--f-display); color: var(--ink); }
.pagina-rotulo span { font-size: 12px; color: var(--muted); }
.pagina-rotulo .tag { justify-self: start; margin-top: 4px; }
.vagas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.vagas.inteira { grid-template-columns: minmax(0, 1fr); }
.vaga {
  position: relative; display: grid; gap: 3px; align-content: start; text-align: left; min-width: 0;
  padding: 10px 12px 11px; border: 0; border-radius: 16px; background: var(--surface-2);
  box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink);
}
button.vaga:hover { box-shadow: inset 0 0 0 2px var(--t); }
.vaga-topo { display: flex; align-items: center; gap: 6px; min-width: 0; }
.vaga-num { font: 600 12.5px/1 var(--f-display); padding: 4px 7px; border-radius: 8px; background: var(--t-suave); color: var(--t-ink); font-variant-numeric: tabular-nums; flex: none; }
.vaga-num.prio { background: var(--ouro-suave); color: var(--ouro-tinta); }
.vaga-num.cede { background: var(--surface); color: var(--cede-tinta); }
.vaga-q { margin-left: auto; font: 600 13px/1 var(--f-display); color: var(--t-ink); flex: none; }
.vaga-nick { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.vaga-sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vaga-passou { font-size: 12px; color: var(--falta-tinta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vaga-passou s { text-decoration-thickness: 1.5px; }
.vaga.prioridade { background: var(--ouro-suave); box-shadow: inset 0 0 0 1.5px var(--sol-linha); }
.vaga.cedida { background: var(--cede-suave); box-shadow: inset 0 0 0 1.5px var(--cede-suave); }
.vaga.cedida .vaga-sub { color: var(--cede-tinta); }
.vaga.sem-dono { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-2); border: 0; }
.vaga.sem-dono .vaga-nick { color: var(--muted); font-weight: 500; }
.vaga.nova { animation: aparecer .34s cubic-bezier(.34, 1.4, .64, 1) both; animation-delay: var(--atraso, 0ms); }
@keyframes aparecer { from { transform: scale(.9); opacity: .45; } to { transform: none; opacity: 1; } }
.vaga.mudou { animation: acender 1.6s ease-out; }
@keyframes acender {
  0% { box-shadow: inset 0 0 0 2px var(--ouro), 0 0 0 0 var(--brilho); }
  35% { box-shadow: inset 0 0 0 2px var(--ouro), 0 0 0 7px var(--brilho); }
  100% { box-shadow: inset 0 0 0 1.5px var(--line), 0 0 0 12px var(--brilho-fim); }
}
.vaga.minha { box-shadow: inset 0 0 0 2.5px var(--ouro); }
.vaga-voce { margin-left: auto; font: 700 11.5px/1 var(--f-corpo); padding: 4px 7px; border-radius: 8px; background: var(--ouro); color: var(--sobre-ouro); flex: none; }
.vaga-voce + .vaga-q { margin-left: 6px; }
output.pulou { animation: pular .3s cubic-bezier(.34, 1.6, .64, 1); }
.inicio .andou { animation: andar .5s cubic-bezier(.34, 1.6, .64, 1) 2; }
@keyframes andar { 45% { transform: scale(1.12); } }
@keyframes pular { 45% { transform: scale(1.35); } }
.confete { position: fixed; inset: 0; pointer-events: none; z-index: 70; }

.contagem {
  display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px 6px 9px; border-radius: 999px;
  background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink-2);
  font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.contagem .ic { width: 16px; height: 16px; }
.contagem.perto { background: var(--ouro-suave); color: var(--ouro-tinta); box-shadow: inset 0 0 0 1.5px var(--sol-linha); }
.contagem.agora { background: var(--ok-suave); color: var(--ok-tinta); box-shadow: none; }
.ponto-vivo { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulsar 1.6s ease-in-out infinite; flex: none; }

.minha-vez { border-radius: 22px; padding: 16px; background: var(--ouro-suave); display: grid; gap: 12px; box-shadow: inset 0 0 0 1.5px var(--sol-linha); }
.mv-cabeca { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mv-cabeca h2 { font-size: 17px; color: var(--ouro-tinta); }
.mv-cabeca p { font-size: 13.5px; color: var(--ink-2); }
.mv-selo { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--surface); color: var(--ouro-tinta); font: 600 19px var(--f-display); box-shadow: 0 3px 0 var(--sol-linha); }
.mv-selo .ic { width: 20px; height: 20px; }
.mv-itens { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px; }
.mv-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: center; padding: 10px 12px; border-radius: 16px; background: var(--surface); }
.mv-item .ic-item { grid-row: span 2; width: 30px; height: 30px; }
.mv-item strong { font-size: 14.5px; color: var(--ink); line-height: 1.3; }
.mv-item span { font-size: 13px; color: var(--ink-2); line-height: 1.35; }
.mv-item.destaque { box-shadow: inset 0 0 0 2px var(--ouro); }
.lista-fila li.eu { box-shadow: inset 0 0 0 2px var(--ouro); }
.lista-fila li.vez.eu { box-shadow: inset 0 0 0 2px var(--t), 0 0 0 3px var(--ouro); }
tbody tr.eu td { background: var(--ouro-suave); }
.pagina-ajuste { grid-column: 2; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.pagina-ajuste output { font: 600 16px var(--f-display); min-width: 1.4ch; text-align: center; color: var(--t-ink); }
.pagina-ajuste .passo { width: 30px; height: 30px; border-radius: 10px; }
.pagina-ajuste .passo .ic { width: 15px; height: 15px; }
.bloco-pe { font-size: 13.5px; color: var(--ink-2); display: flex; gap: 8px; align-items: flex-start; padding-top: 4px; }
.bloco-pe .ic { margin-top: 1px; }
.bloco-pe span { min-width: 0; }
.bloco-pe strong { color: var(--ink); }
.passaram-lista { display: flex; flex-wrap: wrap; gap: 6px; }

.previa { display: grid; gap: 10px; }
.previa-linha { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.previa-linha .ic-item { width: 26px; height: 26px; }
.previa-linha .nomes { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }

.rodape-hoje {
  position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); z-index: 4;
  display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
  padding: 12px 12px 12px 18px; border-radius: 20px;
  background: var(--surface); box-shadow: var(--sombra-forte), inset 0 0 0 1.5px var(--line);
}
.rodape-hoje .resumo { flex: 1 1 220px; font-size: 14px; color: var(--ink-2); min-width: 0; }
.rodape-hoje .resumo strong { color: var(--ink); font: 600 16px var(--f-display); }

/* ---------- filas ---------- */
.lista-fila { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 6px 14px; }
.lista-fila li {
  display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 7px 8px 7px 8px; border-radius: 14px; min-height: 48px;
}
.lista-fila li:nth-child(odd) { background: var(--surface-2); }
.lista-fila li.vez { background: var(--t-suave); box-shadow: inset 0 0 0 2px var(--t); }
.lista-fila .n { font: 600 14px var(--f-display); color: var(--t-ink); text-align: center; font-variant-numeric: tabular-nums; }
.lista-fila .quem { min-width: 0; display: grid; }
.lista-fila .quem strong { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lista-fila .quem span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lista-fila .marcas { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }

/* ---------- tabelas ---------- */
.rolagem { overflow-x: auto; border-radius: var(--raio-m); box-shadow: inset 0 0 0 1.5px var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--muted); padding: 11px 12px; white-space: nowrap; background: var(--surface-2); border-bottom: 1.5px solid var(--line); }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.zero { color: var(--line-2); }
td.total { font: 600 15px var(--f-display); }
tbody tr.clicavel { cursor: pointer; }
tbody tr.clicavel:hover td { background: var(--bg-2); }
tbody tr.saiu td { color: var(--muted); }
.cel-membro { display: grid; min-width: 140px; }
.cel-membro strong { font-weight: 700; }
.cel-membro span { font-size: 12.5px; color: var(--muted); }
.th-item { display: inline-flex; align-items: center; gap: 6px; }
.th-item .ic-item { width: 18px; height: 18px; }

/* ---------- histórico e listas ---------- */
.mes { border-radius: var(--raio-m); box-shadow: inset 0 0 0 1.5px var(--line); overflow: hidden; }
.mes > summary, .sessao > summary { list-style: none; cursor: pointer; }
.mes > summary::-webkit-details-marker, .sessao > summary::-webkit-details-marker { display: none; }
.mes > summary { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--surface-2); flex-wrap: wrap; }
.mes > summary h3 { font-size: 17px; flex: 1 1 auto; text-transform: capitalize; }
.mes > summary .meta { color: var(--ink-2); font-size: 13.5px; font-weight: 600; }
.mes > summary .ic { transition: transform .2s ease; }
.mes[open] > summary .ic.seta { transform: rotate(90deg); }
.sessoes { display: grid; }
.sessao { border-top: 1px solid var(--line); }
.sessao > summary { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; }
.sessao > summary:hover { background: var(--bg-2); }
.sessao .quando strong { display: block; font: 600 15px var(--f-display); }
.sessao .quando span { font-size: 12.5px; color: var(--muted); }
.sessao .resumo-itens { display: flex; gap: 8px; flex-wrap: wrap; min-width: 0; }
.mini {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 5px; border-radius: 999px;
  background: var(--t-suave); color: var(--t-ink); font-size: 13px; font-weight: 600; white-space: nowrap;
}
.mini .ic-item { width: 20px; height: 20px; }
.sessao .unidades { font: 600 15px var(--f-display); color: var(--ink-2); text-align: right; white-space: nowrap; }
.sessao-detalhe { padding: 4px 16px 16px 16px; display: grid; gap: 12px; }
.det-item { display: grid; gap: 6px; padding: 12px; border-radius: 16px; background: var(--t-suave); }
.det-item h4 { font-size: 15px; color: var(--t-ink); display: flex; align-items: center; gap: 8px; }
.det-item h4 .ic-item { width: 22px; height: 22px; }
.det-item .nomes { display: flex; flex-wrap: wrap; gap: 6px; }
.nome-pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; background: var(--surface); font-size: 13.5px; font-weight: 600; }
.nome-pill small { color: var(--muted); font-weight: 600; }
.nome-pill.passou { color: var(--falta-tinta); }
.nome-pill.cedeu { color: var(--cede-tinta); }

.grupo { display: grid; gap: 8px; }
.grupo-cabeca { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.grupo-cabeca h3 { font-size: 16px; }
.grupo-cabeca span { color: var(--muted); font-size: 13.5px; }
.linhas { display: grid; gap: 6px; }
.linha {
  display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.3fr) auto auto; gap: 10px; align-items: center;
  padding: 10px 12px; border-radius: 14px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line);
}
.linha .quem { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.linha .oque { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14px; color: var(--ink-2); }
.linha .oque .ic-item { width: 22px; height: 22px; }
.linha .oque span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.linha .obs { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); margin-top: -4px; }

.sugestoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.sugestao { padding: 14px; border-radius: 20px; background: var(--t-suave); display: grid; gap: 10px; box-shadow: inset 0 0 0 1.5px var(--t-linha); }
.sugestao header { display: flex; gap: 10px; align-items: center; }
.sugestao h3 { font-size: 15.5px; color: var(--t-ink); }
.sugestao .proximo { font-size: 14px; color: var(--ink-2); }
.sugestao .proximo strong { color: var(--ink); font: 600 18px var(--f-display); display: block; }

/* ---------- ajustes ---------- */
.cartoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.cartao { padding: 14px 16px; border-radius: 18px; background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--line); display: grid; gap: 8px; align-content: start; }
.cartao.tom { background: var(--t-suave); box-shadow: inset 0 0 0 1.5px var(--t-linha); }
.cartao h3 { font-size: 15.5px; display: flex; gap: 8px; align-items: center; }
.cartao .ic-item { width: 24px; height: 24px; }
.cartao p { font-size: 14px; color: var(--ink-2); }
.regras { display: grid; gap: 10px; max-width: 72ch; }
.regras p { color: var(--ink-2); font-size: 14.5px; }
.regras strong { color: var(--ink); }
.pessoas { display: grid; gap: 8px; }
.pessoa { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); flex-wrap: wrap; }
.pessoa .quem { flex: 1 1 200px; min-width: 0; }
.pessoa .quem strong { display: block; }
.pessoa .quem span { font-size: 13px; color: var(--muted); word-break: break-all; }
.log { display: grid; gap: 2px; max-height: 360px; overflow: auto; padding-right: 4px; }
.log-item { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.log-item time { color: var(--muted); font-variant-numeric: tabular-nums; }
.log-item strong { font-weight: 700; }

/* ---------- janelas ---------- */
.veu {
  position: fixed; inset: 0; z-index: 40; background: var(--veu);
  display: grid; place-items: center; padding: 24px 16px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 24px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  animation: veu .16s ease both;
}
@keyframes veu { from { opacity: 0; } }
.janela {
  width: min(560px, 100%); max-height: 100%; overflow: auto; background: var(--surface); color: var(--ink);
  border-radius: var(--raio-g); box-shadow: var(--sombra-forte); padding: 22px; display: grid; gap: 16px; align-content: start;
  animation: subir .22s cubic-bezier(.32, .72, 0, 1) both;
}
.janela.larga { width: min(760px, 100%); }
@keyframes subir { from { transform: translateY(14px); opacity: .6; } }
@keyframes descer { from { transform: translateY(-12px); opacity: .6; } }
.janela-cabeca { display: flex; align-items: flex-start; gap: 12px; }
.janela-cabeca h2 { font-size: 21px; flex: 1; min-width: 0; }
.janela-cabeca p { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
.janela-acoes { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding-top: 4px; }
.opcoes { display: grid; gap: 8px; }
.opcao {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; align-items: center; text-align: left;
  padding: 13px 14px; border: 0; border-radius: 16px; background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink);
}
.opcao:hover { box-shadow: inset 0 0 0 2px var(--foco); }
.opcao[aria-pressed="true"] { box-shadow: inset 0 0 0 2.5px var(--foco); background: var(--uva-suave); }
.opcao .ic, .opcao .bolinha { grid-row: span 2; width: 34px; height: 34px; padding: 7px; border-radius: 11px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); }
.opcao strong { font-size: 15px; }
.opcao span { font-size: 13px; color: var(--muted); }
.opcao.ok .ic { color: var(--ok-tinta); background: var(--ok-suave); box-shadow: none; }
.opcao.falta .ic { color: var(--falta-tinta); background: var(--falta-suave); box-shadow: none; }
.opcao.neutro .ic { color: var(--neutro-tinta); background: var(--neutro-suave); box-shadow: none; }
.opcao.cede .ic { color: var(--cede-tinta); background: var(--cede-suave); box-shadow: none; }
.entrada-grande { display: grid; gap: 10px; }
.entrada-grande .opcao { padding: 16px; }
.entrada-grande .opcao .ic { width: 40px; height: 40px; padding: 9px; }
.segmentos { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--bg-2); }
.segmentos button { flex: 1; border: 0; padding: 9px 10px; border-radius: 11px; background: transparent; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.segmentos button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--sombra); }
.ficha-numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.numero { padding: 10px 12px; border-radius: 16px; background: var(--t-suave, var(--surface-2)); display: grid; gap: 2px; }
.numero strong { font: 600 22px/1.1 var(--f-display); color: var(--t-ink, var(--ink)); font-variant-numeric: tabular-nums; }
.numero span { font-size: 12.5px; color: var(--ink-2); }
.imagem-exportada { width: 100%; border-radius: 16px; box-shadow: inset 0 0 0 1px var(--line); background: #fff; display: block; }
.relatorio { width: 100%; min-height: 220px; font: 13.5px/1.5 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }

/* ---------- avisos ---------- */
.toasts {
  position: fixed; z-index: 60; display: grid; gap: 8px; justify-items: end;
  right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 14px);
  pointer-events: none; max-width: calc(100% - 32px);
}
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 16px;
  background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14.5px; box-shadow: var(--sombra-forte);
  animation: descer .22s cubic-bezier(.32, .72, 0, 1) both; max-width: 440px;
}
.toast.erro { background: var(--falta); color: #fff; }
.toast.aviso { background: var(--ouro); color: var(--sobre-ouro); }
.carregando { display: grid; place-items: center; gap: 14px; padding: 80px 16px; color: var(--muted); text-align: center; }
.carregando .emblema { width: 64px; height: 64px; animation: balanco 1.4s ease-in-out infinite; }
@keyframes balanco { 50% { transform: translateY(-6px) rotate(-4deg); } }

/* ---------- celular ---------- */
@media (max-width: 900px) {
  .corpo { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .abas {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    display: flex; overflow-x: auto; gap: 6px; padding: 8px 2px; margin-inline: -2px;
    background: var(--bg); scrollbar-width: none;
  }
  .abas::-webkit-scrollbar { display: none; }
  .aba { width: auto; flex: none; padding: 9px 12px; }
  .aba[aria-current="page"] { box-shadow: inset 0 0 0 1.5px var(--line); }
}
@media (max-width: 640px) {
  .app { padding-block: 12px 32px; gap: 12px; }
  .painel { padding: 16px; border-radius: 22px; }
  .marca-nome { font-size: 22px; }
  .marca-sub { font-size: 12.5px; }
  .data-grande { font-size: 30px; }
  .painel-cabeca h1 { font-size: 25px; }
  .hoje-meta { justify-items: start; }
  .vagas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pagina { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .pagina-rotulo { padding-top: 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .pagina-rotulo .tag { margin-top: 0; }
  .pagina-ajuste { grid-column: 1; }
  .sessao > summary { grid-template-columns: minmax(0, 1fr) auto; }
  .sessao .resumo-itens { grid-column: 1 / -1; grid-row: 2; }
  .linha { grid-template-columns: minmax(0, 1fr) auto; }
  .linha .oque { grid-column: 1 / -1; grid-row: 2; }
  .veu { place-items: end center; padding: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 24px); }
  .janela { width: 100%; border-radius: 26px 26px 0 0; padding: 20px 16px calc(env(safe-area-inset-bottom, 0px) + 20px); max-height: 92%; }
  .log-item { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .toasts { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); justify-items: stretch; }
  .rodape-hoje { padding: 12px; }
  .rodape-hoje .linha-acoes { width: 100%; }
  .rodape-hoje .linha-acoes .btn { flex: 1 1 auto; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

<body>
<div id="app" class="app"></div>
<script src="config.js"></script>
<script>
/* logic.js */
/* PoringHub · Leilão da guilda
   Regras do rodízio, sem nenhuma dependência de tela.
   Roda no navegador (window.PH) e no Node (module.exports) para os testes. */
(function (raiz) {
  'use strict';

  const ESQUEMA = 1;

  const ITENS_PADRAO = [
    {
      id: 'album', nome: 'Álbum de Fragmento', curto: 'Álbum', modo: 'unidade', cor: 'uva', icone: 'album', ativo: true,
      bonus: { id: 'pacote', nome: 'Pac. Frag. Ilusória', curto: 'Pacote', icone: 'pacote', cor: 'rosa' },
      designado: { id: 'album_d', nome: 'Álbum Designado', curto: 'Álbum desig.' }
    },
    {
      id: 'luz', nome: 'Baú Luz e Sombra', curto: 'Luz e Sombra', modo: 'pagina', cor: 'coral', icone: 'bau_luz', ativo: true,
      designado: { id: 'luz_d', nome: 'Luz e Sombra Designado', curto: 'L&S desig.' }
    },
    {
      id: 'tempo', nome: 'Baú Espaço e Tempo', curto: 'Espaço e Tempo', modo: 'pagina', cor: 'mar', icone: 'bau_tempo', ativo: true,
      designado: { id: 'tempo_d', nome: 'Espaço e Tempo Designado', curto: 'E&T desig.' }
    }
  ];

  const NOMES_DIA = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  const NOMES_DIA_CURTO = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  const NOMES_MES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

  const TIPOS_QUE_CONTAM = new Set(['levou', 'recebeu', 'designado']);
  const TIPOS_AUSENCIA = new Set(['faltou', 'naoquis', 'cedeu']);
  const PASSES = new Set(['faltou', 'naoquis']);

  /* ---------- utilidades ---------- */

  function clone(x) { return x == null ? x : JSON.parse(JSON.stringify(x)); }

  let contadorId = 0;
  function novoId(prefixo) {
    contadorId = (contadorId + 1) % 1296;
    return (prefixo || '') + Date.now().toString(36).slice(-6) + contadorId.toString(36).padStart(2, '0') + Math.random().toString(36).slice(2, 5);
  }

  function inteiro(v, min, max, padrao) {
    const n = parseInt(v, 10);
    if (!Number.isFinite(n)) return padrao;
    return Math.min(max, Math.max(min, n));
  }

  const colador = new Intl.Collator('pt-BR', { sensitivity: 'base', numeric: true });
  function compararNick(a, b) {
    const c = colador.compare(String(a), String(b));
    if (c) return c;
    return a < b ? -1 : a > b ? 1 : 0;
  }
  function mesmoNick(a, b) { return colador.compare(String(a).trim(), String(b).trim()) === 0; }

  /* ---------- datas (sempre no fuso de quem está usando) ---------- */

  function pad(n) { return String(n).padStart(2, '0'); }
  function isoDe(dt) { return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()); }
  function hoje(agora) { return isoDe(agora || new Date()); }
  function lerISO(s) { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function somarDias(s, n) { const d = lerISO(s); d.setDate(d.getDate() + n); return isoDe(d); }
  function diaDaSemana(s) { return lerISO(s).getDay(); }
  function fmtData(s) { if (!s) return ''; const p = String(s).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function fmtDataCurta(s) { if (!s) return ''; const p = String(s).split('-'); return p[2] + '/' + p[1]; }
  function nomeDoDia(s) { return NOMES_DIA[diaDaSemana(s)]; }
  function nomeDoMes(s) { const p = String(s).split('-'); return NOMES_MES[Number(p[1]) - 1] + ' de ' + p[0]; }
  function diferencaDias(a, b) { return Math.round((lerISO(a) - lerISO(b)) / 86400000); }
  function rotuloRelativo(d, ref) {
    const n = diferencaDias(d, ref);
    if (n === 0) return 'hoje';
    if (n === 1) return 'amanhã';
    if (n === -1) return 'ontem';
    return n > 1 ? 'em ' + n + ' dias' : 'há ' + (-n) + ' dias';
  }

  /* ---------- estado ---------- */

  function estadoVazio() {
    const e = {
      esquema: ESQUEMA,
      guilda: { nome: 'PoringHub', jogo: 'Ragnarok Origin Classic', dias: [2, 4, 0], vagas: 4, horario: '21:00' },
      itens: clone(ITENS_PADRAO),
      membros: {},
      filas: {},
      prioridade: {},
      registros: [],
      sessoes: []
    };
    for (const it of e.itens) garantirItem(e, it.id);
    return e;
  }

  /* Cada item precisa da sua entrada de fila e de prioridade. */
  function garantirItem(e, itemId) {
    if (!e.filas[itemId]) e.filas[itemId] = { ponteiro: null, ponteiroDesig: null };
    if (!Array.isArray(e.prioridade[itemId])) e.prioridade[itemId] = [];
    return e.filas[itemId];
  }

  function normalizar(dados) {
    const e = estadoVazio();
    if (!dados || typeof dados !== 'object' || Array.isArray(dados)) return e;
    const d = clone(dados);
    e.guilda = Object.assign(e.guilda, d.guilda || {});
    e.guilda.dias = Array.isArray(e.guilda.dias) ? e.guilda.dias.filter(n => n >= 0 && n <= 6) : [2, 4, 0];
    e.guilda.vagas = inteiro(e.guilda.vagas, 1, 12, 4);
    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(String(e.guilda.horario || ''))) e.guilda.horario = '21:00';
    if (Array.isArray(d.itens) && d.itens.length) e.itens = d.itens;
    e.membros = d.membros && typeof d.membros === 'object' ? d.membros : {};
    e.filas = d.filas && typeof d.filas === 'object' ? d.filas : {};
    e.prioridade = d.prioridade && typeof d.prioridade === 'object' ? d.prioridade : {};
    e.registros = Array.isArray(d.registros) ? d.registros : [];
    e.sessoes = Array.isArray(d.sessoes) ? d.sessoes : [];
    for (const it of e.itens) {
      e.filas[it.id] = Object.assign({ ponteiro: null, ponteiroDesig: null }, e.filas[it.id] || {});
      garantirItem(e, it.id);
    }
    return e;
  }

  function itensAtivos(e) { return e.itens.filter(i => i.ativo !== false); }
  function item(e, id) { return e.itens.find(i => i.id === id) || null; }

  /* Tudo que pode ser contado nos totais: item principal, bônus e designado. */
  function catalogo(e) {
    const c = {};
    for (const it of e.itens) {
      c[it.id] = { id: it.id, nome: it.nome, curto: it.curto, cor: it.cor, icone: it.icone, principal: it.id, tipo: 'principal' };
      if (it.bonus) c[it.bonus.id] = { id: it.bonus.id, nome: it.bonus.nome, curto: it.bonus.curto, cor: it.bonus.cor || it.cor, icone: it.bonus.icone || it.icone, principal: it.id, tipo: 'bonus' };
      if (it.designado) c[it.designado.id] = { id: it.designado.id, nome: it.designado.nome, curto: it.designado.curto, cor: it.cor, icone: it.icone, principal: it.id, tipo: 'designado' };
    }
    return c;
  }

  function ref(m) { return m ? { id: m.id, nick: m.nick } : null; }

  /* ---------- filas ---------- */

  /* A fila de um item: membros ativos que participam dele, em ordem alfabética.
     O número de cada um é a posição nessa ordem (1, 2, 3...). */
  function fila(e, itemId) {
    return Object.values(e.membros)
      .filter(m => m.ativo !== false && !(m.fora || []).includes(itemId))
      .sort((a, b) => compararNick(a.nick, b.nick));
  }

  /* O ponteiro guarda QUEM é o próximo (não o número), então entrada e saída
     de membros não muda de quem é a vez. Se essa pessoa saiu, a vez passa
     para o primeiro nick que vem depois dela na ordem alfabética. */
  function indiceDe(f, r) {
    if (!f.length) return -1;
    if (!r) return 0;
    let i = f.findIndex(m => m.id === r.id);
    if (i >= 0) return i;
    i = f.findIndex(m => compararNick(m.nick, r.nick) > 0);
    return i >= 0 ? i : 0;
  }

  function posicaoNaFila(e, itemId, membroId) {
    const f = fila(e, itemId);
    const i = f.findIndex(m => m.id === membroId);
    return i >= 0 ? i + 1 : null;
  }

  function proximoDaFila(e, itemId) {
    const f = fila(e, itemId);
    if (!f.length) return null;
    const i = indiceDe(f, e.filas[itemId] && e.filas[itemId].ponteiro);
    return { membro: f[i], numero: i + 1, total: f.length };
  }

  function sugestaoDesignado(e, itemId) {
    const f = fila(e, itemId);
    if (!f.length) return null;
    const i = indiceDe(f, e.filas[itemId] && e.filas[itemId].ponteiroDesig);
    return { membro: f[i], numero: i + 1, total: f.length };
  }

  /* ---------- montagem do leilão ---------- */

  function rascunhoVazio(e, data) {
    const r = { data: data || null, itens: {} };
    for (const it of e.itens) r.itens[it.id] = rascunhoItemVazio(e);
    return r;
  }
  function rascunhoItemVazio(e) {
    const v = (e && e.guilda && e.guilda.vagas) || 4;
    return { paginas: 0, ultima: v, paginasBonus: 0, ultimaBonus: v, inicio: null, passes: {}, cedidos: {} };
  }
  function rascunhoItem(rasc, e, itemId) {
    const base = rascunhoItemVazio(e);
    const r = rasc && rasc.itens && rasc.itens[itemId];
    if (!r) return base;
    return Object.assign(base, r, { passes: Object.assign({}, r.passes), cedidos: Object.assign({}, r.cedidos) });
  }

  /* As vagas que saíram. Cada página tem `vagas` unidades (4 por padrão).
     - modo 'unidade' (Álbum): cada unidade é uma vaga de 1 membro, a página atende 4 pessoas.
     - modo 'pagina' (Baús): a página inteira é uma vaga só, com as 4 unidades para o mesmo membro.
     A última página pode vir incompleta. O bônus (Pacote) sai nas páginas depois do item. */
  function gerarVagas(it, r, vagasPorPagina) {
    const V = vagasPorPagina || 4;
    const series = [{ itemId: it.id, bonus: false, paginas: inteiro(r.paginas, 0, 99, 0), ultima: r.ultima }];
    if (it.bonus) series.push({ itemId: it.bonus.id, bonus: true, paginas: inteiro(r.paginasBonus, 0, 99, 0), ultima: r.ultimaBonus });
    const vagas = [];
    for (const s of series) {
      for (let p = 1; p <= s.paginas; p++) {
        const ultimaPag = p === s.paginas;
        const unidades = ultimaPag ? inteiro(s.ultima, 1, V, V) : V;
        if (it.modo === 'pagina') {
          vagas.push({ k: s.itemId + ':' + p, item: s.itemId, bonus: s.bonus, pagina: p, pos: 1, q: unidades, ultimaPag, unidades });
        } else {
          for (let v = 1; v <= unidades; v++) {
            vagas.push({ k: s.itemId + ':' + p + ':' + v, item: s.itemId, bonus: s.bonus, pagina: p, pos: v, q: 1, ultimaPag, unidades });
          }
        }
      }
    }
    return vagas;
  }

  /* Quem é chamado, na ordem: primeiro quem tem vez devolvida (prioridade),
     depois a fila a partir do número de início, voltando ao nº 1 depois do último. */
  function criarFonte(e, it, f, inicio, prio) {
    let pi = 0, run = 0;
    const posicao = {};
    f.forEach((m, i) => { posicao[m.id] = i + 1; });
    return {
      proximo() {
        if (pi < prio.length) {
          const p = prio[pi++];
          return { m: p.m, origem: 'prioridade', numero: posicao[p.m] || null, prio: p.id, motivo: p.motivo, dataPrio: p.d };
        }
        if (!f.length) return null;
        const idx = (inicio + run) % f.length;
        run++;
        return { m: f[idx].id, origem: 'fila', numero: idx + 1 };
      },
      get run() { return run; },
      get pi() { return pi; }
    };
  }

  function montarItem(e, it, rIn) {
    const r = rIn || rascunhoItemVazio(e);
    const f = fila(e, it.id);
    const naFila = new Set(f.map(m => m.id));
    const prio = (e.prioridade[it.id] || []).filter(p => naFila.has(p.m));
    const ptr = indiceDe(f, e.filas[it.id] && e.filas[it.id].ponteiro);
    let inicio = ptr;
    if (r.inicio != null && r.inicio !== '' && f.length) {
      const n = parseInt(r.inicio, 10);
      if (n >= 1) inicio = (n - 1) % f.length;
    }
    const vagas = gerarVagas(it, r, e.guilda.vagas);
    const passes = r.passes || {};
    const cedidos = r.cedidos || {};
    const fonte = criarFonte(e, it, f, inicio, prio);

    /* 1ª passada: cada vaga recebe quem foi chamado, na ordem. */
    const linhas = vagas.map(v => ({ vaga: v, chamado: fonte.proximo(), passaram: [], dono: null, recebedor: null }));

    /* 2ª passada: quem passa (faltou ou não quis) libera a vaga para o próximo
       chamado depois de todos os outros, sem tirar ninguém do lugar. */
    const todosPassam = f.length > 0 && f.every(m => PASSES.has(passes[m.id]));
    for (const l of linhas) {
      let c = l.chamado;
      let guarda = 0;
      while (c && PASSES.has(passes[c.m])) {
        l.passaram.push(Object.assign({}, c, { acao: passes[c.m] }));
        if (todosPassam && c.origem === 'fila') { c = null; break; }
        c = fonte.proximo();
        if (++guarda > f.length + prio.length + 4) { c = null; break; }
      }
      l.dono = c || null;
      const para = l.dono && cedidos[l.dono.m];
      if (para && para !== l.dono.m && e.membros[para]) l.recebedor = para;
    }

    const run = fonte.run;
    const proximoIdx = f.length ? (inicio + run) % f.length : -1;
    return {
      item: it, fila: f, vagas, linhas,
      ponteiroIdx: ptr, inicioIdx: inicio, inicioMudou: inicio !== ptr,
      run, proximoIdx,
      prioridade: prio, prioConsumidas: prio.slice(0, fonte.pi).map(p => p.id),
      unidades: vagas.reduce((s, v) => s + v.q, 0),
      paginas: inteiro(r.paginas, 0, 99, 0) + (it.bonus ? inteiro(r.paginasBonus, 0, 99, 0) : 0)
    };
  }

  function montarLeilao(e, rasc) {
    const itens = itensAtivos(e).map(it => montarItem(e, it, rascunhoItem(rasc, e, it.id)));
    const recebem = new Set();
    let paginas = 0, unidades = 0;
    for (const mi of itens) {
      paginas += mi.paginas;
      unidades += mi.unidades;
      for (const l of mi.linhas) {
        if (l.recebedor) recebem.add(l.recebedor);
        else if (l.dono) recebem.add(l.dono.m);
      }
    }
    return { itens, paginas, unidades, membros: recebem.size };
  }

  /* ---------- fechar e desfazer ---------- */

  function registro(d, s, i, m, q, t, o, x) {
    const r = { r: novoId('r'), d, s, i, m, q, t };
    if (o) r.o = o;
    if (x) r.x = x;
    return r;
  }

  function fecharLeilao(estado, rasc, autor) {
    const e = clone(estado);
    const data = rasc && rasc.data;
    if (!data) throw erro('sem_data', 'Escolha a data do leilão.');
    const montagem = montarLeilao(e, rasc);
    if (!montagem.unidades) throw erro('vazio', 'Informe quantas páginas saíram antes de fechar.');
    const sid = novoId('s');
    const antes = {};
    const resumo = {};
    const novos = [];
    for (const mi of montagem.itens) {
      const it = mi.item;
      garantirItem(e, it.id);
      if (!mi.vagas.length) { resumo[it.id] = null; continue; }
      antes[it.id] = { ponteiro: clone(e.filas[it.id].ponteiro), prioridade: clone(e.prioridade[it.id] || []) };
      const novasPrio = [];
      let levaram = 0, passaram = 0, cedidos = 0;
      for (const l of mi.linhas) {
        for (const p of l.passaram) {
          passaram++;
          novos.push(registro(data, sid, l.vaga.item, p.m, l.vaga.q, p.acao, p.origem));
          if (p.acao === 'faltou') novasPrio.push({ id: novoId('p'), m: p.m, motivo: 'faltou', d: data, s: sid });
        }
        if (!l.dono) continue;
        if (l.recebedor) {
          cedidos++;
          novos.push(registro(data, sid, l.vaga.item, l.dono.m, l.vaga.q, 'cedeu', l.dono.origem, l.recebedor));
          novos.push(registro(data, sid, l.vaga.item, l.recebedor, l.vaga.q, 'recebeu', 'cedido', l.dono.m));
          novasPrio.push({ id: novoId('p'), m: l.dono.m, motivo: 'cedeu', d: data, s: sid });
        } else {
          levaram++;
          novos.push(registro(data, sid, l.vaga.item, l.dono.m, l.vaga.q, 'levou', l.dono.origem));
          if (l.vaga.bonus) novasPrio.push({ id: novoId('p'), m: l.dono.m, motivo: 'bonus', d: data, s: sid });
        }
      }
      const consumidas = new Set(mi.prioConsumidas);
      const naFila = new Set(mi.fila.map(m => m.id));
      e.prioridade[it.id] = (e.prioridade[it.id] || [])
        .filter(p => !consumidas.has(p.id) && naFila.has(p.m))
        .concat(novasPrio);
      const len = mi.fila.length;
      let proximo = null;
      if (mi.run > 0 && len) {
        e.filas[it.id].ponteiro = ref(mi.fila[mi.proximoIdx]);
        proximo = mi.fila[mi.proximoIdx];
      } else {
        const p = proximoDaFila(e, it.id);
        proximo = p && p.membro;
      }
      const ini = mi.run > 0 ? mi.fila[mi.inicioIdx] : null;
      resumo[it.id] = {
        paginas: inteiro(rasc.itens[it.id] && rasc.itens[it.id].paginas, 0, 99, 0),
        paginasBonus: it.bonus ? inteiro(rasc.itens[it.id] && rasc.itens[it.id].paginasBonus, 0, 99, 0) : 0,
        unidades: mi.unidades,
        inicio: ini ? mi.inicioIdx + 1 : null, inicioNick: ini ? ini.nick : null,
        proximo: proximo ? mi.fila.indexOf(proximo) + 1 : null, proximoNick: proximo ? proximo.nick : null,
        chamadosDaFila: mi.run, prioridade: mi.prioConsumidas.length,
        levaram, passaram, cedidos
      };
    }
    e.registros = e.registros.concat(novos);
    e.sessoes.push({ id: sid, d: data, em: new Date().toISOString(), por: autor || null, resumo, antes, unidades: montagem.unidades, paginas: montagem.paginas });
    return { estado: e, sessao: sid, registros: novos.length, montagem };
  }

  function ultimaSessao(e) { return e.sessoes.length ? e.sessoes[e.sessoes.length - 1] : null; }

  /* Desfaz o último leilão fechado: devolve os ponteiros e a prioridade de antes
     e apaga o que ele registrou. Só o último pode ser desfeito. */
  function desfazerUltimo(estado) {
    const e = clone(estado);
    const s = ultimaSessao(e);
    if (!s) throw erro('nada', 'Não há leilão fechado para desfazer.');
    for (const itemId of Object.keys(s.antes || {})) {
      garantirItem(e, itemId);
      e.filas[itemId].ponteiro = s.antes[itemId].ponteiro;
      e.prioridade[itemId] = s.antes[itemId].prioridade || [];
    }
    e.registros = e.registros.filter(r => r.s !== s.id);
    e.sessoes.pop();
    return { estado: e, sessao: s };
  }

  /* ---------- membros ---------- */

  function validarNick(nick) {
    const n = String(nick || '').replace(/\s+/g, ' ').trim();
    if (!n) throw erro('nick_vazio', 'Escreva o nick do membro.');
    if (n.length > 32) throw erro('nick_longo', 'O nick pode ter no máximo 32 caracteres.');
    return n;
  }

  function nickEmUso(e, nick, excetoId) {
    return Object.values(e.membros).some(m => m.id !== excetoId && m.ativo !== false && mesmoNick(m.nick, nick));
  }

  function adicionarMembro(estado, dados, data) {
    const e = clone(estado);
    const nick = validarNick(dados.nick);
    if (nickEmUso(e, nick)) throw erro('nick_repetido', 'Já existe um membro com o nick ' + nick + '.');
    const saiu = Object.values(e.membros).find(m => m.ativo === false && mesmoNick(m.nick, nick));
    if (saiu) {
      saiu.ativo = true; delete saiu.saiu; saiu.nick = nick;
      if (dados.classe) saiu.classe = String(dados.classe).trim();
      return { estado: e, membro: saiu, voltou: true };
    }
    const m = { id: novoId('m'), nick, classe: String(dados.classe || '').trim(), ativo: true, desde: data || hoje() };
    e.membros[m.id] = m;
    return { estado: e, membro: m, voltou: false };
  }

  function editarMembro(estado, id, dados) {
    const e = clone(estado);
    const m = e.membros[id];
    if (!m) throw erro('sem_membro', 'Membro não encontrado.');
    if (dados.nick != null) {
      const nick = validarNick(dados.nick);
      if (nickEmUso(e, nick, id)) throw erro('nick_repetido', 'Já existe um membro com o nick ' + nick + '.');
      m.nick = nick;
      for (const itemId of Object.keys(e.filas)) {
        const fq = e.filas[itemId];
        if (fq.ponteiro && fq.ponteiro.id === id) fq.ponteiro.nick = nick;
        if (fq.ponteiroDesig && fq.ponteiroDesig.id === id) fq.ponteiroDesig.nick = nick;
      }
    }
    if (dados.classe != null) m.classe = String(dados.classe).trim();
    if (Array.isArray(dados.fora)) {
      const antes = new Set(m.fora || []);
      m.fora = dados.fora.slice();
      for (const itemId of m.fora) if (!antes.has(itemId)) moverPonteirosDe(e, itemId, id, estado);
      if (!m.fora.length) delete m.fora;
    }
    return e;
  }

  /* Se o ponteiro aponta para quem está saindo da fila, ele passa para o próximo. */
  function moverPonteirosDe(e, itemId, membroId, estadoAntes) {
    const fq = garantirItem(e, itemId);
    const fAntes = fila(estadoAntes, itemId);
    const i = fAntes.findIndex(m => m.id === membroId);
    for (const chave of ['ponteiro', 'ponteiroDesig']) {
      if (fq[chave] && fq[chave].id === membroId) {
        const proximo = fAntes.length > 1 ? fAntes[(i + 1) % fAntes.length] : null;
        fq[chave] = proximo && proximo.id !== membroId ? ref(proximo) : null;
      }
    }
    if (e.prioridade[itemId]) e.prioridade[itemId] = e.prioridade[itemId].filter(p => p.m !== membroId);
  }

  function removerMembro(estado, id, data) {
    const e = clone(estado);
    const m = e.membros[id];
    if (!m) throw erro('sem_membro', 'Membro não encontrado.');
    for (const it of e.itens) moverPonteirosDe(e, it.id, id, estado);
    const temHistorico = e.registros.some(r => r.m === id || r.x === id);
    if (temHistorico) { m.ativo = false; m.saiu = data || hoje(); }
    else delete e.membros[id];
    return { estado: e, arquivado: temHistorico };
  }

  function reativarMembro(estado, id) {
    const e = clone(estado);
    const m = e.membros[id];
    if (!m) throw erro('sem_membro', 'Membro não encontrado.');
    if (nickEmUso(e, m.nick, id)) throw erro('nick_repetido', 'Já existe um membro ativo com o nick ' + m.nick + '.');
    m.ativo = true; delete m.saiu;
    return e;
  }

  /* Uma linha por membro: "Nick" ou "Nick; Classe" (também aceita vírgula ou tab). */
  function importarMembros(estado, texto, data) {
    let e = clone(estado);
    const adicionados = [], ignorados = [];
    const linhas = String(texto || '').split(/\r?\n/);
    for (const bruta of linhas) {
      const linha = bruta.trim();
      if (!linha) continue;
      const partes = linha.split(/\s*[;\t,]\s*/);
      const nick = (partes[0] || '').trim();
      const classe = (partes[1] || '').trim();
      if (!nick) continue;
      try {
        const r = adicionarMembro(e, { nick, classe }, data);
        e = r.estado;
        adicionados.push(r.membro.nick);
      } catch (err) {
        ignorados.push({ nick, motivo: err.message });
      }
    }
    return { estado: e, adicionados, ignorados };
  }

  /* ---------- ponteiros e prioridade (ajustes da staff) ---------- */

  function definirPonteiro(estado, itemId, membroId, chave) {
    const e = clone(estado);
    const m = e.membros[membroId];
    if (!m || !item(e, itemId)) throw erro('invalido', 'Membro ou item não encontrado.');
    garantirItem(e, itemId);
    e.filas[itemId][chave || 'ponteiro'] = ref(m);
    return e;
  }

  function removerPrioridade(estado, itemId, prioId) {
    const e = clone(estado);
    e.prioridade[itemId] = (e.prioridade[itemId] || []).filter(p => p.id !== prioId);
    return e;
  }

  function adicionarPrioridade(estado, itemId, membroId, motivo, data) {
    const e = clone(estado);
    if (!e.membros[membroId]) throw erro('sem_membro', 'Membro não encontrado.');
    e.prioridade[itemId] = (e.prioridade[itemId] || []).concat([{ id: novoId('p'), m: membroId, motivo: motivo || 'manual', d: data || hoje(), s: null }]);
    return e;
  }

  /* ---------- designados ---------- */

  function registrarDesignado(estado, dados) {
    const e = clone(estado);
    const it = item(e, dados.itemId);
    if (!it || !it.designado) throw erro('sem_item', 'Escolha o item designado.');
    if (!e.membros[dados.membro]) throw erro('sem_membro', 'Escolha quem recebeu.');
    garantirItem(e, it.id);
    const q = inteiro(dados.qtd, 1, 999, 1);
    const r = registro(dados.data || hoje(), null, it.designado.id, dados.membro, q, 'designado', 'designado');
    if (dados.obs) r.n = String(dados.obs).slice(0, 140);
    e.registros.push(r);
    const sug = sugestaoDesignado(estado, it.id);
    if (sug && sug.membro.id === dados.membro) {
      const f = fila(e, it.id);
      e.filas[it.id].ponteiroDesig = ref(f[(sug.numero) % f.length]);
    }
    return { estado: e, registro: r, seguiuSugestao: !!(sug && sug.membro.id === dados.membro) };
  }

  function pularDesignado(estado, itemId) {
    const e = clone(estado);
    garantirItem(e, itemId);
    const sug = sugestaoDesignado(e, itemId);
    if (!sug) return e;
    const f = fila(e, itemId);
    e.filas[itemId].ponteiroDesig = ref(f[sug.numero % f.length]);
    return e;
  }

  function removerDesignado(estado, regId) {
    const e = clone(estado);
    const antes = e.registros.length;
    e.registros = e.registros.filter(r => !(r.r === regId && r.t === 'designado'));
    if (e.registros.length === antes) throw erro('sem_registro', 'Registro não encontrado.');
    return e;
  }

  /* ---------- números ---------- */

  function totais(e) {
    const t = {};
    for (const m of Object.values(e.membros)) t[m.id] = { total: 0, ultima: null, porItem: {}, vezes: 0 };
    for (const r of e.registros) {
      if (!TIPOS_QUE_CONTAM.has(r.t)) continue;
      const x = t[r.m] || (t[r.m] = { total: 0, ultima: null, porItem: {}, vezes: 0 });
      x.porItem[r.i] = (x.porItem[r.i] || 0) + r.q;
      x.total += r.q;
      x.vezes++;
      if (!x.ultima || r.d > x.ultima) x.ultima = r.d;
    }
    return t;
  }

  function registrosDoMembro(e, id) {
    return e.registros.filter(r => r.m === id).sort((a, b) => (a.d < b.d ? 1 : a.d > b.d ? -1 : 0));
  }

  function ausencias(e) {
    return e.registros.filter(r => TIPOS_AUSENCIA.has(r.t));
  }

  function prioridadesDoMembro(e, id) {
    const out = [];
    for (const it of e.itens) for (const p of e.prioridade[it.id] || []) if (p.m === id) out.push(Object.assign({ itemId: it.id }, p));
    return out;
  }

  /* Próxima data de leilão a partir de hoje, pulando dias que já têm leilão fechado. */
  function proximaData(e, referencia) {
    const dias = e.guilda.dias && e.guilda.dias.length ? e.guilda.dias : [0, 1, 2, 3, 4, 5, 6];
    const fechadas = new Set(e.sessoes.map(s => s.d));
    for (let i = 0; i < 21; i++) {
      const d = somarDias(referencia, i);
      if (dias.includes(diaDaSemana(d)) && !fechadas.has(d)) return d;
    }
    return referencia;
  }

  /* Datas dos próximos leilões a partir de uma data, pulando dias já fechados. */
  function proximasDatas(e, aPartirDe, n) {
    const out = [];
    let d = aPartirDe;
    for (let i = 0; i < n; i++) {
      d = proximaData(e, d);
      out.push(d);
      d = somarDias(d, 1);
    }
    return out;
  }

  /* Hora marcada do leilão numa data (no fuso de quem está vendo). */
  function inicioDoLeilao(e, data) {
    const p = String(e.guilda.horario || '21:00').split(':').map(Number);
    const d = lerISO(data);
    d.setHours(p[0] || 0, p[1] || 0, 0, 0);
    return d;
  }

  /* Onde um membro está para o próximo leilão de um item: quantas vagas vêm antes dele. */
  function posicaoParaProximo(e, itemId, id) {
    const f = fila(e, itemId);
    const i = f.findIndex(x => x.id === id);
    if (i < 0) return null;
    const naFila = new Set(f.map(x => x.id));
    const prio = (e.prioridade[itemId] || []).filter(p => naFila.has(p.m));
    const k = prio.findIndex(p => p.m === id);
    if (k >= 0) return { numero: i + 1, prioridade: k + 1, antes: k, total: f.length };
    const ptr = indiceDe(f, e.filas[itemId] && e.filas[itemId].ponteiro);
    const distancia = (i - ptr + f.length) % f.length;
    return { numero: i + 1, prioridade: null, antes: prio.length + distancia, total: f.length };
  }

  /* Quantas pessoas cada leilão costuma chamar num item (média dos últimos leilões, contando os que não tiveram o item). */
  function mediaChamados(e, itemId, n) {
    const ultimas = e.sessoes.slice(-(n || 8));
    if (!ultimas.length) return 0;
    const soma = ultimas.reduce((s, x) => {
      const r = x.resumo && x.resumo[itemId];
      return s + (r ? (r.chamadosDaFila || 0) + (r.prioridade || 0) : 0);
    }, 0);
    return soma / ultimas.length;
  }

  /* Minha vez: para cada item, o que o membro tem no leilão de agora e quando chega a vez dele. */
  function minhaVez(e, rasc, id, referencia) {
    const m = e.membros[id];
    if (!m || m.ativo === false) return null;
    const ref = referencia || hoje();
    const montagem = rasc ? montarLeilao(e, rasc) : null;
    const aoVivo = !!(montagem && montagem.unidades > 0);
    let depois = null;
    if (aoVivo) { try { depois = fecharLeilao(e, rasc, null).estado; } catch (err) { depois = null; } }
    const itens = itensAtivos(e).map(it => {
      if (!fila(e, it.id).some(x => x.id === id)) return { item: it, fora: true, hoje: [] };
      const mi = montagem && montagem.itens.find(x => x.item.id === it.id);
      const hojeLista = [];
      if (mi) {
        for (const l of mi.linhas) {
          if (l.dono && l.dono.m === id && !l.recebedor) hojeLista.push({ tipo: 'leva', vaga: l.vaga, origem: l.dono.origem });
          if (l.dono && l.dono.m === id && l.recebedor) hojeLista.push({ tipo: 'cedeu', vaga: l.vaga, para: l.recebedor });
          if (l.recebedor === id) hojeLista.push({ tipo: 'recebe', vaga: l.vaga, de: l.dono.m });
          for (const p of l.passaram) if (p.m === id) hojeLista.push({ tipo: p.acao, vaga: l.vaga });
        }
      }
      const itemAoVivo = !!(mi && mi.vagas.length && depois);
      const base = itemAoVivo ? depois : e;
      const pos = posicaoParaProximo(base, it.id, id);
      const media = mediaChamados(e, it.id, 8);
      const leiloes = pos && media > 0 ? Math.max(1, Math.ceil((pos.antes + 1) / media)) : null;
      let data = null;
      if (leiloes) {
        const inicioBusca = itemAoVivo ? somarDias(rasc.data, 1) : ref;
        const datas = proximasDatas(base, inicioBusca, leiloes);
        data = datas[datas.length - 1];
      }
      return { item: it, fora: false, hoje: hojeLista, pos, media, leiloes, data, depoisDeHoje: itemAoVivo };
    });
    return { membro: m, aoVivo, itens };
  }

  function descreverDias(dias) {
    const ordem = [1, 2, 3, 4, 5, 6, 0];
    const nomes = ordem.filter(d => dias.includes(d)).map(d => NOMES_DIA[d].toLowerCase());
    if (!nomes.length) return 'sem dia fixo';
    if (nomes.length === 1) return nomes[0];
    return nomes.slice(0, -1).join(', ') + ' e ' + nomes[nomes.length - 1];
  }

  function erro(codigo, mensagem) { const x = new Error(mensagem); x.codigo = codigo; return x; }

  const PH = {
    ESQUEMA, ITENS_PADRAO, NOMES_DIA, NOMES_DIA_CURTO, NOMES_MES, TIPOS_QUE_CONTAM, TIPOS_AUSENCIA,
    clone, novoId, inteiro, compararNick, mesmoNick,
    hoje, somarDias, diaDaSemana, fmtData, fmtDataCurta, nomeDoDia, nomeDoMes, diferencaDias, rotuloRelativo, lerISO,
    estadoVazio, normalizar, garantirItem, itensAtivos, item, catalogo, ref,
    fila, indiceDe, posicaoNaFila, proximoDaFila, sugestaoDesignado,
    rascunhoVazio, rascunhoItemVazio, rascunhoItem, gerarVagas, montarItem, montarLeilao,
    fecharLeilao, ultimaSessao, desfazerUltimo,
    adicionarMembro, editarMembro, removerMembro, reativarMembro, importarMembros, nickEmUso,
    definirPonteiro, removerPrioridade, adicionarPrioridade,
    registrarDesignado, pularDesignado, removerDesignado,
    totais, registrosDoMembro, ausencias, prioridadesDoMembro, proximaData, proximasDatas, inicioDoLeilao,
    posicaoParaProximo, mediaChamados, minhaVez, descreverDias, erro
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = PH;
  else raiz.PH = PH;
})(typeof window !== 'undefined' ? window : globalThis);
