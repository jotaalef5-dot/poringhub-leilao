<script>
/* demo.js */
/* Dados de exemplo do protótipo. Nicks inventados; nada aqui é de uma guilda real. */
(function (raiz) {
  'use strict';
  const PH = raiz.PH;

  const NICKS = [
    'AmoraZ', 'Baunilha', 'BeloHz', 'Bixcoito', 'Cacau', 'Caju', 'Capivara', 'Cereja', 'Cocada', 'Dendê',
    'Esquilo', 'Faísca', 'Formiga', 'Fubá', 'Gambiarra', 'Goiaba', 'Guaraná', 'Ipê', 'Jabuti', 'Jambo',
    'Kiwi', 'Lampião', 'Lontra', 'Mandacaru', 'Maracujá', 'Moqueca', 'Nhoque', 'Pamonha', 'Paçoca', 'Pequi',
    'Pitanga', 'Quindim', 'Rapadura', 'Sabiá', 'Sagui', 'Tapioca', 'Tucano', 'Umbu', 'Vatapá', 'Xodó', 'Zabumba'
  ];
  const CLASSES = ['Lorde', 'Paladino', 'Arquimago', 'Professor', 'Atirador de Elite', 'Menestrel', 'Cigana',
    'Sumo-Sacerdote', 'Mestre', 'Algoz', 'Desordeiro', 'Mestre-Ferreiro', 'Criador', 'Invocador'];

  function sorteador(semente) {
    let a = semente >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function gerar(agora) {
    const rnd = sorteador(20261022);
    const escolha = lista => lista[Math.floor(rnd() * lista.length)];
    const hojeISO = PH.hoje(agora);
    const inicio = PH.somarDias(hojeISO, -24);
    let e = PH.estadoVazio();
    for (const n of NICKS) {
      e = PH.adicionarMembro(e, { nick: n, classe: escolha(CLASSES) }, inicio).estado;
    }
    const ids = Object.keys(e.membros);
    const idDe = nick => ids.find(i => e.membros[i].nick === nick);
    /* Dois membros que não pegam baú de Espaço e Tempo. */
    e = PH.editarMembro(e, idDe('Quindim'), { fora: ['tempo'] });
    e = PH.editarMembro(e, idDe('Umbu'), { fora: ['tempo'] });

    const staff = ['Lampião', 'Pitanga', 'Caju'];
    const log = [];
    let versao = 1;
    log.push({ versao, em: inicio + 'T20:05:00', nome: 'Lampião', motivo: 'Cadastrou ' + NICKS.length + ' membros' });

    /* Leilões passados: terça, quinta e domingo até ontem. */
    let d = PH.proximaData(e, inicio);
    while (PH.diferencaDias(d, hojeISO) < 0) {
      const r = PH.rascunhoVazio(e, d);
      r.itens.album.paginas = 1 + Math.floor(rnd() * 3);
      if (rnd() < 0.45) { r.itens.album.paginasBonus = 1; r.itens.album.ultimaBonus = 1 + Math.floor(rnd() * 4); }
      if (rnd() < 0.5) r.itens.album.ultima = 1 + Math.floor(rnd() * 4);
      r.itens.luz.paginas = Math.floor(rnd() * 3);
      r.itens.tempo.paginas = Math.floor(rnd() * 3);
      if (r.itens.luz.paginas && rnd() < 0.4) r.itens.luz.ultima = 2 + Math.floor(rnd() * 3);
      for (const it of e.itens) {
        const mi = PH.montarItem(e, it, r.itens[it.id]);
        for (const l of mi.linhas) {
          if (!l.chamado) continue;
          const x = rnd();
          if (x < 0.07) r.itens[it.id].passes[l.chamado.m] = 'faltou';
          else if (x < 0.095) r.itens[it.id].passes[l.chamado.m] = 'naoquis';
          else if (x < 0.12) r.itens[it.id].cedidos[l.chamado.m] = escolha(ids);
        }
      }
      const autor = escolha(staff);
      try {
        const f = PH.fecharLeilao(e, r, autor);
        e = f.estado;
        versao++;
        log.push({ versao, em: d + 'T21:40:00', nome: autor, motivo: 'Fechou o leilão de ' + PH.nomeDoDia(d).toLowerCase() + ', ' + PH.fmtData(d) });
      } catch (err) { /* leilão sem nada: pula */ }
      d = PH.proximaData(e, PH.somarDias(d, 1));
    }

    /* Alguns designados escolhidos no jogo. */
    const designados = [['album', 2, -12], ['luz', 1, -9], ['album', 1, -5], ['tempo', 1, -3]];
    for (const [itemId, qtd, dias] of designados) {
      const sug = PH.sugestaoDesignado(e, itemId);
      e = PH.registrarDesignado(e, { itemId, membro: sug.membro.id, qtd, data: PH.somarDias(hojeISO, dias), obs: 'Escolhido pela liderança na GvG' }).estado;
      versao++;
      log.push({ versao, em: PH.somarDias(hojeISO, dias) + 'T22:10:00', nome: 'Pitanga', motivo: 'Registrou designado para ' + sug.membro.nick });
    }

    /* Leilão de hoje já em andamento, para a tela abrir com uma lista de verdade. */
    const proxima = PH.proximaData(e, hojeISO);
    const rasc = PH.rascunhoVazio(e, proxima);
    rasc.itens.album.paginas = 2;
    rasc.itens.album.ultima = 3;
    rasc.itens.album.paginasBonus = 1;
    rasc.itens.album.ultimaBonus = 2;
    rasc.itens.luz.paginas = 1;
    rasc.itens.tempo.paginas = 2;
    rasc.itens.tempo.ultima = 3;
    const miAlbum = PH.montarItem(e, PH.item(e, 'album'), rasc.itens.album);
    const terceiro = miAlbum.linhas[2] && miAlbum.linhas[2].chamado;
    if (terceiro) rasc.itens.album.passes[terceiro.m] = 'faltou';

    log.reverse();
    return {
      formato: 1,
      versao,
      dados: e,
      motivo: log[0] ? log[0].motivo : '',
      em: new Date().toISOString(),
      nome: 'Lampião',
      rascunho: rasc,
      rascunhoEm: new Date().toISOString(),
      rascunhoPor: 'Lampião',
      sessao: { modo: 'visitante', usuario: null },
      staff: [
        { user_id: 'demo-lampiao', nome: 'Lampião', email: 'lampiao@exemplo.com', papel: 'admin' },
        { user_id: 'demo-pitanga', nome: 'Pitanga', email: 'pitanga@exemplo.com', papel: 'staff' },
        { user_id: 'demo-caju', nome: 'Caju', email: 'caju@exemplo.com', papel: 'staff' }
      ],
      convites: [{ email: 'tapioca@exemplo.com', nome: 'Tapioca', papel: 'staff', criado_em: PH.somarDias(hojeISO, -2) + 'T18:00:00' }],
      log,
      versoes: []
    };
  }

  raiz.PHDemo = { gerar, CLASSES };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* adapters.js */
/* Onde os dados moram.
   - DemoAdapter: dados de exemplo neste navegador (protótipo).
   - SupabaseAdapter: banco e login de verdade (Supabase). */
(function (raiz) {
  'use strict';
  const PH = raiz.PH;
  const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js';

  class ErroApp extends Error {
    constructor(mensagem, codigo, extra) { super(mensagem); this.codigo = codigo || 'erro'; Object.assign(this, extra || {}); }
  }

  function lsLer(k) { try { const v = raiz.localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function lsGravar(k, v) { try { raiz.localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function lsApagar(k) { try { raiz.localStorage.removeItem(k); } catch (e) { /* sem armazenamento */ } }

  function urlDoSite() { return raiz.location.origin + raiz.location.pathname; }
  function nomeDoEmail(email) {
    const n = String(email || '').split('@')[0].replace(/[._-]+/g, ' ').trim();
    return n ? n.charAt(0).toUpperCase() + n.slice(1) : 'Staff';
  }

  /* ------------------------------------------------------------------ */

  class DemoAdapter {
    constructor(opcoes) {
      this.tipo = 'demo';
      this.motivoDemo = (opcoes && opcoes.motivo) || 'prototipo';
      this.chave = 'poringhub-demo-v1';
      this.db = null;
    }
    async iniciar() {
      const salvo = lsLer(this.chave);
      this.db = salvo && salvo.formato === 1 ? salvo : raiz.PHDemo.gerar();
      this._gravar();
    }
    _gravar() { lsGravar(this.chave, this.db); }
    _nome() { return (this.db.sessao && this.db.sessao.usuario && this.db.sessao.usuario.nome) || 'Staff'; }
    _exigirStaff() { if (!this.db.sessao || this.db.sessao.modo !== 'staff') throw new ErroApp('Entre como staff para alterar.', 'sem_permissao'); }
    _exigirAdmin() { this._exigirStaff(); if (this.db.sessao.usuario.papel !== 'admin') throw new ErroApp('Só administradores podem fazer isso.', 'sem_permissao'); }

    async ler() {
      return { versao: this.db.versao, dados: PH.clone(this.db.dados), rascunho: PH.clone(this.db.rascunho), rascunhoEm: this.db.rascunhoEm, rascunhoPor: this.db.rascunhoPor };
    }
    async versaoAtual() { return this.db.versao; }
    async lerRascunho() { return { dados: PH.clone(this.db.rascunho), em: this.db.rascunhoEm, por: this.db.rascunhoPor }; }
    async sessao() { return PH.clone(this.db.sessao) || { modo: 'visitante', usuario: null }; }
    async entrar(email, senha) {
      email = String(email || '').trim().toLowerCase();
      if (!email || !senha) throw new ErroApp('Preencha e-mail e senha.', 'campos');
      let st = this.db.staff.find(s => s.email === email);
      if (!st) {
        st = { user_id: 'demo-' + PH.novoId(''), nome: nomeDoEmail(email), email, papel: 'admin' };
        this.db.staff.push(st);
      }
      this.db.sessao = { modo: 'staff', usuario: { id: st.user_id, nome: st.nome, email: st.email, papel: 'admin' } };
      this._gravar();
      return this.sessao();
    }
    async criarConta(email, senha) { await this.entrar(email, senha); return { precisaConfirmar: false }; }
    async esqueciSenha() { return true; }
    async novaSenha() { return true; }
    async sair() { this.db.sessao = { modo: 'visitante', usuario: null }; this._gravar(); }

    async salvar(dados, versaoBase, motivo) {
      this._exigirStaff();
      if (versaoBase !== this.db.versao) throw new ErroApp('Outra pessoa da staff salvou antes.', 'conflito');
      this.db.versoes.unshift({ versao: this.db.versao, dados: this.db.dados, motivo: this.db.motivo, em: this.db.em, nome: this.db.nome });
      this.db.versoes = this.db.versoes.slice(0, 15);
      this.db.versao += 1;
      this.db.dados = PH.clone(dados);
      this.db.motivo = motivo;
      this.db.em = new Date().toISOString();
      this.db.nome = this._nome();
      this.db.log.unshift({ versao: this.db.versao, em: this.db.em, nome: this.db.nome, motivo });
      this.db.log = this.db.log.slice(0, 200);
      this._gravar();
      return this.db.versao;
    }
    async salvarRascunho(r) {
      this._exigirStaff();
      this.db.rascunho = PH.clone(r);
      this.db.rascunhoEm = new Date().toISOString();
      this.db.rascunhoPor = this._nome();
      this._gravar();
      return { em: this.db.rascunhoEm, por: this.db.rascunhoPor };
    }

    async listarStaff() { this._exigirStaff(); return PH.clone(this.db.staff); }
    async listarConvites() { this._exigirAdmin(); return PH.clone(this.db.convites); }
    async convidar(email, nome, papel) {
      this._exigirAdmin();
      email = String(email || '').trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new ErroApp('Escreva um e-mail válido.', 'email');
      if (this.db.staff.some(s => s.email === email)) throw new ErroApp('Esse e-mail já está na staff.', 'repetido');
      this.db.convites = this.db.convites.filter(c => c.email !== email);
      this.db.convites.push({ email, nome: nome || nomeDoEmail(email), papel: papel || 'staff', criado_em: new Date().toISOString() });
      this._gravar();
    }
    async cancelarConvite(email) { this._exigirAdmin(); this.db.convites = this.db.convites.filter(c => c.email !== email); this._gravar(); }
    async removerStaff(id) {
      this._exigirAdmin();
      const alvo = this.db.staff.find(s => s.user_id === id);
      if (alvo && alvo.papel === 'admin' && this.db.staff.filter(s => s.papel === 'admin').length <= 1) throw new ErroApp('A staff precisa de pelo menos um administrador.', 'ultimo_admin');
      this.db.staff = this.db.staff.filter(s => s.user_id !== id);
      this._gravar();
    }
    async mudarPapel(id, papel) {
      this._exigirAdmin();
      const alvo = this.db.staff.find(s => s.user_id === id);
      if (!alvo) return;
      if (alvo.papel === 'admin' && papel !== 'admin' && this.db.staff.filter(s => s.papel === 'admin').length <= 1) throw new ErroApp('A staff precisa de pelo menos um administrador.', 'ultimo_admin');
      alvo.papel = papel;
      this._gravar();
    }
    async meuNome(nome) {
      this._exigirStaff();
      const st = this.db.staff.find(s => s.user_id === this.db.sessao.usuario.id);
      if (st) st.nome = nome;
      this.db.sessao.usuario.nome = nome;
      this._gravar();
    }
    async registroAlteracoes() { this._exigirStaff(); return PH.clone(this.db.log); }
    async versoes() { this._exigirStaff(); return this.db.versoes.map(v => ({ versao: v.versao, em: v.em, nome: v.nome, motivo: v.motivo })); }
    async restaurar(versao) {
      this._exigirAdmin();
      const v = this.db.versoes.find(x => x.versao === versao);
      if (!v) throw new ErroApp('Essa versão não está mais guardada.', 'sem_versao');
      return this.salvar(v.dados, this.db.versao, 'Restaurou a versão ' + versao);
    }
    async lerSegredo(chave) { this._exigirStaff(); return (this.db.segredos || {})[chave] || null; }
    async salvarSegredo(chave, valor) {
      this._exigirAdmin();
      valor = String(valor || '').trim();
      if (valor && !/^https:\/\/(canary\.|ptb\.)?(discord|discordapp)\.com\/api\/webhooks\/\d+\/[\w-]+$/.test(valor)) throw new ErroApp('Essa não parece uma URL de webhook do Discord. Ela começa com https://discord.com/api/webhooks/', 'webhook');
      this.db.segredos = this.db.segredos || {};
      if (valor) this.db.segredos[chave] = valor; else delete this.db.segredos[chave];
      this.db.log.unshift({ versao: null, em: new Date().toISOString(), nome: this._nome(), motivo: valor ? 'Ligou a postagem no Discord' : 'Desligou a postagem no Discord' });
      this._gravar();
    }
    resetar() { lsApagar(this.chave); this.db = raiz.PHDemo.gerar(); this._gravar(); }
  }

  /* ------------------------------------------------------------------ */

  function carregarScript(src) {
    return new Promise((ok, falha) => {
      if (raiz.supabase && raiz.supabase.createClient) return ok();
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = () => ok();
      s.onerror = () => falha(new ErroApp('Não consegui carregar a biblioteca do Supabase. Confira sua internet e recarregue a página.', 'rede'));
      document.head.appendChild(s);
    });
  }

  function traduzir(err) {
    if (!err) return new ErroApp('Algo deu errado. Tente de novo.');
    if (err instanceof ErroApp) return err;
    const msg = String(err.message || err.error_description || err.msg || err);
    const t = [
      [/invalid login credentials/i, 'E-mail ou senha incorretos.', 'login'],
      [/email not confirmed/i, 'Confirme seu e-mail pelo link que enviamos antes de entrar.', 'nao_confirmado'],
      [/user already registered|already been registered/i, 'Esse e-mail já tem conta. Use Entrar ou Esqueci a senha.', 'ja_existe'],
      [/password should be at least|weak password|password is too short/i, 'A senha precisa ter pelo menos 8 caracteres.', 'senha_fraca'],
      [/rate limit|too many requests|security purposes/i, 'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.', 'limite'],
      [/unable to validate email|invalid email|email address .* is invalid/i, 'Esse e-mail não parece válido.', 'email'],
      [/signups not allowed|signup is disabled/i, 'O cadastro de contas está desligado no Supabase. Veja o passo a passo do README.', 'cadastro_off'],
      [/sem_permissao|permission denied|row-level security|42501/i, 'Sua conta não tem permissão para isso.', 'sem_permissao'],
      [/conflito_versao/i, 'Outra pessoa da staff salvou antes.', 'conflito'],
      [/ultimo_admin/i, 'A staff precisa de pelo menos um administrador.', 'ultimo_admin'],
      [/ja_e_staff/i, 'Esse e-mail já está na staff.', 'repetido'],
      [/webhook_invalido/i, 'Essa não parece uma URL de webhook do Discord. Ela começa com https://discord.com/api/webhooks/', 'webhook'],
      [/dados_grandes/i, 'Os dados ficaram grandes demais para gravar de uma vez. Fale com quem cuida do site.', 'grande'],
      [/versao_inexistente/i, 'Essa versão não está mais guardada.', 'sem_versao'],
      [/failed to fetch|networkerror|network request failed|load failed/i, 'Sem conexão com o banco. Confira sua internet e tente de novo.', 'rede'],
      [/relation .* does not exist|could not find the function|schema cache/i, 'O banco ainda não foi preparado. Rode o arquivo supabase.sql no SQL Editor do Supabase.', 'sem_schema'],
      [/jwt expired|invalid jwt|refresh token/i, 'Sua sessão expirou. Entre de novo.', 'sessao']
    ];
    for (const [re, texto, codigo] of t) if (re.test(msg)) return new ErroApp(texto, codigo, { original: msg });
    return new ErroApp('Algo deu errado: ' + msg, 'erro', { original: msg });
  }

  class SupabaseAdapter {
    constructor(cfg) {
      this.tipo = 'supabase';
      this.cfg = cfg;
      this.sb = null;
      this.aoRecuperarSenha = null;
      this.aoMudarSessao = null;
    }
    async iniciar() {
      await carregarScript(SUPABASE_JS);
      this.sb = raiz.supabase.createClient(this.cfg.supabaseUrl, this.cfg.supabaseAnonKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });
      this.sb.auth.onAuthStateChange((evento) => {
        if (evento === 'PASSWORD_RECOVERY' && this.aoRecuperarSenha) this.aoRecuperarSenha();
        else if ((evento === 'SIGNED_IN' || evento === 'SIGNED_OUT') && this.aoMudarSessao) setTimeout(() => this.aoMudarSessao(evento), 0);
      });
    }
    async ler() {
      const [est, ras] = await Promise.all([
        this.sb.from('estado').select('versao,dados').eq('id', 1).single(),
        this.sb.from('rascunho').select('dados,atualizado_em,atualizado_nome').eq('id', 1).maybeSingle()
      ]);
      if (est.error) throw traduzir(est.error);
      const r = ras.data || {};
      return { versao: est.data.versao, dados: est.data.dados, rascunho: r.dados || null, rascunhoEm: r.atualizado_em, rascunhoPor: r.atualizado_nome };
    }
    async versaoAtual() {
      const { data, error } = await this.sb.from('estado').select('versao').eq('id', 1).single();
      if (error) throw traduzir(error);
      return data.versao;
    }
    async lerRascunho() {
      const { data, error } = await this.sb.from('rascunho').select('dados,atualizado_em,atualizado_nome').eq('id', 1).maybeSingle();
      if (error) throw traduzir(error);
      return { dados: data && data.dados, em: data && data.atualizado_em, por: data && data.atualizado_nome };
    }
    async sessao() {
      const { data } = await this.sb.auth.getSession();
      const s = data && data.session;
      if (!s) return { modo: 'visitante', usuario: null };
      let st = await this._minhaFicha(s.user.id);
      if (!st) {
        const r = await this.sb.rpc('aceitar_convite');
        if (!r.error && r.data) st = await this._minhaFicha(s.user.id);
      }
      if (!st) return { modo: 'sem_acesso', usuario: { email: s.user.email } };
      return { modo: 'staff', usuario: { id: st.user_id, nome: st.nome, email: st.email, papel: st.papel } };
    }
    async _minhaFicha(uid) {
      const { data, error } = await this.sb.from('staff').select('user_id,nome,email,papel').eq('user_id', uid).maybeSingle();
      if (error) throw traduzir(error);
      return data;
    }
    async entrar(email, senha) {
      const { error } = await this.sb.auth.signInWithPassword({ email: String(email || '').trim(), password: senha || '' });
      if (error) throw traduzir(error);
      return this.sessao();
    }
    async criarConta(email, senha) {
      const { data, error } = await this.sb.auth.signUp({ email: String(email || '').trim(), password: senha || '', options: { emailRedirectTo: urlDoSite() } });
      if (error) throw traduzir(error);
      return { precisaConfirmar: !data.session };
    }
    async esqueciSenha(email) {
      const { error } = await this.sb.auth.resetPasswordForEmail(String(email || '').trim(), { redirectTo: urlDoSite() });
      if (error) throw traduzir(error);
      return true;
    }
    async novaSenha(senha) {
      const { error } = await this.sb.auth.updateUser({ password: senha });
      if (error) throw traduzir(error);
      return true;
    }
    async sair() { await this.sb.auth.signOut(); }

    async salvar(dados, versaoBase, motivo) {
      const { data, error } = await this.sb.rpc('salvar_estado', { p_dados: dados, p_versao_base: versaoBase, p_motivo: motivo || '' });
      if (error) throw traduzir(error);
      return data;
    }
    async salvarRascunho(r) {
      const { data, error } = await this.sb.rpc('salvar_rascunho', { p_dados: r });
      if (error) throw traduzir(error);
      return { em: data && data.em, por: data && data.por };
    }
    async listarStaff() {
      const { data, error } = await this.sb.from('staff').select('user_id,nome,email,papel,criado_em').order('nome');
      if (error) throw traduzir(error);
      return data;
    }
    async listarConvites() {
      const { data, error } = await this.sb.from('convites').select('email,nome,papel,criado_em').order('criado_em');
      if (error) throw traduzir(error);
      return data;
    }
    async convidar(email, nome, papel) {
      email = String(email || '').trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new ErroApp('Escreva um e-mail válido.', 'email');
      const { error } = await this.sb.rpc('convidar_staff', { p_email: email, p_nome: nome || '', p_papel: papel || 'staff' });
      if (error) throw traduzir(error);
    }
    async cancelarConvite(email) {
      const { error } = await this.sb.from('convites').delete().eq('email', email);
      if (error) throw traduzir(error);
    }
    async removerStaff(id) { const { error } = await this.sb.rpc('remover_staff', { p_user: id }); if (error) throw traduzir(error); }
    async mudarPapel(id, papel) { const { error } = await this.sb.rpc('definir_papel', { p_user: id, p_papel: papel }); if (error) throw traduzir(error); }
    async meuNome(nome) { const { error } = await this.sb.rpc('mudar_meu_nome', { p_nome: nome }); if (error) throw traduzir(error); }
    async registroAlteracoes() {
      const { data, error } = await this.sb.from('registro_alteracoes').select('versao,em,nome,motivo').order('id', { ascending: false }).limit(150);
      if (error) throw traduzir(error);
      return data;
    }
    async versoes() {
      const { data, error } = await this.sb.from('versoes').select('versao,salvo_em,salvo_nome,motivo').order('versao', { ascending: false }).limit(40);
      if (error) throw traduzir(error);
      return data.map(v => ({ versao: v.versao, em: v.salvo_em, nome: v.salvo_nome, motivo: v.motivo }));
    }
    async restaurar(versao) {
      const { data, error } = await this.sb.rpc('restaurar_versao', { p_versao: versao });
      if (error) throw traduzir(error);
      return data;
    }
    async lerSegredo(chave) {
      const { data, error } = await this.sb.from('segredos').select('valor').eq('chave', chave).maybeSingle();
      if (error) throw traduzir(error);
      return data ? data.valor : null;
    }
    async salvarSegredo(chave, valor) {
      const { error } = await this.sb.rpc('salvar_segredo', { p_chave: chave, p_valor: String(valor || '').trim() });
      if (error) throw traduzir(error);
    }
  }

  function configValida(cfg) {
    return !!(cfg && cfg.supabaseUrl && cfg.supabaseAnonKey &&
      /^https:\/\/.+/.test(cfg.supabaseUrl) && !/SEU-PROJETO|COLE-AQUI/i.test(cfg.supabaseUrl + cfg.supabaseAnonKey));
  }

  function escolherAdapter() {
    const cfg = raiz.PH_CONFIG;
    let forcarDemo = false;
    try { forcarDemo = new URLSearchParams(raiz.location.search).has('demo'); } catch (e) { /* sem query */ }
    if (!forcarDemo && configValida(cfg)) return new SupabaseAdapter(cfg);
    const motivo = forcarDemo ? 'forcado' : (cfg ? 'sem_config' : 'prototipo');
    return new DemoAdapter({ motivo });
  }

  raiz.PHDados = { DemoAdapter, SupabaseAdapter, ErroApp, escolherAdapter, configValida, traduzir };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ui-base.js */
/* Peças de interface: escape de texto, avisos, janelas e confirmações (sem alert/confirm do navegador). */
(function (raiz) {
  'use strict';
  const I = raiz.PHIcones;

  const MAPA = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => MAPA[c]);
  const ic = (n, c) => I.icone(n, c);
  const icItem = (n, c) => I.iconeItem(n, c);
  const tom = cor => 'tom-' + (cor || 'uva');
  const plural = (n, um, varios) => n + ' ' + (n === 1 ? um : varios);
  const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  function noIframe() { try { return raiz.self !== raiz.top; } catch (e) { return true; } }

  function lsGet(k) { try { return raiz.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { raiz.localStorage.setItem(k, v); } catch (e) { /* sem armazenamento */ } }

  function pad(n) { return String(n).padStart(2, '0'); }
  function fmtHora(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fmtQuando(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const hoje = new Date();
    const ontem = new Date(); ontem.setDate(hoje.getDate() - 1);
    const mesmoDia = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    const h = pad(d.getHours()) + ':' + pad(d.getMinutes());
    if (mesmoDia(d, hoje)) return 'hoje às ' + h;
    if (mesmoDia(d, ontem)) return 'ontem às ' + h;
    return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + (d.getFullYear() !== hoje.getFullYear() ? '/' + d.getFullYear() : '') + ' às ' + h;
  }

  /* ---------- avisos ---------- */
  function toast(msg, tipo, ms) {
    let box = document.getElementById('toasts');
    if (!box) {
      box = document.createElement('div');
      box.id = 'toasts'; box.className = 'toasts';
      box.setAttribute('role', 'status'); box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    const t = document.createElement('div');
    t.className = 'toast ' + (tipo || '');
    t.innerHTML = ic(tipo === 'erro' ? 'alerta' : tipo === 'aviso' ? 'alerta' : 'check') + '<span>' + esc(msg) + '</span>';
    box.appendChild(t);
    while (box.children.length > 3) box.firstElementChild.remove();
    setTimeout(() => { t.style.transition = 'opacity .25s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 260); }, ms || (tipo === 'erro' ? 6500 : 3800));
  }

  /* ---------- janelas ---------- */
  const pilha = [];
  function janelaAberta() { return pilha.length > 0; }

  function abrirJanela(op) {
    const veu = document.createElement('div');
    veu.className = 'veu';
    const idTitulo = 'jt-' + Math.random().toString(36).slice(2, 8);
    veu.innerHTML =
      '<div class="janela' + (op.larga ? ' larga' : '') + '" role="dialog" aria-modal="true" aria-labelledby="' + idTitulo + '">' +
      '<div class="janela-cabeca"><div style="flex:1;min-width:0"><h2 id="' + idTitulo + '">' + esc(op.titulo || '') + '</h2>' +
      (op.sub ? '<p>' + op.sub + '</p>' : '') + '</div>' +
      '<button type="button" class="btn btn-icone btn-leve btn-p" data-fechar aria-label="Fechar">' + ic('x') + '</button></div>' +
      '<div class="janela-corpo" style="display:grid;gap:14px">' + (op.corpo || '') + '</div>' +
      '<div class="janela-erro" hidden></div>' +
      (op.acoes && op.acoes.length ? '<div class="janela-acoes"></div>' : '') +
      '</div>';
    const anterior = document.activeElement;
    document.body.appendChild(veu);
    const jan = veu.querySelector('.janela');
    const caixaErro = veu.querySelector('.janela-erro');
    const h = {
      el: jan,
      veu,
      fechar() {
        const i = pilha.indexOf(h);
        if (i >= 0) pilha.splice(i, 1);
        veu.remove();
        document.removeEventListener('keydown', teclado, true);
        if (op.aoFechar) op.aoFechar();
        if (anterior && anterior.focus && document.contains(anterior)) anterior.focus();
      },
      erro(msg) {
        if (!msg) { caixaErro.hidden = true; caixaErro.innerHTML = ''; return; }
        caixaErro.hidden = false;
        caixaErro.innerHTML = '<div class="msg-erro" role="alert">' + esc(msg) + '</div>';
      },
      ok(msg) {
        caixaErro.hidden = false;
        caixaErro.innerHTML = '<div class="msg-ok" role="status">' + esc(msg) + '</div>';
      },
      ocupado(sim) { jan.querySelectorAll('.janela-acoes .btn').forEach(b => { b.disabled = !!sim; }); },
      $(s) { return jan.querySelector(s); },
      $$(s) { return Array.from(jan.querySelectorAll(s)); }
    };
    if (op.acoes && op.acoes.length) {
      const barra = jan.querySelector('.janela-acoes');
      for (const a of op.acoes) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn ' + (a.classe || '');
        b.innerHTML = (a.icone ? ic(a.icone) : '') + esc(a.texto);
        if (a.id) b.id = a.id;
        b.addEventListener('click', async () => {
          if (!a.acao) { h.fechar(); return; }
          h.erro(null);
          try {
            const r = await a.acao(h);
            if (r !== false && a.fecha !== false) h.fechar();
          } catch (err) {
            h.ocupado(false);
            h.erro(err && err.message ? err.message : String(err));
          }
        });
        barra.appendChild(b);
      }
    }
    veu.addEventListener('mousedown', ev => { if (ev.target === veu && op.fecharFora !== false) h.fechar(); });
    veu.querySelector('[data-fechar]').addEventListener('click', () => h.fechar());
    function teclado(ev) {
      if (pilha[pilha.length - 1] !== h) return;
      if (ev.key === 'Escape') { ev.preventDefault(); h.fechar(); return; }
      if (ev.key === 'Tab') {
        const foco = Array.from(jan.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')).filter(x => !x.disabled && x.offsetParent !== null);
        if (!foco.length) return;
        const primeiro = foco[0], ultimo = foco[foco.length - 1];
        if (ev.shiftKey && document.activeElement === primeiro) { ev.preventDefault(); ultimo.focus(); }
        else if (!ev.shiftKey && document.activeElement === ultimo) { ev.preventDefault(); primeiro.focus(); }
      }
    }
    document.addEventListener('keydown', teclado, true);
    pilha.push(h);
    if (op.aoAbrir) op.aoAbrir(h);
    const alvo = jan.querySelector('[autofocus]') || jan.querySelector('.janela-corpo input, .janela-corpo select, .janela-corpo textarea') || jan.querySelector('.janela-acoes .btn:last-child') || jan.querySelector('[data-fechar]');
    if (alvo) setTimeout(() => alvo.focus(), 30);
    return h;
  }

  function confirmar(op) {
    return new Promise(ok => {
      let resposta = false;
      abrirJanela({
        titulo: op.titulo,
        sub: op.sub,
        corpo: op.texto ? '<div class="regras">' + op.texto + '</div>' : '',
        aoFechar: () => ok(resposta),
        acoes: [
          { texto: op.cancelar || 'Cancelar', classe: 'btn-leve' },
          { texto: op.confirmar || 'Confirmar', classe: op.perigo ? 'btn-perigo' : 'btn-primario', icone: op.icone, acao: () => { resposta = true; } }
        ]
      });
    });
  }

  /* Copiar texto: precisa ser chamado dentro do clique. Se o navegador recusar, seleciona o texto. */
  async function copiarTexto(texto, campoReserva) {
    try {
      await raiz.navigator.clipboard.writeText(texto);
      return true;
    } catch (e) {
      if (campoReserva) { campoReserva.focus(); campoReserva.select(); }
      return false;
    }
  }

  raiz.PHUI = { esc, ic, icItem, tom, plural, semAcento, noIframe, lsGet, lsSet, fmtHora, fmtQuando, toast, abrirJanela, janelaAberta, confirmar, copiarTexto };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ui-export.js */
/* Exportar: imagem PNG (para postar no Discord) e relatório em texto. */
(function (raiz) {
  'use strict';
  const PH = raiz.PH, I = raiz.PHIcones;

  const PALETA = {
    uva: { c: '#7B5CFF', s: '#EEE9FF', t: '#4F2FE0', l: '#D9CFFF' },
    rosa: { c: '#F0519A', s: '#FFE7F2', t: '#B21E68', l: '#FBC6DF' },
    coral: { c: '#FF7448', s: '#FFECE4', t: '#B13F17', l: '#FFCDBB' },
    mar: { c: '#13A6C2', s: '#DCF5FA', t: '#0A6B7E', l: '#ABE3EE' },
    folha: { c: '#23B26D', s: '#E0F7EA', t: '#137444', l: '#AEE6C8' },
    sol: { c: '#F2A900', s: '#FFF3CF', t: '#855A00', l: '#FBDC8E' }
  };
  const C = {
    fundo: '#F6F4FE', cartao: '#FFFFFF', claro: '#FAF9FF', tinta: '#27214A', tinta2: '#5C5680', mudo: '#847FA3',
    linha: '#E8E4F6', linha2: '#D6CFEC', ouroS: '#FFF3D1', ouroT: '#7A5200', ouroL: '#FBDC8E', cedeS: '#E4EDFF', cedeT: '#2149C2', faltaT: '#AE1B2E'
  };
  const FD = "'Fredoka', 'Baloo 2', 'Nunito', system-ui, sans-serif";
  const FC = "'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif";
  const W = 1080, P = 44, ESCALA = 2;

  const pal = cor => PALETA[cor] || PALETA.uva;

  async function prepararFontes() {
    if (!document.fonts || !document.fonts.load) return;
    try {
      await Promise.race([
        Promise.all([document.fonts.load('600 20px Fredoka'), document.fonts.load('700 16px Figtree'), document.fonts.load('500 16px Figtree')]),
        new Promise(ok => setTimeout(ok, 1500))
      ]);
    } catch (e) { /* segue com a fonte reserva */ }
  }

  function imagemSVG(svg) {
    return new Promise(ok => {
      const img = new Image();
      img.onload = () => ok(img);
      img.onerror = () => ok(null);
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    });
  }

  function caminhoArredondado(ctx, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }
  function caixa(ctx, x, y, w, h, r, fundo, borda, tracejado) {
    caminhoArredondado(ctx, x, y, w, h, r);
    if (fundo) { ctx.fillStyle = fundo; ctx.fill(); }
    if (borda) {
      ctx.save();
      ctx.lineWidth = 1.5; ctx.strokeStyle = borda;
      if (tracejado) ctx.setLineDash([5, 4]);
      ctx.stroke();
      ctx.restore();
    }
  }
  function cortar(ctx, texto, max) {
    texto = String(texto);
    if (ctx.measureText(texto).width <= max) return texto;
    let t = texto;
    while (t.length > 1 && ctx.measureText(t + '…').width > max) t = t.slice(0, -1);
    return t + '…';
  }

  function aplicarTema(t) {
    App.tema = TEMAS.includes(t) ? t : 'auto';
    const raizDoc = document.documentElement;
    if (App.tema === 'auto') {
      if (App.temaOriginal) raizDoc.setAttribute('data-theme', App.temaOriginal);
      else raizDoc.removeAttribute('data-theme');
    } else raizDoc.setAttribute('data-theme', App.tema);
  }
  const rotuloTema = () => ({ auto: 'automático', light: 'claro', dark: 'escuro' })[App.tema];
  const iconeTema = () => ({ auto: 'auto', light: 'sol', dark: 'lua' })[App.tema];
  function alternarTema() {
    const t = TEMAS[(TEMAS.indexOf(App.tema) + 1) % TEMAS.length];
    aplicarTema(t);
    U.lsSet('ph-tema', t);
    renderTopo();
    toast('Tema ' + rotuloTema());
  }

  /* ================================================================ */
  /* casca                                                            */
  /* ================================================================ */

  function montarCasca() {
    const raizApp = document.getElementById('app');
    raizApp.innerHTML =
      '<header class="topo" id="topo"></header>' +
      '<div id="faixas" style="display:grid;gap:10px"></div>' +
      '<div class="corpo">' +
      '<nav class="abas" id="abas" aria-label="Seções do leilão"></nav>' +
      '<main class="painel" id="painel" tabindex="-1"></main>' +
      '</div>';
    document.addEventListener('click', aoClicar);
    document.addEventListener('change', aoMudar);
    document.addEventListener('input', aoDigitar);
    raiz.addEventListener('hashchange', () => { const antes = App.aba; lerAbaDaUrl(); if (App.aba !== antes) { renderAbas(); renderPainel(); } });
  }

  function render() {
    renderTopo();
    renderFaixas();
    renderAbas();
    renderPainel();
  }

  function renderTopo() {
    const e = App.estado, s = App.sessao;
    const staff = ehStaff();
    const dias = PH.descreverDias(e.guilda.dias);
    let pill;
    if (staff) pill = '<span class="pill-modo staff"><span class="ponto"></span>' + esc(s.usuario.nome) + (ehAdmin() ? ' · admin' : '') + '</span>';
    else if (s.modo === 'sem_acesso') pill = '<span class="pill-modo"><span class="ponto"></span>Sem acesso de staff</span>';
    else pill = '<span class="pill-modo"><span class="ponto"></span>Visitante</span>';
    const botaoConta = staff || s.modo === 'sem_acesso'
      ? '<button type="button" class="btn btn-p" data-acao="sair">' + ic('sair') + 'Sair</button>'
      : '<button type="button" class="btn btn-p" data-acao="entrar" ' + (App.carregando ? 'disabled' : '') + '>' + ic('cadeado') + 'Entrar como staff</button>';
    $('#topo').innerHTML =
      '<div class="marca">' + I.emblema() +
      '<div style="min-width:0"><div class="marca-nome">' + esc(e.guilda.nome) + '</div>' +
      '<div class="marca-sub">Leilões de ' + esc(dias) + '</div></div></div>' +
      '<div class="topo-acoes">' + pill +
      '<button type="button" class="btn btn-icone btn-leve" data-acao="tema" aria-label="Tema ' + rotuloTema() + '. Trocar tema" title="Tema ' + rotuloTema() + '">' + ic(iconeTema()) + '</button>' +
      botaoConta + '</div>';
  }

  function renderFaixas() {
    const partes = [];
    if (App.adapter && App.adapter.tipo === 'demo' && !App.carregando) {
      const m = App.adapter.motivoDemo;
      const texto = m === 'sem_config'
        ? '<strong>Falta ligar o banco.</strong> O arquivo config.js ainda está sem os dados do Supabase, então o site mostra dados de exemplo.'
        : '<strong>Protótipo com dados de exemplo.</strong> Os nicks são inventados. Para testar como staff, entre com qualquer e-mail e senha; o que você mudar fica só neste navegador.';
      partes.push('<div class="faixa">' + ic('alerta') + '<span class="faixa-texto">' + texto + '</span>' +
        '<button type="button" class="btn btn-p" data-acao="recomecar-demo">' + ic('desfazer') + 'Recomeçar exemplo</button></div>');
    }
    if (App.erroFatal) {
      partes.push('<div class="faixa erro">' + ic('alerta') + '<span class="faixa-texto"><strong>Não consegui abrir os dados.</strong> ' + esc(App.erroFatal.message) + '</span>' +
        '<button type="button" class="btn btn-p" data-acao="tentar-de-novo">Tentar de novo</button></div>');
    }
    if (App.sessao.modo === 'sem_acesso') {
      partes.push('<div class="faixa">' + ic('cadeado') + '<span class="faixa-texto">Você entrou como <strong>' + esc(App.sessao.usuario.email) + '</strong>, mas esse e-mail ainda não está na staff. Peça para um administrador te convidar em Ajustes e depois entre de novo.</span></div>');
    }
    $('#faixas').innerHTML = partes.join('');
  }

  function renderAbas() {
    const e = App.estado;
    $('#abas').innerHTML = ABAS.map(a => {
      const n = a.conta && !App.carregando ? a.conta(e) : null;
      return '<button type="button" class="aba" data-acao="aba" data-aba="' + a.id + '"' + (a.id === App.aba ? ' aria-current="page"' : '') + '>' +
        ic(a.icone) + '<span class="rotulo">' + a.nome + '</span>' + (n ? '<span class="conta">' + n + '</span>' : '') + '</button>';
    }).join('');
  }

  function renderPainel() {
    const ativo = document.activeElement;
    const idAtivo = ativo && ativo.id && $('#painel').contains(ativo) ? ativo.id : null;
    let selecao = null;
    try { if (idAtivo && ativo.selectionStart != null) selecao = [ativo.selectionStart, ativo.selectionEnd]; } catch (e) { /* sem seleção */ }
    $('#painel').innerHTML = viewAtual();
    if (idAtivo) {
      const novo = document.getElementById(idAtivo);
      if (novo) {
        novo.focus({ preventScroll: true });
        if (selecao && novo.setSelectionRange) { try { novo.setSelectionRange(selecao[0], selecao[1]); } catch (e) { /* tipo sem seleção */ } }
      }
    }
  }

  function viewAtual() {
    if (App.carregando) return '<div class="carregando">' + I.emblema() + '<p>Abrindo o leilão da guilda…</p></div>';
    switch (App.aba) {
      case 'filas': return viewFilas();
      case 'membros': return viewMembros();
      case 'historico': return viewHistorico();
      case 'designados': return viewDesignados();
      case 'ausencias': return viewAusencias();
      case 'ajustes': return viewAjustes();
      default: return viewHoje();
    }
  }

  function vazio(titulo, texto) {
    return '<div class="vazio"><strong>' + titulo + '</strong>' + (texto ? '<span>' + texto + '</span>' : '') + '</div>';
  }

  /* ================================================================ */
  /* leilão de hoje                                                   */
  /* ================================================================ */

  function viewHoje() {
    const e = App.estado, r = App.rascunho, staff = ehStaff();
    App.contaNovas = 0;
    const montagem = PH.montarLeilao(e, r);
    const hojeISO = PH.hoje();
    const temConteudo = montagem.unidades > 0;
    const atrasado = temConteudo && PH.diferencaDias(r.data, hojeISO) < 0;
    const jaFechado = e.sessoes.some(s => s.d === r.data);
    const comVagas = montagem.itens.filter(mi => mi.vagas.length);
    const filtro = comVagas.some(mi => mi.item.id === App.hojeFiltro) ? App.hojeFiltro : 'todos';

    let html =
      '<div class="painel-cabeca"><div>' +
      '<p class="data-dia">Leilão de ' + diaMin(r.data) + '</p>' +
      '<h1 class="data-grande num">' + PH.fmtData(r.data) + ' <span class="tag tag-tom tom-uva">' + PH.rotuloRelativo(r.data, hojeISO) + '</span></h1>' +
      contagemHTML() +
      '</div><div class="hoje-meta">' +
      (staff ? '<label class="campo"><span>Data do leilão</span><input type="date" id="data-leilao" data-acao="data-leilao" value="' + r.data + '"></label>' : '') +
      '<span class="status-vivo" id="status-vivo">' + statusVivo(temConteudo) + '</span>' +
      '</div></div>';

    if (atrasado) {
      html += '<div class="faixa">' + ic('alerta') + '<span class="faixa-texto">Este leilão é de ' + diaMin(r.data) + ', ' + PH.fmtData(r.data) + ', e ainda não foi fechado.' +
        (staff ? ' Feche depois de conferir, ou limpe para lançar o próximo.' : ' A staff ainda vai conferir e fechar.') + '</span></div>';
    } else if (jaFechado && staff) {
      html += '<div class="faixa">' + ic('alerta') + '<span class="faixa-texto">Já existe um leilão fechado em ' + PH.fmtData(r.data) + '. Se fechar este também, os dois ficam no histórico.</span></div>';
    }

    html += cartaoMinhaVez();

    html += '<section class="secao"><h2 class="secao-titulo">Quantas páginas saíram</h2>' +
      '<div class="tiles">' + montagem.itens.map(mi => tileItem(mi, staff)).join('') + '</div>' +
      '<p class="dica">Conte as páginas na tela do leilão do jogo. Cada página tem ' + e.guilda.vagas + ' vagas: no ' + esc(nomeUnidade(e)) +
      ' cada membro leva 1 unidade, e nos baús a página inteira fica com um membro só. Se sair mais do que a fila tem, ela volta ao nº 1 e continua. A última página pode vir incompleta: ajuste no rodapé dela.</p></section>';

    html += '<section class="secao"><div class="linha-acoes"><h2 class="secao-titulo">Quem leva</h2><span class="espaco"></span>';
    if (comVagas.length > 1) {
      html += '<div class="chips" role="group" aria-label="Mostrar item">' +
        '<button type="button" class="chip sem-icone" data-acao="filtro-hoje" data-item="todos" aria-pressed="' + (filtro === 'todos') + '">Todos</button>' +
        comVagas.map(mi => '<button type="button" class="chip ' + tom(mi.item.cor) + '" data-acao="filtro-hoje" data-item="' + mi.item.id + '" aria-pressed="' + (filtro === mi.item.id) + '">' + icItem(mi.item.icone) + esc(mi.item.curto) + '</button>').join('') +
        '</div>';
    }
    html += '</div>';
    if (!temConteudo) html += previaHoje(montagem);
    else html += '<div class="resultado">' + comVagas.filter(mi => filtro === 'todos' || mi.item.id === filtro).map(mi => blocoItem(mi, staff)).join('') + '</div>';
    html += '</section>';

    html += '<div class="rodape-hoje"><p class="resumo">' +
      (temConteudo
        ? '<strong>' + plural(montagem.paginas, 'página', 'páginas') + '</strong>, ' + plural(montagem.unidades, 'unidade', 'unidades') + ' para ' + plural(montagem.membros, 'membro', 'membros')
        : 'Nenhuma página lançada ainda') +
      '</p><div class="linha-acoes">' +
      '<button type="button" class="btn btn-p" data-acao="relatorio" ' + (temConteudo ? '' : 'disabled') + '>' + ic('relatorio') + 'Relatório</button>' +
      '<button type="button" class="btn btn-p" data-acao="imagem-leilao" ' + (temConteudo ? '' : 'disabled') + '>' + ic('imagem') + 'Imagem</button>' +
      (staff
        ? '<button type="button" class="btn btn-p btn-leve" data-acao="limpar-rascunho" ' + (temConteudo ? '' : 'disabled') + '>Limpar</button>' +
          '<button type="button" class="btn btn-primario" data-acao="fechar-leilao" ' + (temConteudo ? '' : 'disabled') + '>' + ic('check') + 'Fechar leilão</button>'
        : '') +
      '</div></div>';
    return html;
  }

  function nomeUnidade(e) {
    const it = e.itens.find(i => i.modo !== 'pagina' && i.ativo !== false);
    return it ? it.curto : 'Álbum';
  }

  function statusVivo(temConteudo) {
    if (App.salvandoRascunho) return ic('ao_vivo') + 'Publicando para a guilda…';
    if (temConteudo && App.rascunhoEm) {
      return '<span class="tag tag-vivo">' + ic('ao_vivo') + 'Ao vivo</span>' +
        (App.rascunhoPor ? esc(App.rascunhoPor) + ' atualizou ' : 'Atualizado ') + U.fmtQuando(App.rascunhoEm);
    }
    if (temConteudo) return 'Rascunho ainda não publicado';
    return ehStaff() ? 'Lance as páginas e a guilda acompanha ao vivo' : 'A staff ainda não lançou este leilão';
  }
  function atualizarStatusVivo() {
    const el = $('#status-vivo');
    if (el) el.innerHTML = statusVivo(rascunhoTemConteudo(App.rascunho));
  }

  /* ---------- contagem regressiva ---------- */

  function infoContagem() {
    const e = App.estado, r = App.rascunho;
    if (!r || !r.data || PH.diferencaDias(r.data, PH.hoje()) < 0) return null;
    const hora = e.guilda.horario || '21:00';
    const falta = PH.inicioDoLeilao(e, r.data) - Date.now();
    if (falta <= 0) return { classe: 'agora', html: '<span class="ponto-vivo"></span>Acontecendo agora, começou às ' + hora };
    const min = Math.floor(falta / 60000);
    let txt;
    if (min >= 1440) { const d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60); txt = d + (d === 1 ? ' dia' : ' dias') + (h ? ' e ' + h + 'h' : ''); }
    else if (min >= 60) { const h = Math.floor(min / 60), m = min % 60; txt = h + 'h' + (m ? ' ' + String(m).padStart(2, '0') + 'min' : ''); }
    else { const seg = Math.floor(falta / 1000); txt = Math.floor(seg / 60) + ':' + String(seg % 60).padStart(2, '0'); }
    return { classe: min < 10 ? 'perto' : '', html: ic('historico') + 'Começa às ' + hora + '. Faltam ' + txt };
  }
  function contagemHTML() {
    const info = infoContagem();
    return '<div class="linha-acoes" style="margin-top:12px"><span class="contagem' + (info && info.classe ? ' ' + info.classe : '') + '" id="contagem" role="timer"' + (info ? '' : ' hidden') + '>' + (info ? info.html : '') + '</span></div>';
  }
  function atualizarContagem() {
    if (App.aba !== 'hoje' || App.carregando) return;
    const el = $('#contagem');
    if (!el) return;
    const info = infoContagem();
    if (!info) { el.hidden = true; return; }
    el.hidden = false;
    const cls = 'contagem' + (info.classe ? ' ' + info.classe : '');
    if (el.className !== cls) el.className = cls;
    if (el.dataset.html !== info.html) { el.innerHTML = info.html; el.dataset.html = info.html; }
  }

  /* ---------- minha vez ---------- */

  function meuId() {
    const m = App.eu && App.estado.membros[App.eu];
    return m && m.ativo !== false ? App.eu : null;
  }

  function descreverVaga(it, vaga) {
    const pagina = vaga.bonus && it.bonus ? it.bonus.curto + ' ' + vaga.pagina : 'Página ' + vaga.pagina;
    return it.modo === 'pagina' ? pagina + ', ' + plural(vaga.q, 'unidade', 'unidades') : pagina + ', vaga ' + vaga.pos;
  }

  function dataCurta(d) {
    const outroAno = d.slice(0, 4) !== PH.hoje().slice(0, 4);
    return PH.NOMES_DIA_CURTO[PH.diaDaSemana(d)] + ', ' + (outroAno ? PH.fmtData(d) : PH.fmtDataCurta(d));
  }

  function itemMinhaVez(x) {
    const it = x.item;
    let titulo, sub = '', destaque = false;
    if (x.fora) { titulo = 'Fora desta fila'; sub = 'Você não pega este item.'; }
    else if (x.hoje.length) {
      const h = x.hoje.find(y => y.tipo === 'leva' || y.tipo === 'recebe') || x.hoje[0];
      if (h.tipo === 'leva') { destaque = true; titulo = 'Você leva hoje'; sub = descreverVaga(it, h.vaga) + (h.origem === 'prioridade' ? ', pela vez devolvida' : ''); }
      else if (h.tipo === 'recebe') { destaque = true; titulo = 'Você recebe hoje'; sub = descreverVaga(it, h.vaga) + ', cedida por ' + nick(h.de); }
      else if (h.tipo === 'cedeu') { titulo = 'Você cedeu hoje'; sub = 'Para ' + nick(h.para) + '. Sua vez volta no próximo leilão.'; }
      else if (h.tipo === 'faltou') { titulo = 'Marcado como falta hoje'; sub = 'Sua vez volta no próximo leilão.'; }
      else { titulo = 'Você passou a vez hoje'; sub = 'Sem vez devolvida.'; }
    } else if (x.pos && x.pos.prioridade) {
      titulo = 'Vez devolvida';
      sub = (x.depoisDeHoje ? 'Hoje não chegou em você. ' : '') + (x.pos.prioridade === 1 ? 'Você entra na primeira vaga do próximo leilão.' : 'Você entra nas primeiras vagas do próximo leilão (' + x.pos.prioridade + 'º).');
    } else if (x.pos) {
      titulo = 'nº ' + x.pos.numero + ', ' + (x.pos.antes ? x.pos.antes + ' na sua frente' : 'você é o próximo');
      const antes = x.depoisDeHoje ? 'Hoje não chega em você. ' : '';
      if (!x.leiloes || !x.data) sub = antes + 'Ainda sem histórico para prever a data.';
      else if (x.leiloes === 1) sub = antes + 'Deve ser no próximo leilão, ' + dataCurta(x.data) + '.';
      else sub = antes + 'Deve chegar em uns ' + x.leiloes + ' leilões, por volta de ' + dataCurta(x.data) + '.';
    } else { titulo = 'Fora desta fila'; }
    return '<div class="mv-item ' + tom(it.cor) + (destaque ? ' destaque' : '') + '">' + icItem(it.icone) +
      '<strong>' + esc(it.curto) + ': ' + esc(titulo) + '</strong><span>' + esc(sub) + '</span></div>';
  }

  function cartaoMinhaVez() {
    const e = App.estado;
    const ativos = Object.values(e.membros).filter(m => m.ativo !== false).sort((a, b) => PH.compararNick(a.nick, b.nick));
    if (!ativos.length) return '';
    const eu = meuId();
    if (!eu) {
      return '<section class="minha-vez"><div class="mv-cabeca"><span class="mv-selo">' + ic('estrela') + '</span>' +
        '<div style="min-width:0"><h2>Minha vez</h2><p>Escolha seu nick para ver quando chega a sua vez em cada item.</p></div></div>' +
        '<div class="linha-acoes"><label class="sr" for="mv-nick">Seu nick</label>' +
        '<select class="entrada" id="mv-nick" style="width:auto;flex:1 1 200px;max-width:320px"><option value="">Escolha seu nick</option>' +
        ativos.map(m => '<option value="' + m.id + '">' + esc(m.nick) + '</option>').join('') + '</select>' +
        '<button type="button" class="btn btn-p btn-primario" data-acao="mv-escolher">' + ic('estrela') + 'Ver minha vez</button>' +
        '<span class="dica">Fica salvo só neste aparelho.</span></div></section>';
    }
    const mv = PH.minhaVez(e, App.rascunho, eu);
    return '<section class="minha-vez"><div class="mv-cabeca"><span class="mv-selo">' + esc(mv.membro.nick.charAt(0).toUpperCase()) + '</span>' +
      '<div style="min-width:0"><h2>Minha vez, ' + esc(mv.membro.nick) + '</h2><p>' + (mv.aoVivo ? 'Já contando o que a staff lançou neste leilão.' : 'Para o próximo leilão.') + '</p></div>' +
      '<span class="espaco"></span><button type="button" class="btn btn-p btn-leve" data-acao="mv-trocar">Trocar nick</button></div>' +
      '<div class="mv-itens">' + mv.itens.map(itemMinhaVez).join('') + '</div></section>';
  }

  function escolherMeuNick() {
    const sel = $('#mv-nick');
    if (!sel || !sel.value) { toast('Escolha seu nick na lista.', 'aviso'); if (sel) sel.focus(); return; }
    App.eu = sel.value;
    U.lsSet('ph-eu', sel.value);
    renderPainel();
  }
  function trocarMeuNick() {
    App.eu = null;
    U.lsSet('ph-eu', '');
    renderPainel();
    const sel = $('#mv-nick');
    if (sel) sel.focus();
  }

  /* ---------- comemoração ao fechar ---------- */

  function comemorar() {
    try { if (raiz.matchMedia && raiz.matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) { /* segue */ }
    const W = raiz.innerWidth, H = raiz.innerHeight;
    const dpr = Math.min(raiz.devicePixelRatio || 1, 2);
    const cv = document.createElement('canvas');
    cv.className = 'confete';
    cv.setAttribute('aria-hidden', 'true');
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    document.body.appendChild(cv);
    const ctx = cv.getContext('2d');
    if (!ctx) { cv.remove(); return; }
    ctx.scale(dpr, dpr);
    const cores = ['#7B5CFF', '#F0519A', '#FF7448', '#13A6C2', '#FFC23C', '#23B26D'];
    const pecas = Array.from({ length: 130 }, (_, i) => {
      const lado = i % 2 ? 1 : -1;
      return {
        x: W / 2 + lado * Math.random() * W * 0.12, y: H * 0.42,
        vx: lado * (2 + Math.random() * 7) * (Math.random() < 0.5 ? 1 : 0.6), vy: -(6 + Math.random() * 9),
        g: 0.3 + Math.random() * 0.12, w: 6 + Math.random() * 6, h: 4 + Math.random() * 6,
        r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3, c: cores[i % cores.length], redondo: i % 3 === 0
      };
    });
    const inicio = performance.now(), dur = 1600;
    function quadro(t) {
      const p = (t - inicio) / dur;
      ctx.clearRect(0, 0, W, H);
      for (const q of pecas) {
        q.vy += q.g; q.vx *= 0.99; q.x += q.vx; q.y += q.vy; q.r += q.vr;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - Math.max(0, p - 0.6) / 0.4);
        ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.fillStyle = q.c;
        if (q.redondo) { ctx.beginPath(); ctx.arc(0, 0, q.w / 2.4, 0, 6.283); ctx.fill(); }
        else ctx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h);
        ctx.restore();
      }
      if (p < 1) requestAnimationFrame(quadro); else cv.remove();
    }
    requestAnimationFrame(quadro);
  }

  function tileItem(mi, staff) {
    const it = mi.item, r = App.rascunho.itens[it.id], f = mi.fila;
    const regra = it.modo === 'pagina' ? 'página inteira por membro' : '1 por membro';
    let html = '<article class="tile ' + tom(it.cor) + '">' +
      '<header class="tile-cabeca"><span class="selo-item">' + icItem(it.icone) + '</span><div style="min-width:0">' +
      '<h3>' + esc(it.nome) + '</h3><p>' + plural(f.length, 'membro', 'membros') + ' na fila, ' + regra + '</p></div></header>' +
      '<div class="contadores">' + contador(it.id, 'paginas', 'Páginas', r.paginas, staff, null, null);
    if (it.bonus) html += contador(it.id, 'paginasBonus', esc(it.bonus.nome), r.paginasBonus, staff, 'bônus, sai depois do ' + esc(it.curto), it.bonus.cor || 'rosa');
    html += '</div>';
    if (f.length) {
      const ini = f[mi.inicioIdx];
      html += '<div class="inicio">Começa no ' +
        (staff
          ? '<label class="sr" for="ini-' + it.id + '">Número de início da fila do ' + esc(it.nome) + '</label><input id="ini-' + it.id + '"' + (App.andou ? ' class="andou"' : '') + ' type="number" inputmode="numeric" min="1" max="' + f.length + '" value="' + (mi.inicioIdx + 1) + '" data-acao="inicio" data-item="' + it.id + '">'
          : '<strong' + (App.andou ? ' class="andou"' : '') + '>nº ' + (mi.inicioIdx + 1) + '</strong>') +
        '<span><strong' + (App.andou ? ' class="andou"' : '') + '>' + esc(ini.nick) + '</strong></span>' +
        (mi.inicioMudou && staff ? '<button type="button" class="btn btn-p btn-leve" data-acao="inicio-padrao" data-item="' + it.id + '">voltar ao nº ' + (mi.ponteiroIdx + 1) + '</button>' : '') +
        '</div>';
    } else {
      html += '<p class="dica">Ninguém nesta fila ainda. Cadastre membros na aba Membros.</p>';
    }
    if (mi.prioridade.length) {
      html += '<div class="devolvidas"><p>Vez devolvida, entram nas primeiras vagas</p><ul>' +
        mi.prioridade.map(p => '<li class="tag tag-prio" title="' + esc(TXT_MOTIVO[p.motivo] || '') + ' em ' + PH.fmtData(p.d) + '">' + esc(nick(p.m)) + ' <small>· ' + esc(TXT_MOTIVO[p.motivo] || 'ajuste') + ' ' + PH.fmtDataCurta(p.d) + '</small></li>').join('') +
        '</ul></div>';
    }
    return html + '</article>';
  }

  function contador(itemId, campo, rotulo, valor, staff, sub, cor) {
    const v = parseInt(valor, 10) || 0;
    const base = 'passo-' + itemId + '-' + campo;
    return '<div class="contador' + (cor ? ' ' + tom(cor) : '') + '"><span class="rot">' + rotulo + (sub ? '<small>' + sub + '</small>' : '') + '</span>' +
      (staff ? '<button type="button" class="passo" id="' + base + '-menos" data-acao="passo" data-item="' + itemId + '" data-campo="' + campo + '" data-delta="-1" aria-label="Uma página a menos" ' + (v <= 0 ? 'disabled' : '') + '>' + ic('menos') + '</button>' : '') +
      '<output aria-live="polite"' + (App.pulou === itemId + '-' + campo ? ' class="pulou"' : '') + '>' + v + '</output>' +
      (staff ? '<button type="button" class="passo" id="' + base + '-mais" data-acao="passo" data-item="' + itemId + '" data-campo="' + campo + '" data-delta="1" aria-label="Uma página a mais">' + ic('mais') + '</button>' : '') +
      '</div>';
  }

  function previaHoje(montagem) {
    const linhas = montagem.itens.map(mi => {
      const f = mi.fila;
      if (!f.length) return '';
      const nomes = [];
      for (const p of mi.prioridade.slice(0, 6)) nomes.push('<span class="tag tag-prio">★ ' + esc(nick(p.m)) + '</span>');
      for (let i = 0; nomes.length < 8 && i < f.length; i++) {
        const idx = (mi.inicioIdx + i) % f.length;
        nomes.push('<span class="tag tag-tom">nº ' + (idx + 1) + ' ' + esc(f[idx].nick) + '</span>');
      }
      return '<div class="previa-linha ' + tom(mi.item.cor) + '">' + icItem(mi.item.icone) + '<strong>' + esc(mi.item.curto) + '</strong><span class="nomes">' + nomes.join('') + '</span></div>';
    }).join('');
    return vazio('Quando a staff lançar as páginas, a lista de quem leva aparece aqui, na ordem da fila.', linhas ? 'Quem vem primeiro em cada item:' : '') +
      (linhas ? '<div class="previa">' + linhas + '</div>' : '');
  }

  function blocoItem(mi, staff) {
    const it = mi.item;
    const grupos = X.agruparPaginas(mi);
    let html = '<section class="bloco ' + tom(it.cor) + '" data-item="' + it.id + '">' +
      '<header class="bloco-cabeca"><span class="selo-item" style="width:40px;height:40px;border-radius:13px">' + icItem(it.icone) + '</span>' +
      '<h3>' + esc(it.nome) + '</h3><span class="meta">' + plural(mi.paginas, 'página', 'páginas') + ', ' + plural(mi.unidades, 'unidade', 'unidades') + '</span></header>' +
      '<div class="bloco-corpo">';
    for (const g of grupos) html += paginaHTML(mi, g, staff);
    if (mi.fila.length) {
      if (mi.run > 0) {
        const prox = mi.fila[mi.proximoIdx];
        html += '<p class="bloco-pe">' + ic('direita') + '<span>Depois deste leilão, a fila começa no <strong>nº ' + (mi.proximoIdx + 1) + ', ' + esc(prox.nick) + '</strong></span></p>';
      } else {
        html += '<p class="bloco-pe">' + ic('direita') + '<span>Só entrou quem tinha vez devolvida, então a fila não anda.</span></p>';
      }
    }
    return html + '</div></section>';
  }

  function paginaHTML(mi, g, staff) {
    const it = mi.item;
    const bonus = g.bonus && it.bonus;
    const rotUnid = it.modo === 'pagina' ? plural(g.unidades, 'unidade', 'unidades') : plural(g.unidades, 'vaga', 'vagas');
    let html = '<div class="pagina' + (bonus ? ' ' + tom(it.bonus.cor || 'rosa') : '') + '">' +
      '<div class="pagina-rotulo"><strong>' + (bonus ? esc(it.bonus.curto) + ' ' + g.pagina : 'Página ' + g.pagina) + '</strong><span>' + rotUnid + '</span>' +
      (bonus ? '<span class="tag tag-bonus">bônus</span>' : '') + '</div>' +
      '<div class="vagas' + (it.modo === 'pagina' ? ' inteira' : '') + '">' + g.linhas.map(l => vagaHTML(mi, l, staff)).join('') + '</div>';
    if (g.ultimaPag && staff) {
      const campo = bonus ? 'ultimaBonus' : 'ultima';
      const id = 'ultima-' + it.id + '-' + campo;
      html += '<div class="pagina-ajuste">Esta página veio com' +
        '<button type="button" class="passo" id="' + id + '-menos" data-acao="ultima" data-item="' + it.id + '" data-campo="' + campo + '" data-delta="-1" aria-label="Uma unidade a menos na última página" ' + (g.unidades <= 1 ? 'disabled' : '') + '>' + ic('menos') + '</button>' +
        '<output' + (App.pulou === it.id + '-' + campo ? ' class="pulou"' : '') + '>' + g.unidades + '</output>' +
        '<button type="button" class="passo" id="' + id + '-mais" data-acao="ultima" data-item="' + it.id + '" data-campo="' + campo + '" data-delta="1" aria-label="Uma unidade a mais na última página" ' + (g.unidades >= App.estado.guilda.vagas ? 'disabled' : '') + '>' + ic('mais') + '</button>' +
        (it.modo === 'pagina' ? 'unidades' : 'vagas') + '</div>';
    }
    return html + '</div>';
  }

  function vagaHTML(mi, l, staff) {
    const e = App.estado;
    const chave = mi.item.id + '|' + l.vaga.k;
    const nova = !App.primeiraMontagem && !App.vagasVistas.has(chave);
    const eu = meuId();
    const minha = !!(eu && l.dono && ((l.dono.m === eu && !l.recebedor) || l.recebedor === eu));
    const atraso = nova ? Math.min(App.contaNovas++ * 35, 420) : 0;
    const estiloAtraso = atraso ? ' style="--atraso:' + atraso + 'ms"' : '';
    let cls = 'vaga', nome, sub = '', num;
    if (!l.dono) {
      cls += ' sem-dono'; nome = 'Sem ninguém'; sub = 'todos da fila passaram';
      num = '<span class="vaga-num">—</span>';
    } else {
      const m = e.membros[l.dono.m];
      const daVez = l.dono.origem === 'prioridade' ? 'vez devolvida' : 'nº ' + l.dono.numero;
      const textoCedida = l.dono.origem === 'prioridade' ? 'vez devolvida de ' + (m ? m.nick : '?') : 'vez de ' + (m ? m.nick : '?') + ', ' + daVez;
      if (l.recebedor) num = '<span class="vaga-num cede">cedida</span>';
      else if (l.dono.origem === 'prioridade') num = '<span class="vaga-num prio" title="Vez devolvida">★' + (l.dono.numero ? ' ' + l.dono.numero : '') + '</span>';
      else num = '<span class="vaga-num">nº ' + l.dono.numero + '</span>';
      if (l.recebedor) { cls += ' cedida'; nome = nick(l.recebedor); sub = textoCedida; }
      else {
        nome = m ? m.nick : '?';
        if (l.dono.origem === 'prioridade') { cls += ' prioridade'; sub = 'vez devolvida, ' + (TXT_MOTIVO[l.dono.motivo] || 'ajuste'); }
        else sub = (m && m.classe) || '';
      }
    }
    if (minha) cls += ' minha';
    if (App.mudaram.has(chave)) cls += ' mudou';
    const q = mi.item.modo === 'pagina' ? '<span class="vaga-q">×' + l.vaga.q + '</span>' : '';
    const passou = l.passaram.length ? '<span class="vaga-passou">' + l.passaram.map(p => '<s>' + esc(nick(p.m)) + '</s> ' + TXT_ACAO[p.acao]).join(', ') + '</span>' : '';
    const conteudo = '<span class="vaga-topo">' + num + (minha ? '<span class="vaga-voce">você</span>' : '') + q + '</span><span class="vaga-nick">' + esc(nome) + '</span>' + (sub ? '<span class="vaga-sub">' + esc(sub) + '</span>' : '') + passou;
    if (staff && l.dono) {
      return '<button type="button" class="' + cls + (nova ? ' nova' : '') + '"' + estiloAtraso + ' id="vaga-' + idSeguro(chave) + '" data-acao="vaga" data-item="' + mi.item.id + '" data-k="' + esc(l.vaga.k) + '" aria-label="Página ' + l.vaga.pagina + ', ' + esc(nome) + '. Marcar o que aconteceu">' + conteudo + '</button>';
    }
    return '<div class="' + cls + (nova ? ' nova' : '') + '"' + estiloAtraso + '>' + conteudo + '</div>';
  }

  /* Para animar: guarda quem está em cada vaga antes de uma mudança e marca as que mudaram. */
  function assinaturas() {
    const mapa = new Map();
    const m = PH.montarLeilao(App.estado, App.rascunho);
    for (const mi of m.itens) for (const l of mi.linhas) {
      mapa.set(mi.item.id + '|' + l.vaga.k, (l.dono ? l.dono.m : '-') + '>' + (l.recebedor || '') + '/' + l.passaram.map(p => p.m + ':' + p.acao).join(','));
    }
    return mapa;
  }
  function lembrarVagas() {
    const antes = assinaturas();
    App.vagasVistas = new Set(antes.keys());
    App.primeiraMontagem = false;
    return antes;
  }
  function marcarMudancas(antes) {
    App.mudaram = new Set();
    for (const [k, v] of assinaturas()) if (antes.has(k) && antes.get(k) !== v) App.mudaram.add(k);
  }
  function renderComMudancas() {
    renderPainel();
    App.mudaram = new Set();
    App.pulou = null;
    App.andou = false;
  }

  /* ---------- ações do leilão ---------- */

  let timerRascunho = null;
  function mudarRascunho(fn) {
    if (!ehStaff()) return;
    const antes = lembrarVagas();
    fn(App.rascunho);
    marcarMudancas(antes);
    App.editouRascunhoEm = Date.now();
    renderComMudancas();
    clearTimeout(timerRascunho);
    timerRascunho = setTimeout(salvarRascunhoAgora, 700);
  }

  async function salvarRascunhoAgora() {
    clearTimeout(timerRascunho);
    if (!ehStaff()) return;
    App.salvandoRascunho = true;
    atualizarStatusVivo();
    try {
      const r = await App.adapter.salvarRascunho(App.rascunho);
      App.rascunhoEm = (r && r.em) || new Date().toISOString();
      App.rascunhoPor = (r && r.por) || nomeAutor();
    } catch (err) {
      toast('Não consegui publicar o rascunho: ' + err.message, 'erro');
    } finally {
      App.salvandoRascunho = false;
      atualizarStatusVivo();
    }
  }

  function passo(itemId, campo, delta) {
    App.pulou = itemId + '-' + campo;
    mudarRascunho(r => {
      const x = r.itens[itemId];
      x[campo] = Math.max(0, Math.min(99, (parseInt(x[campo], 10) || 0) + delta));
    });
  }
  function ajustarUltima(itemId, campo, delta) {
    const V = App.estado.guilda.vagas;
    App.pulou = itemId + '-' + campo;
    mudarRascunho(r => {
      const x = r.itens[itemId];
      x[campo] = Math.max(1, Math.min(V, (parseInt(x[campo], 10) || V) + delta));
    });
  }
  function mudarInicio(itemId, valor) {
    const f = PH.fila(App.estado, itemId);
    if (!f.length) return;
    const n = parseInt(valor, 10);
    const ptr = PH.indiceDe(f, App.estado.filas[itemId] && App.estado.filas[itemId].ponteiro);
    mudarRascunho(r => {
      if (!Number.isFinite(n) || n < 1 || n > f.length || n === ptr + 1) r.itens[itemId].inicio = null;
      else r.itens[itemId].inicio = n;
    });
  }

  function janelaVaga(itemId, k) {
    const e = App.estado, it = PH.item(e, itemId);
    const rItem = App.rascunho.itens[itemId];
    const mi = PH.montarItem(e, it, rItem);
    const l = mi.linhas.find(x => x.vaga.k === k);
    if (!l || !l.dono) return;
    const dono = l.dono.m;
    const acaoAtual = rItem.passes[dono] || (rItem.cedidos[dono] ? 'cedeu' : 'levou');
    const membros = PH.fila(e, itemId).concat(Object.values(e.membros).filter(m => m.ativo !== false && (m.fora || []).includes(itemId)))
      .filter(m => m.id !== dono).sort((a, b) => PH.compararNick(a.nick, b.nick));
    const opcao = (acao, cls, icone, titulo, texto) => '<button type="button" class="opcao ' + cls + '" data-opcao="' + acao + '" aria-pressed="' + (acaoAtual === acao) + '">' + ic(icone) + '<strong>' + titulo + '</strong><span>' + texto + '</span></button>';
    const nomeDono = esc(nick(dono));
    let corpo = '<div class="opcoes">' +
      opcao('levou', 'ok', 'check', 'Levou', nomeDono + ' fica com ' + (it.modo === 'pagina' ? 'a página' : 'a vaga') + '.') +
      opcao('faltou', 'falta', 'ausencia', 'Faltou', 'A vaga vai para o próximo da fila e ' + nomeDono + ' ganha a vez devolvida no próximo leilão.') +
      opcao('naoquis', 'neutro', 'x', 'Não quis', 'A vaga vai para o próximo da fila, sem vez devolvida.') +
      opcao('cedeu', 'cede', 'ceder', 'Cedeu para outro membro', 'Quem recebe não perde a própria vez, e ' + nomeDono + ' ganha a vez devolvida.') +
      '</div>' +
      '<label class="campo" id="campo-cede" ' + (acaoAtual === 'cedeu' ? '' : 'hidden') + '><span>Quem recebe</span><select id="cede-para">' +
      '<option value="">Escolha o membro</option>' +
      membros.map(m => '<option value="' + m.id + '"' + (rItem.cedidos[dono] === m.id ? ' selected' : '') + '>' + esc(m.nick) + (m.classe ? ' · ' + esc(m.classe) : '') + '</option>').join('') +
      '</select></label>';
    if (l.passaram.length) {
      corpo += '<div class="grupo"><p class="dica">Passaram nesta vaga antes:</p><div class="pessoas">' +
        l.passaram.map(p => '<div class="pessoa"><span class="quem"><strong>' + esc(nick(p.m)) + '</strong><span>' + TXT_ACAO[p.acao] + (p.origem === 'prioridade' ? ', tinha vez devolvida' : ', nº ' + p.numero) + '</span></span>' +
          '<button type="button" class="btn btn-p" data-volta="' + p.m + '">' + ic('desfazer') + 'Levou, na verdade</button></div>').join('') +
        '</div></div>';
    }
    let escolha = acaoAtual;
    const h = abrirJanela({
      titulo: nick(dono),
      sub: 'Página ' + l.vaga.pagina + (it.modo === 'pagina' ? '' : ', vaga ' + l.vaga.pos) + ' do ' + esc(it.nome) + (l.dono.origem === 'prioridade' ? ', vez devolvida' : ', nº ' + l.dono.numero + ' na fila'),
      corpo,
      acoes: [
        { texto: 'Cancelar', classe: 'btn-leve' },
        {
          texto: 'Aplicar', classe: 'btn-primario', icone: 'check',
          acao: (j) => {
            const para = j.$('#cede-para').value;
            if (escolha === 'cedeu' && !para) throw new Error('Escolha quem recebe a vaga.');
            mudarRascunho(r => {
              const x = r.itens[itemId];
              delete x.passes[dono];
              delete x.cedidos[dono];
              if (escolha === 'faltou' || escolha === 'naoquis') x.passes[dono] = escolha;
              if (escolha === 'cedeu') x.cedidos[dono] = para;
            });
          }
        }
      ],
      aoAbrir: (j) => {
        j.$$('[data-opcao]').forEach(b => b.addEventListener('click', () => {
          escolha = b.dataset.opcao;
          j.$$('[data-opcao]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
          j.$('#campo-cede').hidden = escolha !== 'cedeu';
          if (escolha === 'cedeu') j.$('#cede-para').focus();
        }));
        j.$$('[data-volta]').forEach(b => b.addEventListener('click', () => {
          const m = b.dataset.volta;
          mudarRascunho(r => { delete r.itens[itemId].passes[m]; });
          j.fechar();
        }));
      }
    });
    return h;
  }

  async function limparRascunho() {
    const ok = await confirmar({ titulo: 'Limpar o que foi lançado?', texto: '<p>As páginas, quem faltou e quem cedeu deste leilão voltam a zero. Nada do histórico muda.</p>', confirmar: 'Limpar', perigo: true });
    if (!ok) return;
    const data = App.rascunho.data;
    mudarRascunho(r => { const novo = PH.rascunhoVazio(App.estado, data); r.itens = novo.itens; });
  }

  async function fecharLeilao() {
    const e = App.estado, r = App.rascunho;
    const m = PH.montarLeilao(e, r);
    const dia = diaMin(r.data), data = PH.fmtData(r.data);
    const resumo = m.itens.filter(mi => mi.vagas.length).map(mi => {
      const passaram = mi.linhas.reduce((s, l) => s + l.passaram.length, 0);
      const cedidas = mi.linhas.filter(l => l.recebedor).length;
      const prox = mi.run > 0 && mi.fila.length ? 'a fila passa a começar no nº ' + (mi.proximoIdx + 1) + ', ' + esc(mi.fila[mi.proximoIdx].nick) : 'a fila não anda';
      return '<p><strong>' + esc(mi.item.nome) + ':</strong> ' + plural(mi.unidades, 'unidade', 'unidades') +
        (passaram ? ', ' + plural(passaram, 'passou', 'passaram') : '') + (cedidas ? ', ' + plural(cedidas, 'cedida', 'cedidas') : '') + '; ' + prox + '.</p>';
    }).join('');
    let urlDiscord = null;
    try { urlDiscord = await carregarDiscord(); } catch (err) { urlDiscord = null; }
    const escolha = await new Promise(ok => {
      let resultado = { ok: false, postar: false };
      abrirJanela({
        titulo: 'Fechar o leilão de ' + dia + ', ' + data + '?',
        corpo: '<div class="regras">' + resumo + '<p>O que foi lançado entra no histórico e as filas andam. Se algo sair errado, dá para desfazer o último leilão no Histórico.</p></div>' +
          (urlDiscord ? '<label class="check"><input type="checkbox" id="fc-discord" checked> Postar o resultado no Discord</label>' : ''),
        aoFechar: () => ok(resultado),
        acoes: [
          { texto: 'Cancelar', classe: 'btn-leve' },
          { texto: 'Fechar e gravar', classe: 'btn-primario', icone: 'check', acao: (j) => { const c = j.$('#fc-discord'); resultado = { ok: true, postar: !!(urlDiscord && c && c.checked) }; } }
        ]
      });
    });
    if (!escolha.ok) return;
    let res;
    try { res = PH.fecharLeilao(e, r, nomeAutor()); } catch (err) { toast(err.message, 'erro'); return; }
    const salvo = await salvarEstado(res.estado, 'Fechou o leilão de ' + dia + ', ' + data);
    if (!salvo) return;
    const dataFechada = r.data;
    App.rascunho = PH.rascunhoVazio(App.estado, PH.proximaData(App.estado, PH.hoje()));
    App.primeiraMontagem = true;
    await salvarRascunhoAgora();
    App.andou = true;
    render();
    App.andou = false;
    comemorar();
    toast('Leilão de ' + dia + ' fechado e gravado.');
    if (escolha.postar) postarResultado(e, m, dataFechada);
  }

  /* ---------- exportar ---------- */

  async function janelaImagem(gerar, titulo, nomeArquivo) {
    const h = abrirJanela({ titulo, larga: true, corpo: '<div class="carregando" style="padding:40px">' + I.emblema() + '<p>Desenhando a imagem…</p></div>' });
    let cv;
    try { cv = await gerar(); } catch (err) { h.fechar(); toast('Não consegui gerar a imagem: ' + err.message, 'erro'); return; }
    const url = cv.toDataURL('image/png');
    const dentroDeMoldura = U.noIframe();
    const corpo = h.$('.janela-corpo');
    corpo.innerHTML = '<img class="imagem-exportada" alt="' + esc(titulo) + '" src="' + url + '">' +
      '<p class="dica">' + (dentroDeMoldura ? 'Copie e cole no Discord, ou clique com o botão direito (no celular, segure) para salvar.' : 'Copie e cole direto no Discord, ou baixe o arquivo.') + '</p>' +
      '<div class="janela-acoes">' +
      (dentroDeMoldura ? '' : '<a class="btn" download="' + esc(nomeArquivo) + '" href="' + url + '">' + ic('download') + 'Baixar PNG</a>') +
      '<button type="button" class="btn btn-primario" id="copiar-imagem">' + ic('copiar') + 'Copiar imagem</button></div>';
    const blobPromessa = new Promise(ok => cv.toBlob(b => ok(b), 'image/png'));
    corpo.querySelector('#copiar-imagem').addEventListener('click', async () => {
      try {

    if (!f.length) html += vazio('Ninguém nesta fila.', staff ? 'Cadastre membros na aba Membros.' : '');
    else {
      html += '<ol class="lista-fila">' + f.map((m, i) => {

          '<span class="quem"><strong>' + esc(m.nick) + '</strong><span>' + esc(m.classe || 'Sem classe') + '</span></span>' +

  async function mudarPonteiro(itemId, membroId) {
    const e = App.estado, it = PH.item(e, itemId);
    const pos = PH.posicaoNaFila(e, itemId, membroId);
    const ok = await confirmar({
      titulo: 'Começar a fila do ' + it.curto + ' no nº ' + pos + '?',
      texto: '<p>O próximo leilão do ' + esc(it.nome) + ' passa a começar em <strong>' + esc(nick(membroId)) + '</strong>. Use isso para corrigir a vez, por exemplo depois de um leilão lançado errado.</p>',

    if (await salvarEstado(novo, 'Mudou o início da fila do ' + it.curto + ' para ' + nick(membroId))) toast('Fila do ' + it.curto + ' começa agora em ' + nick(membroId) + '.');
